<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#050505"><title>Manlung Offline Run</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:16px;background:#050505;color:#eee;font-family:system-ui,sans-serif}.wrap{width:min(680px,100%);text-align:center}.brand{font-size:40px;font-weight:950;letter-spacing:-.06em;background:linear-gradient(#fff,#999,#444);color:transparent;background-clip:text;-webkit-background-clip:text}p{color:#aaa;font-size:14px}.hud{display:flex;justify-content:space-between;font-size:13px;margin:12px 0}.stage{border:1px solid #333;border-radius:12px;overflow:hidden;background:#111}.stage canvas{display:block;width:100%;height:auto;touch-action:manipulation}.buttons{display:flex;justify-content:center;gap:12px;margin:14px}.buttons button{border:1px solid #666;border-radius:30px;padding:12px 20px;font-weight:bold;background:#181818;color:white}.buttons .main{background:#eee;color:#000}.status{font-size:12px;color:#e8c77a}</style></head><body><main class="wrap"><div class="brand">MANLUNG</div><h2 style="margin:0">OFFLINE RUN</h2><p>Internet gone? Jump the blocks. Tap the game, press SPACE, or use Start. It gets faster as you survive.</p><div class="hud"><span>Distance: <b id="score">0</b> m</span><span>Best: <b id="best">0</b> m</span><span id="state">READY</span></div><div class="stage"><canvas id="c" width="640" height="300"></canvas></div><div class="buttons"><button class="main" id="start">Start / Jump</button><button id="reset">Restart</button></div><div class="status" id="net">You're offline — the game works without Wi-Fi.</div><p>When connection returns, Manlung Recovery opens again automatically.</p></main><script>(()=>{const c=document.querySelector('#c'),x=c.getContext('2d'),score=document.querySelector('#score'),bestEl=document.querySelector('#best'),state=document.querySelector('#state'),net=document.querySelector('#net');let best=+(localStorage.mrunBest||0),run=false,started=false,dead=false,s=0,v=4.5,t=0,obs=[],p={x:75,y:218,w:25,h:34,vy:0,ground:true};bestEl.textContent=best;function reset(){run=started=dead=false;s=0;v=4.5;t=0;obs=[];p.y=218;p.vy=0;p.ground=true;score.textContent=0;state.textContent='READY';draw()}function jump(){if(dead)reset();if(!started){started=run=true;state.textContent='RUN!';return}if(p.ground){p.vy=-12.5;p.ground=false}}function draw(){x.clearRect(0,0,640,300);let g=x.createLinearGradient(0,0,0,300);g.addColorStop(0,'#191919');g.addColorStop(1,'#050505');x.fillStyle=g;x.fillRect(0,0,640,300);x.strokeStyle='#242424';for(let a=0;a<640;a+=32){x.beginPath();x.moveTo(a,0);x.lineTo(a,300);x.stroke()}x.fillStyle='#777';x.fillRect(0,252,640,2);x.fillStyle='#ccc';x.fillRect(p.x+5,p.y,15,15);x.fillStyle='#888';x.fillRect(p.x+2,p.y+15,20,17);x.fillStyle='#ddd';x.fillRect(p.x+15,p.y+4,3,3);obs.forEach(o=>{x.fillStyle='#bbb';x.fillRect(o.x,252-o.h,o.w,o.h);x.fillStyle='#555';x.fillRect(o.x+4,256-o.h,3,o.h-5)});x.textAlign='center';if(!started&&!dead){x.fillStyle='#eee';x.font='bold 20px system-ui';x.fillText('TAP TO START',320,145)}if(dead){x.fillStyle='#fff';x.font='bold 26px system-ui';x.fillText('RUN ENDED',320,135);x.font='14px system-ui';x.fillText('Tap Start / Jump to try again',320,160)}}function tick(){if(run){t++;s+=v*.035;v=Math.min(11,4.5+s/160);score.textContent=Math.floor(s);if(t%Math.max(27,Math.floor(75-s/5))===0)obs.push({x:650,w:18+Math.random()*15,h:22+Math.random()*Math.min(45,20+s/8)});p.vy+=.62;p.y+=p.vy;if(p.y>=218){p.y=218;p.vy=0;p.ground=true}obs.forEach(o=>o.x-=v);obs=obs.filter(o=>o.x+o.w>0);if(obs.some(o=>p.x+p.w-4>o.x&&p.x+4<o.x+o.w&&p.y+p.h>252-o.h+3)){run=false;dead=true;state.textContent='CRASH';if(Math.floor(s)>best){best=Math.floor(s);localStorage.mrunBest=best;bestEl.textContent=best}}}draw();requestAnimationFrame(tick)}c.addEventListener('pointerdown',jump);document.querySelector('#start').onclick=jump;document.querySelector('#reset').onclick=reset;addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}});function back(){let dest='/';try{dest=sessionStorage.getItem('manlungOfflineReturn')||'/';sessionStorage.removeItem('manlungOfflineReturn')}catch(e){}if(!dest.startsWith('/')||dest.startsWith('//'))dest='/';location.replace(dest)}addEventListener('online',()=>{net.textContent='Connection restored — opening the live site…';setTimeout(back,800)});addEventListener('offline',()=>net.textContent='Connection lost — keep playing!');if(navigator.onLine)setTimeout(back,500);reset();tick()})();</script></body></html>
