<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Donation Receipt · Manlung Recovery</title><meta name="robots" content="noindex,nofollow"><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#14263c;font-family:Inter,system-ui,Arial,sans-serif}.wrap{max-width:700px;margin:30px auto;padding:18px}.receipt{background:#fff;border:1px solid #dce5ef;border-radius:18px;padding:clamp(22px,5vw,40px);box-shadow:0 18px 50px #17385b12}.brand{font-size:.75rem;letter-spacing:.18em;font-weight:900;color:#177245}.amount{font-size:2.2rem;font-weight:900;margin:24px 0 6px}.muted{color:#6c7e91}.line{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #edf1f5;flex-wrap:wrap}.line strong{text-align:right;overflow-wrap:anywhere}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:24px}.btn{border:1px solid #d4deea;border-radius:9px;padding:10px 14px;background:#fff;color:#183b5d;text-decoration:none;font-weight:800;cursor:pointer}.primary{background:#17467a;color:#fff;border-color:#17467a}.state{padding:12px 0;color:#64748b}@media print{body{background:#fff}.wrap{margin:0;max-width:none}.receipt{box-shadow:none;border:0}.actions{display:none}}

<body class="client-donation-receipt"><main class="wrap"><article class="receipt"><div class="brand">MANLUNG RECOVERY</div><h1>Donation receipt</h1><div id="state" class="state">Loading receipt…</div><div id="details" hidden><div class="amount" id="amount"></div><p class="muted">Thank you for supporting Manlung Recovery.</p><div class="line"><span>Receipt number</span><strong id="reference"></strong></div><div class="line"><span>Donor</span><strong id="donor"></strong></div><div class="line"><span>Payment status</span><strong>Confirmed</strong></div><div class="line"><span>Payment date</span><strong id="paid"></strong></div><div class="actions"><button class="btn primary" onclick="window.print()">Print receipt</button><a class="btn" href="/donation-history.html">Back to history</a></div></div></article></main>
<script>
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
(async()=>{const ref=new URLSearchParams(location.search).get('reference')||'';if(!ref){document.getElementById('state').textContent='A donation reference is required.';return}try{const r=await fetch('/api/donations/receipt/'+encodeURIComponent(ref),{credentials:'include',cache:'no-store'});const d=await r.json().catch(()=>({}));if(r.status===401){location.href='/login?next='+encodeURIComponent(location.pathname+location.search);return}if(!r.ok){document.getElementById('state').textContent=d.pending?'Payment is '+(d.status||'pending')+'. Your receipt will be ready after confirmation.':(d.error||'Receipt unavailable.');return}const x=d.receipt||{};document.getElementById('state').textContent='Payment successfully confirmed';document.getElementById('amount').textContent='KES '+Number(x.amount_kes||0).toLocaleString('en-KE');document.getElementById('reference').textContent=x.receiptNumber||x.reference;document.getElementById('donor').textContent=x.donor_name||'Supporter';document.getElementById('paid').textContent=x.paid_at||x.created_at||'';document.getElementById('details').hidden=false}catch(e){document.getElementById('state').textContent='Could not load the receipt. Please try again.'}})();
</script><script src="/js/client-portal-chrome.js?v=20261106c" defer></script></body></html>
