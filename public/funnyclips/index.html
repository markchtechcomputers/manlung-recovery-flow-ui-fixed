<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Manlung Remote Support</title>
<style>
body{margin:0;background:#fff;color:#111827;font-family:Inter,system-ui,sans-serif;min-height:100vh}.wrap{max-width:650px;margin:auto;padding:28px 18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px;box-shadow:0 15px 45px rgba(0,0,0,.08)}h1{margin:0 0 8px}.muted{color:#94a3b8;font-size:.85rem;line-height:1.6}.form{display:grid;gap:10px;margin-top:18px}.form input,.form select{min-height:44px;padding:10px;border-radius:10px;border:1px solid #334155;background:#fff;color:#111827}.btn{min-height:42px;border:0;border-radius:10px;padding:9px 14px;font-weight:800;cursor:pointer}.primary{background:#2563eb;color:#fff}.danger{background:#dc2626;color:#fff}.request{margin-top:18px;padding:16px;border:1px solid #bfdbfe;border-radius:14px;background:#eff6ff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.hidden{display:none}.indicator{margin-top:18px;padding:12px;border-radius:10px;background:#f3f4f6;color:#374151;font-size:.8rem}.active{border:1px solid #22c55e;color:#166534;background:#f0fdf4}
</style>
</head>
<body><main class="wrap"><section class="card">
<h1>Manlung</h1>
<div id="setup"><div id="linkReady" class="indicator hidden" style="margin-top:0"><strong>Connection request</strong></div><div class="form"><div id="manualFields"><input id="token" placeholder="Paste enrollment token"><input id="name" placeholder="Device name"><select id="platform"><option value="windows">Windows</option><option value="macos">macOS</option><option value="android">Android</option><option value="ios">iPhone / iPad</option><option value="linux">Linux</option><option value="other">Other</option></select></div><button class="btn primary" id="enroll">Accept & Connect</button></div></div>
<div id="connected" class="hidden"><div class="indicator active">Connected</div><div id="request" class="request hidden"><strong>Remote viewing request</strong><p id="requestText" class="muted"></p><label class="muted"><input type="checkbox" id="allowAudio"> Share audio</label><div class="actions"><button class="btn danger" id="decline">Decline</button><button class="btn primary" id="approve">Approve &amp; Share Screen</button></div></div><div id="active" class="indicator hidden active">Remote support active</div><div class="actions"><button class="btn danger hidden" id="stop">Stop Sharing</button></div></div>
<div id="status" class="indicator">Waiting for enrollment.</div>
</section></main>
<script>
const api='/api/remote-desktop';let deviceToken=localStorage.getItem('mrd_device_token')||'',deviceId=localStorage.getItem('mrd_device_id')||'',pending=null,pc=null,lastSignal=0,poll=null,stream=null;
const $=id=>document.getElementById(id);
async function apiFetch(path,opts={},useDeviceAuth=true){const headers={'Content-Type':'application/json',...(useDeviceAuth&&deviceToken?{Authorization:'Bearer '+deviceToken}:{}),...(opts.headers||{})};const r=await fetch(api+path,{credentials:'include',...opts,headers});const j=await r.json().catch(()=>({}));if(!r.ok){const err=new Error(j.error||'Request failed');err.status=r.status;throw err}return j}
function clearSavedDevice(){deviceToken='';deviceId='';localStorage.removeItem('mrd_device_token');localStorage.removeItem('mrd_device_id');pending=null;if(poll){clearTimeout(poll);poll=null}}
function showSetup(message='Ready to connect this device.'){ $('connected').classList.add('hidden');$('setup').classList.remove('hidden');status(message)}
function status(t){$('status').textContent=t}
function showConnected(){ $('setup').classList.add('hidden');$('connected').classList.remove('hidden')}
const enrollmentFromLink=new URLSearchParams(window.location.search).get('token')||'';if(enrollmentFromLink){$('token').value=enrollmentFromLink;$('manualFields').style.display='none';$('linkReady').classList.remove('hidden');$('enroll').textContent='Accept & Connect';}
$('enroll').onclick=async()=>{try{const token=$('token').value.trim();if(!token){status('Use the enrollment link provided by the authorized administrator.');return}const j=await apiFetch('/device/enroll',{method:'POST',body:JSON.stringify({enrollmentToken:token,deviceName:$('name').value.trim()||null,platform:$('platform').value||null})},false);deviceToken=j.deviceToken;deviceId=j.device.id;localStorage.setItem('mrd_device_token',deviceToken);localStorage.setItem('mrd_device_id',deviceId);history.replaceState({},document.title,'/funnyclips');showConnected();status('Connected');start()}catch(e){status(e.message)}};
async function heartbeat(){try{await apiFetch('/device/heartbeat',{method:'POST',body:'{}'});return true}catch(e){if(e.status===401){clearSavedDevice();showSetup('Connection expired. Open a fresh enrollment link.');return false}status(e.message);return false}}
async function start(){showConnected();const ok=await heartbeat();if(!ok)return;setInterval(heartbeat,10000);await restoreActiveSession();pollRequests()}
async function restoreActiveSession(){try{const j=await apiFetch('/device/sessions/active');if(j.session){pending=j.session;status('Remote session connected. Waiting for screen sharing.');if(stream)await beginPeerOffer();}}catch(e){if(e.status===401){clearSavedDevice();showSetup('Connection expired. Open a fresh enrollment link.')}}}
async function pollRequests(){try{const active=await apiFetch('/device/sessions/active');if(active.session){pending=active.session;const sig=await apiFetch('/device/sessions/'+pending.id+'/signals?after='+lastSignal);await handleSignals(sig.signals)}const j=await apiFetch('/device/sessions/pending');if(j.sessions.length&&!pending){pending=j.sessions[0];$('request').classList.remove('hidden');$('requestText').textContent='Administrator wants to connect.'}if(pending){const s=await apiFetch('/device/sessions/'+pending.id+'/signals?after='+lastSignal);await handleSignals(s.signals);const session=await apiFetch('/device/sessions/'+pending.id);if(['ended','expired','rejected'].includes(session.session.status)){finish();}}}catch(e){if(e.status===401){clearSavedDevice();showSetup('Connection expired. Open a fresh enrollment link.');return}status(e.message)}poll=setTimeout(pollRequests,1200)}
async function respond(approved){const id=pending.id;try{if(!approved){await apiFetch('/device/sessions/'+id+'/respond',{method:'POST',body:JSON.stringify({approved:false,approvedAudio:false})});finish();return}await beginCapture();const j=await apiFetch('/device/sessions/'+id+'/respond',{method:'POST',body:JSON.stringify({approved:true,approvedAudio:$('allowAudio').checked})});pending=j.session;$('request').classList.add('hidden');status('Remote support active');await beginPeerOffer()}catch(e){status(e.message);$('request').classList.remove('hidden')}}
$('decline').onclick=()=>respond(false);
$('approve').onclick=()=>respond(true);
async function beginPeerOffer(){if(!pending||!stream)return;if(pc){pc.close();pc=null}pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.onicecandidate=e=>{if(e.candidate)send('ice-candidate',e.candidate.toJSON()).catch(()=>{})};const offer=await pc.createOffer();await pc.setLocalDescription(offer);await send('offer',offer)}
async function beginCapture(){try{
  const wantAudio=$('allowAudio').checked;
  try{
    stream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:wantAudio,systemAudio:wantAudio});
  }catch(firstError){
    if(!wantAudio)throw firstError;
    stream=await navigator.mediaDevices.getDisplayMedia({video:true});
    status('Screen sharing started without audio');
  }
  $('active').classList.remove('hidden');$('stop').classList.remove('hidden');
  const videoTrack=stream.getVideoTracks()[0];
  if(videoTrack)videoTrack.onended=()=>{if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}if(pc){pc.close();pc=null}$('active').classList.add('hidden');$('stop').classList.add('hidden');status('Screen sharing stopped. Device remains connected.')};
}catch(e){
  status('Screen sharing could not start: '+e.message);
  $('request').classList.remove('hidden');
  $('requestText').textContent='Try approving screen sharing again.';
}}
async function send(event,payload){if(!pending)return;await apiFetch('/device/sessions/'+pending.id+'/signals',{method:'POST',body:JSON.stringify({event,payload})})}
async function handleSignals(signals){for(const s of signals){lastSignal=s.id;if(s.sender_role!=='admin')continue;if(s.event==='answer'&&pc)await pc.setRemoteDescription(s.payload);if(s.event==='ice-candidate'&&pc){try{await pc.addIceCandidate(s.payload)}catch{}}if(s.event==='ready'&&stream)await beginPeerOffer();if(s.event==='stop')stopSession('admin_ended')}}
async function respondEnd(reason){if(pending)try{await apiFetch('/device/sessions/'+pending.id+'/end',{method:'POST',body:JSON.stringify({reason})})}catch{}finish()}
async function stopSession(reason){if(stream)stream.getTracks().forEach(t=>t.stop());await respondEnd(reason)}
$('stop').onclick=()=>stopSession('device_ended');
function finish(){if(pc){pc.close();pc=null}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('active').classList.add('hidden');$('stop').classList.add('hidden');$('request').classList.add('hidden');pending=null;lastSignal=0;status('Connected')}
if(deviceToken){showConnected();start()} document.addEventListener('visibilitychange',()=>{if(!document.hidden&&deviceToken)heartbeat().catch(()=>{})});
</script></body></html>
