<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="/js/theme.js"></script>
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Signing you in… · Manlung Recovery</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .oauth-callback-wrap { min-height: 76vh; display: grid; place-items: center; padding: 2rem 1rem; }
        .oauth-callback-card { max-width: 460px; width: 100%; text-align: center; padding: clamp(2rem, 6vw, 3rem) 2rem; border-radius: 24px; }
        .oauth-spinner { width: 58px; height: 58px; margin: 0 auto 1.5rem; border-radius: 50%; border: 4px solid rgba(100,116,139,.2); border-top-color: #5865F2; border-right-color: #5865F2; animation: oauth-spin .85s linear infinite; }
        .oauth-callback-card h2 { margin: 0 0 .65rem; font-size: clamp(1.35rem, 4vw, 1.7rem); letter-spacing: -.025em; }
        .oauth-callback-card p { margin: 0; line-height: 1.65; }
        .oauth-error { color: var(--danger); }
        .oauth-back { display: inline-flex; margin-top: 1.25rem; }
        @keyframes oauth-spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { .oauth-spinner { animation-duration: 2.5s; } }
    </style>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/footer.css">
    <script src="/js/support-fab.js"></script>
    <link rel="stylesheet" href="/css/unified-ui.css">
    <meta name="description" content="Cyber Recovery &amp; Digital Investigation Portal">
    <meta name="theme-color" content="#ffffff">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Manlung Recovery">
    <meta property="og:description" content="Cyber Recovery &amp; Digital Investigation Portal">
    <meta property="og:image" content="https://manlungrecovery.manlungshop.co.ke/icons/icon-512.png">
    <meta property="og:image:secure_url" content="https://manlungrecovery.manlungshop.co.ke/icons/icon-512.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="512">
    <meta property="og:image:height" content="512">
    <meta property="og:url" content="https://manlungrecovery.manlungshop.co.ke/">
    <meta property="og:site_name" content="Manlung Recovery">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Manlung Recovery">
    <meta name="twitter:description" content="Cyber Recovery &amp; Digital Investigation Portal">
    <meta name="twitter:image" content="https://manlungrecovery.manlungshop.co.ke/icons/icon-512.png">
</head>
<body>
    <main class="container oauth-callback-wrap">
        <section class="card oauth-callback-card" aria-live="polite">
            <div class="oauth-spinner" id="oauthSpinner" role="status" aria-label="Signing in"></div>
            <h2 id="title" hidden></h2>
            <p id="status" style="color:var(--text-muted);">Please wait while we securely verify your account and prepare your dashboard.</p>
            <a id="backLink" class="btn btn-primary oauth-back" href="/login.html" style="display:none;">Back to Sign In</a>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const CALLBACK_TIMEOUT_MS = 15000;

        const oauthProvider = (() => { try { return sessionStorage.getItem('manlungOAuthProvider') || 'social'; } catch (_) { return 'social'; } })();
        const providerLabel = oauthProvider === 'discord' ? 'Discord' : oauthProvider === 'github' ? 'GitHub' : 'social';

        function showError(message, redirect) {
            const title = document.getElementById('title');
            const status = document.getElementById('status');
            const backLink = document.getElementById('backLink');

            if (redirect) {
                title.textContent = 'Admin account detected';
                status.textContent = message || 'This email belongs to an Admin or Owner account.';
                backLink.href = redirect;
                backLink.textContent = 'Continue to Admin Sign In';
                backLink.style.display = 'inline-flex';
                return;
            }

            title.textContent = `${providerLabel === 'social' ? 'Social' : providerLabel} sign-in failed`;
            status.textContent = message || 'Please return to sign in and try again.';
            status.classList.add('oauth-error');
            const spinner = document.getElementById('oauthSpinner');
            if (spinner) spinner.style.display = 'none';
            backLink.href = '/login.html';
            backLink.textContent = 'Back to Sign In';
            backLink.style.display = 'inline-flex';
        }

        function clearOAuthUrl() {
            try {
                window.history.replaceState({}, document.title, `${window.location.origin}/oauth-callback.html`);
            } catch (_) {}
        }

        async function fetchJson(url, options) {
            const response = await fetch(url, options);
            let data = {};
            try { data = await response.json(); } catch (_) {}
            if (!response.ok) {
                const error = new Error(data.error || 'The authentication request could not be completed.');
                error.redirect = data.redirect || '';
                error.accountRole = data.accountRole || '';
                throw error;
            }
            return data;
        }

        async function processCallback() {
            const config = await fetchJson('/api/config/public', { cache: 'no-store' });
            if (!config.supabaseUrl || !config.supabaseAnonKey) throw new Error('Social sign-in is not configured.');
            if (!window.supabase) throw new Error('Authentication library could not be loaded.');

            const client = window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey, {
                auth: {
                    persistSession: true,
                    autoRefreshToken: true,
                    detectSessionInUrl: true,
                    flowType: 'implicit',
                    storage: window.localStorage
                }
            });

            const url = new URL(window.location.href);
            const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
            const hashError = hashParams.get('error_description') || hashParams.get('error');

            if (hashError) {
                clearOAuthUrl();
                throw new Error(hashError);
            }

            let session = null;
            const { data: restored, error: restoreError } = await client.auth.getSession();
            if (restoreError) throw restoreError;
            session = restored?.session || null;

            if (!session?.access_token) {
                await new Promise(resolve => setTimeout(resolve, 500));
                const { data: retryData, error: retryError } = await client.auth.getSession();
                if (retryError) throw retryError;
                session = retryData?.session || null;
            }

            if (!session?.access_token) {
                throw new Error(`${providerLabel === 'social' ? 'Social' : providerLabel} authentication completed, but the secure session could not be restored. Please try again.`);
            }

            clearOAuthUrl();

            const appSession = await fetchJson('/api/auth/client/oauth', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ accessToken: session.access_token })
            });

            if (!appSession.success || !appSession.user) {
                throw new Error(`Could not complete ${providerLabel === 'social' ? 'social' : providerLabel} sign-in.`);
            }

            localStorage.setItem('clientUser', JSON.stringify(appSession.user));
            await client.auth.signOut();
            try { sessionStorage.removeItem('manlungOAuthProvider'); } catch (_) {}
            clearOAuthUrl();
            window.location.replace('/client/dashboard.html');
        }

        (async function runCallback() {
            try {
                await Promise.race([
                    processCallback(),
                    new Promise((_, reject) => setTimeout(() => reject(new Error('The sign-in process timed out. Please try again.')), CALLBACK_TIMEOUT_MS))
                ]);
            } catch (error) {
                console.error('OAuth callback error:', error?.message || 'Authentication callback failed.');
                showError(error?.message || 'Authentication failed. Please try again.', error?.redirect || '');
            }
        })();
    </script>
</body>
</html>
