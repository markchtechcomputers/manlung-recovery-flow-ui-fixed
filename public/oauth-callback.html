<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Signing you in… · Manlung Tech City</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .oauth-callback-wrap { min-height: 70vh; display: grid; place-items: center; padding: 2rem 1rem; }
        .oauth-callback-card { max-width: 460px; width: 100%; text-align: center; }
        .oauth-spinner {
            width: 34px; height: 34px; margin: 0 auto 1rem;
            border: 3px solid var(--card-border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: oauthSpin .8s linear infinite;
        }
        .oauth-error { color: var(--danger); }
        .oauth-back { display: inline-flex; margin-top: 1rem; }
        @keyframes oauthSpin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) {
            .oauth-spinner { animation: none; }
        }
    </style>
</head>
<body>
    <main class="container oauth-callback-wrap">
        <section class="card oauth-callback-card" aria-live="polite">
            <div id="spinner" class="oauth-spinner" aria-hidden="true"></div>
            <h2 id="title">Signing you in securely…</h2>
            <p id="status" style="color:var(--text-muted);">Verifying your account securely.</p>
            <a id="backLink" class="btn btn-primary oauth-back" href="/login.html" style="display:none;">Back to Sign In</a>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const CALLBACK_TIMEOUT_MS = 15000;

        function showError(message) {
            const title = document.getElementById('title');
            const status = document.getElementById('status');
            const spinner = document.getElementById('spinner');
            const backLink = document.getElementById('backLink');

            spinner.style.display = 'none';
            title.textContent = 'Social sign-in failed';
            status.textContent = message || 'Please return to sign in and try again.';
            status.classList.add('oauth-error');
            backLink.style.display = 'inline-flex';
        }

        function clearOAuthUrl() {
            try {
                window.history.replaceState({}, document.title, `${window.location.origin}/oauth-callback.html`);
            } catch (_) {
                // The callback can still complete if history manipulation is unavailable.
            }
        }

        async function fetchJson(url, options) {
            const response = await fetch(url, options);
            let data = {};
            try { data = await response.json(); } catch (_) {}
            if (!response.ok) {
                throw new Error(data.error || 'The authentication request could not be completed.');
            }
            return data;
        }

        async function processCallback() {
            const config = await fetchJson('/api/config/public', { cache: 'no-store' });
            if (!config.supabaseUrl || !config.supabaseAnonKey) {
                throw new Error('Social sign-in is not configured.');
            }
            if (!window.supabase) {
                throw new Error('Authentication library could not be loaded.');
            }

            const client = window.supabase.createClient(
                config.supabaseUrl,
                config.supabaseAnonKey,
                {
                    auth: {
                        persistSession: true,
                        autoRefreshToken: true,
                        detectSessionInUrl: true,
                        flowType: 'pkce'
                    }
                }
            );

            const url = new URL(window.location.href);
            const code = url.searchParams.get('code');
            const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
            const hashError = hashParams.get('error_description') || hashParams.get('error');

            // Capture OAuth data before removing it from the address bar.
            if (hashError) {
                clearOAuthUrl();
                throw new Error('The social provider returned an authentication error.');
            }

            if (code) {
                // PKCE/code flow: exchange the one-time code explicitly.
                const { error } = await client.auth.exchangeCodeForSession(code);
                clearOAuthUrl();
                if (error) throw error;
            } else {
                const accessToken = hashParams.get('access_token');
                const refreshToken = hashParams.get('refresh_token');

                if (accessToken) {
                    // Legacy/implicit Supabase hash flow.
                    const { error } = await client.auth.setSession({
                        access_token: accessToken,
                        refresh_token: refreshToken || ''
                    });
                    clearOAuthUrl();
                    if (error) throw error;
                } else {
                    // Existing browser session flow, if Supabase already restored it.
                    clearOAuthUrl();
                }
            }

            const { data: sessionData, error: sessionError } = await client.auth.getSession();
            if (sessionError) throw sessionError;

            const session = sessionData?.session;
            if (!session?.access_token) {
                throw new Error('No social sign-in session was found. Please try again.');
            }

            // Send only the access token required by the existing backend OAuth endpoint.
            // Never log or expose this token.
            const appSession = await fetchJson('/api/auth/client/oauth', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ accessToken: session.access_token })
            });

            if (!appSession.success || !appSession.token || !appSession.user) {
                throw new Error('Could not complete social sign-in.');
            }

            localStorage.setItem('clientToken', appSession.token);
            localStorage.setItem('clientUser', JSON.stringify(appSession.user));

            await client.auth.signOut();
            clearOAuthUrl();
            window.location.replace('/client/dashboard.html');
        }

        (async function runCallback() {
            try {
                await Promise.race([
                    processCallback(),
                    new Promise((_, reject) =>
                        setTimeout(() => reject(new Error('The sign-in process timed out. Please try again.')), CALLBACK_TIMEOUT_MS)
                    )
                ]);
            } catch (error) {
                console.error('OAuth callback error:', error?.message || 'Authentication callback failed.');
                showError('Please return to sign in and try again.');
            }
        })();
    </script>
</body>
</html>
