        .oauth-error { color: var(--danger); }
        .oauth-back { display: inline-flex; margin-top: 1rem; }
    </style>

    <link rel="stylesheet" href="/css/footer.css">
    <script src="/js/support-fab.js"></script>
    <link rel="stylesheet" href="/css/unified-ui.css">

    <meta name="theme-color" content="#ffffff">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Manlung Recovery">
    <meta property="og:description" content="Cyber Recovery &amp; Digital Investigation Portal">

    <meta name="twitter:title" content="Manlung Recovery">

    <meta name="twitter:image" content="https://manlungrecovery.manlungshop.co.ke/icons/icon-512.png">
</head>
<body>
    <main class="container oauth-callback-wrap">
        <section class="card oauth-callback-card" aria-live="polite">
            <h2 id="title">Signing you in securely…</h2>
            <p id="status" style="color:var(--text-muted);">Verifying your GitHub account securely.</p>
            <a id="backLink" class="btn btn-primary oauth-back" href="/login.html" style="display:none;">Back to Sign In</a>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const CALLBACK_TIMEOUT_MS = 15000;

        function showError(message, redirect) {
            const title = document.getElementById('title');
            const status = document.getElementById('status');
            const backLink = document.getElementById('backLink');

            if (redirect) {
                title.textContent = 'Admin account detected';
                status.textContent = message || 'This email belongs to an Admin or Owner account.';
                backLink.href = redirect;
                backLink.textContent = 'Continue to Admin Sign In';
                backLink.style.display = 'inline-flex';
                return;
            }

            title.textContent = 'GitHub sign-in failed';
            status.textContent = message || 'Please return to sign in and try again.';
            status.classList.add('oauth-error');
            backLink.href = '/login.html';
            backLink.textContent = 'Back to Sign In';
            backLink.style.display = 'inline-flex';
        }

        function clearOAuthUrl() {
            try {
                window.history.replaceState({}, document.title, `${window.location.origin}/oauth-callback.html`);
            } catch (_) {}
        }

        async function fetchJson(url, options) {
            const response = await fetch(url, options);
            let data = {};
            try { data = await response.json(); } catch (_) {}
            if (!response.ok) {
                const error = new Error(data.error || 'The authentication request could not be completed.');
                error.redirect = data.redirect || '';
                error.accountRole = data.accountRole || '';
                throw error;
            }
            return data;
        }

        // Native Android OAuth returns through this HTTPS callback, then deep-links
        // back into the installed app. Keep the query/hash intact for PKCE exchange.
        const nativeOAuthReturn = (() => {
            const callbackUrl = new URL(window.location.href);
            if (callbackUrl.searchParams.get('native') !== '1') return false;
            callbackUrl.searchParams.delete('native');
            window.location.replace('co.manlungrecovery.app://auth/callback' + callbackUrl.search + callbackUrl.hash);
            return true;
        })();

        async function processCallback() {
            const config = await fetchJson('/api/config/public', { cache: 'no-store' });
            if (!config.supabaseUrl || !config.supabaseAnonKey) throw new Error('Social sign-in is not configured.');
            if (!window.supabase) throw new Error('Authentication library could not be loaded.');

            const client = window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey, {
                auth: {
                    persistSession: true,
                    autoRefreshToken: true,
                    detectSessionInUrl: false,
                    flowType: 'pkce',
                    storage: window.localStorage
                }
            });

            const url = new URL(window.location.href);
            const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
            const callbackError = url.searchParams.get('error_description') ||
                url.searchParams.get('error') ||
                hashParams.get('error_description') ||
                hashParams.get('error');

            if (callbackError) {
                clearOAuthUrl();
                throw new Error(callbackError);
            }

            let session = null;
            const authorizationCode = url.searchParams.get('code');

            // Supabase now returns PKCE authorization codes. Exchange the code
            // explicitly before asking the backend to create the Manlung session.
            if (authorizationCode) {
                const { data: exchanged, error: exchangeError } =
                    await client.auth.exchangeCodeForSession(authorizationCode);
                if (exchangeError) throw exchangeError;
                session = exchanged?.session || null;
            } else {
                // Backward compatibility for older implicit-flow callback links.
                const accessToken = url.searchParams.get('access_token') || hashParams.get('access_token');
                const refreshToken = url.searchParams.get('refresh_token') || hashParams.get('refresh_token');
                if (accessToken && refreshToken) {
                    const { data: restoredTokens, error: tokenError } =
                        await client.auth.setSession({ access_token: accessToken, refresh_token: refreshToken });
                    if (tokenError) throw tokenError;
                    session = restoredTokens?.session || null;
                } else {
                    const { data: restored, error: restoreError } = await client.auth.getSession();
                    if (restoreError) throw restoreError;
                    session = restored?.session || null;
                }
            }

            if (!session?.access_token) {
                throw new Error('Social sign-in completed, but the secure session could not be restored. Please return to sign in and try again.');
            }

            clearOAuthUrl();

            const appSession = await fetchJson('/api/auth/client/oauth', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ accessToken: session.access_token })
            });

            if (!appSession.success || !appSession.user) {
                throw new Error('Could not complete GitHub sign-in.');
            }

            localStorage.setItem('clientUser', JSON.stringify(appSession.user));
            await client.auth.signOut();
            clearOAuthUrl();
            window.location.replace('/client/dashboard.html');
        }

        if (!nativeOAuthReturn) {
        (async function runCallback() {
            try {
                await Promise.race([
                    processCallback(),
                    new Promise((_, reject) => setTimeout(() => reject(new Error('The sign-in process timed out. Please try again.')), CALLBACK_TIMEOUT_MS))
                ]);
            } catch (error) {
                console.error('OAuth callback error:', error?.message || 'Authentication callback failed.');
                showError(error?.message || 'Authentication failed. Please try again.', error?.redirect || '');
            }
        })();
        }
    </script>
  <link rel="stylesheet" href="/css/product-polish.css?v=20261025">
</body>
</html>
