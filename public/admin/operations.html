<body>
<main class="wrap">
<header class="top"><div><h1>Operations</h1><p>Live case queue, SLA visibility and investigator workload.</p></div><div class="actions"><a class="btn" href="/admin/dashboard.html">Dashboard</a><a class="btn" href="/admin/reports.html">Reports</a><a class="btn" href="/admin/tools.html">Tools</a><a class="btn" href="/admin/owner.html">Owner Tools</a><button class="btn primary" id="refresh">Refresh</button></div></header>
<div id="status" class="status">Loading operations…</div>
<section class="grid"><section class="card"><h2>Case Queue</h2><div class="filters"><select id="statusFilter"><option value="active">Active</option><option value="closed">Closed</option><option value="all">All</option></select><select id="priorityFilter"><option value="all">All priorities</option><option value="urgent">Urgent</option><option value="high">High</option><option value="normal">Normal</option><option value="low">Low</option></select><select id="assigneeFilter"><option value="all">All assigned</option><option value="me">My cases</option></select></div><div id="queue" class="queue"></div></section>
<section class="card"><h2>Team Workload</h2><div id="workload"></div></section></section>
</main>
<script>
const $=id=>document.getElementById(id); const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const transitions={"Pending Review":["Accepted","Rejected"],"Accepted":["Under Investigation","Awaiting Customer Response","Closed","Rejected"],"Under Investigation":["Evidence Collected","Awaiting Customer Response","Recovery Successful","Recovered by Police","Recovered by Owner","Closed"],"Evidence Collected":["Under Investigation","Awaiting Customer Response","Recovery Successful","Recovered by Police","Recovered by Owner","Closed"],"Awaiting Customer Response":["Under Investigation","Evidence Collected","Closed"],"Recovery Successful":["Closed"],"Recovered by Police":["Closed"],"Recovered by Owner":["Closed"],"Closed":["Under Investigation","Accepted"],"Rejected":["Pending Review","Accepted"]};
async function api(url,options={}){const r=await fetch(url,{credentials:'include',headers:{'Content-Type':'application/json',...(options.headers||{})},...options});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||`Request failed (${r.status})`);return d}
function renderQueue(cases){if(!cases.length){$('queue').innerHTML='<div class="empty">No cases match these filters.</div>';return} $('queue').innerHTML=cases.map(c=>{const opts=(transitions[c.status]||[]).map(x=>`<option>${esc(x)}</option>`).join('');return `<article class="case"><div class="case-head"><div><div class="case-id">${esc(c.case_id)}</div><div class="meta"><span class="pill">${esc(c.status)}</span><span class="pill ${esc(c.priority||'normal')}" >${esc(c.priority||'normal')}</span><span class="pill ${esc(c.sla_state)}">SLA: ${esc(c.sla_state)}</span></div></div><span class="meta">${esc(c.assigned_admin_id||'Unassigned')}</span></div><div class="case-actions">${opts?`<select data-case="${esc(c.case_id)}" class="next-status">${opts}</select><button class="btn primary change" data-case="${esc(c.case_id)}">Update</button>`:''}<button class="btn inspect" data-case="${esc(c.case_id)}">Case Analyzer</button><a class="btn" href="/admin/dashboard.html">Open Dashboard</a></div></article>`}).join('');document.querySelectorAll('.change').forEach(b=>b.onclick=async()=>{const id=b.dataset.case;const sel=document.querySelector(`.next-status[data-case="${CSS.escape(id)}"]`);b.disabled=true;try{await api(`/api/operations/cases/${encodeURIComponent(id)}/lifecycle`,{method:'PATCH',body:JSON.stringify({status:sel.value})});await load()}catch(e){alert(e.message)}finally{b.disabled=false}})}
function renderWorkload(admins){$('workload').innerHTML=(admins||[]).map(a=>{const pct=Math.min((a.active||0)/10*100,100);return `<div class="admin-row"><strong>${esc(a.username||a.email||'Unknown admin')}</strong><div class="meta"><span>${esc(a.role)}</span><span>${a.active||0} active</span><span>${a.overdue||0} overdue</span><span>${a.urgent||0} urgent</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>`}).join('')||'<div class="empty">No workload data.</div>'}
function openAnalyzer(caseId){api('/api/cases/admin/case/'+encodeURIComponent(caseId)).then(function(data){var c=data.case||{};var files=Array.isArray(c.files)?c.files:[];var images=files.filter(function(f){return String(f.mimetype||'').indexOf('image/')===0;});var overlay=document.createElement('div');overlay.id='analyzerOverlay';overlay.style='position:fixed;inset:0;background:rgba(2,6,23,.72);z-index:1000;overflow:auto;padding:20px;';var box=document.createElement('section');box.className='card';box.style='max-width:1000px;margin:20px auto;';var title=document.createElement('h2');title.textContent='Case Analyzer · '+(c.case_id||caseId);box.appendChild(title);var details=document.createElement('div');details.innerHTML='<strong>Case details</strong><p style="white-space:pre-wrap">'+esc(c.incident_desc||'No incident description provided.')+'</p><div class="meta">Status: '+esc(c.status||'')+' · Priority: '+esc(c.priority||'normal')+' · Client: '+esc(c.client_name||'')+'</div>';box.appendChild(details);var heading=document.createElement('h3');heading.textContent='Evidence images ('+images.length+')';box.appendChild(heading);if(!images.length){var empty=document.createElement('div');empty.className='empty';empty.textContent='No image evidence attached to this case.';box.appendChild(empty);}images.forEach(function(f){var card=document.createElement('article');card.className='case';var img=document.createElement('img');img.src=f.url||'';img.alt=f.originalName||f.filename||'Case evidence image';img.style='width:100%;max-height:520px;object-fit:contain;border-radius:10px;background:var(--op-bg);';card.appendChild(img);var meta=document.createElement('div');meta.className='meta';meta.textContent=(f.originalName||f.filename||'Evidence image')+' · '+(f.uploadedBy||'unknown')+' · '+(f.uploadedAt||'');card.appendChild(meta);if(currentAdmin&&currentAdmin.role==='owner'){var del=document.createElement('button');del.className='btn';del.style='margin-top:8px;border-color:#dc2626;color:#dc2626';del.textContent='Delete image';del.onclick=function(){deleteCaseEvidence(caseId,f.path);};card.appendChild(del);}box.appendChild(card);});var close=document.createElement('button');close.className='btn';close.textContent='Close';close.onclick=function(){overlay.remove();};box.insertBefore(close,box.firstChild);overlay.appendChild(box);document.body.appendChild(overlay);}).catch(function(e){alert(e.message||'Could not load case evidence.');});}function deleteCaseEvidence(caseId,path){if(!currentAdmin||currentAdmin.role!=='owner'){alert('Only the Owner can delete case images.');return;}if(!confirm('Delete this case image permanently?'))return;api('/api/cases/admin/case/'+encodeURIComponent(caseId)+'/file',{method:'DELETE',body:JSON.stringify({path:path})}).then(function(){document.getElementById('analyzerOverlay')?.remove();openAnalyzer(caseId);}).catch(function(e){alert(e.message||'Could not delete case image.');});}
async function load(){ $('status').textContent='Refreshing live operations…';try{const q=new URLSearchParams({status:$('statusFilter').value,priority:$('priorityFilter').value,assignee:$('assigneeFilter').value});const [queue,work]=await Promise.all([api('/api/operations/queue?'+q),api('/api/operations/workload')]);renderQueue(queue.cases||[]);renderWorkload(work.admins||[]);$('status').textContent='Live data loaded · '+new Date().toLocaleTimeString()}catch(e){$('status').textContent=e.message;$('queue').innerHTML='<div class="empty">Operations data could not be loaded.</div>'}}
document.querySelectorAll('.inspect').forEach(function(b){b.onclick=function(){openAnalyzer(b.dataset.case);};});
$('refresh').onclick=load;['statusFilter','priorityFilter','assigneeFilter'].forEach(id=>$(id).onchange=load);load();setInterval(load,60000);
</script>
