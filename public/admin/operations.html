<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Operations · Manlung Recovery</title>
<link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css"><script src="/js/theme.js"></script>
<style>
:root{--op-bg:#f8fafc;--op-card:#fff;--op-text:#0f172a;--op-muted:#64748b;--op-line:#e2e8f0;--op-blue:#2563eb;--op-green:#16a34a;--op-red:#dc2626;--op-amber:#f59e0b}
html.dark{--op-bg:#0b0f19;--op-card:#111827;--op-text:#f8fafc;--op-muted:#94a3b8;--op-line:#334155}
*{box-sizing:border-box}body{margin:0;background:var(--op-bg);color:var(--op-text);font-family:Inter,system-ui,sans-serif}.wrap{max-width:1240px;margin:auto;padding:28px 20px 50px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:22px}.top h1{margin:0;font-size:clamp(1.5rem,3vw,2.1rem)}.top p{margin:.35rem 0 0;color:var(--op-muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--op-line);background:var(--op-card);color:var(--op-text);padding:10px 14px;border-radius:10px;text-decoration:none;font-weight:750;cursor:pointer}.btn.primary{background:var(--op-blue);border-color:var(--op-blue);color:#fff}.grid{display:grid;grid-template-columns:1.7fr 1fr;gap:18px}.card{background:var(--op-card);border:1px solid var(--op-line);border-radius:16px;padding:18px;box-shadow:0 8px 28px rgba(15,23,42,.04)}.card h2{margin:0 0 14px;font-size:1.05rem}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.filters select,.filters input{min-height:40px;border:1px solid var(--op-line);border-radius:9px;background:var(--op-card);color:var(--op-text);padding:8px 10px}.table-wrap{overflow:auto}.queue{display:grid;gap:10px}.case{border:1px solid var(--op-line);border-radius:12px;padding:13px}.case-head{display:flex;justify-content:space-between;gap:10px;align-items:start}.case-id{font-weight:850}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:7px;color:var(--op-muted);font-size:.8rem}.pill{padding:4px 8px;border-radius:999px;background:var(--op-bg);border:1px solid var(--op-line)}.pill.urgent,.pill.breached{color:var(--op-red);border-color:#fecaca}.pill.at_risk{color:#b45309;border-color:#fde68a}.pill.on_track{color:var(--op-green);border-color:#bbf7d0}.case-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.case-actions select{border:1px solid var(--op-line);border-radius:8px;background:var(--op-card);color:var(--op-text);padding:7px}.admin-row{padding:12px 0;border-bottom:1px solid var(--op-line)}.admin-row:last-child{border-bottom:0}.admin-row strong{display:block}.bar{height:7px;background:var(--op-bg);border-radius:99px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:var(--op-blue)}.status{color:var(--op-muted);font-size:.85rem;margin-bottom:12px}.empty{padding:25px;text-align:center;color:var(--op-muted)}@media(max-width:900px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}@media(max-width:600px){.wrap{padding:18px 12px 35px}.card{padding:14px}.filters>*{width:100%}.case-head{flex-direction:column}.actions{width:100%}.actions .btn{flex:1;text-align:center}}
</style>  <link rel="stylesheet" href="/css/startup-loader.css">
  <script src="/js/startup-loader.js" defer></script>
</head>
<body>
<main class="wrap">
<header class="top"><div><h1>Operations</h1><p>Live case queue, SLA visibility and investigator workload.</p></div><div class="actions"><a class="btn" href="/admin/dashboard.html">Dashboard</a><a class="btn" href="/admin/reports.html">Reports</a><a class="btn" href="/admin/owner.html">Owner Tools</a><button class="btn primary" id="refresh">Refresh</button></div></header>
<div id="status" class="status">Loading operations…</div>
<section class="grid"><section class="card"><h2>Case Queue</h2><div class="filters"><select id="statusFilter"><option value="active">Active</option><option value="closed">Closed</option><option value="all">All</option></select><select id="priorityFilter"><option value="all">All priorities</option><option value="urgent">Urgent</option><option value="high">High</option><option value="normal">Normal</option><option value="low">Low</option></select><select id="assigneeFilter"><option value="all">All assigned</option><option value="me">My cases</option></select></div><div id="queue" class="queue"></div></section>
<section class="card"><h2>Team Workload</h2><div id="workload"></div></section></section>
</main>
<script>
const $=id=>document.getElementById(id); const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const transitions={"Pending Review":["Accepted","Rejected"],"Accepted":["Under Investigation","Awaiting Customer Response","Closed","Rejected"],"Under Investigation":["Evidence Collected","Awaiting Customer Response","Recovery Successful","Recovered by Police","Recovered by Owner","Closed"],"Evidence Collected":["Under Investigation","Awaiting Customer Response","Recovery Successful","Recovered by Police","Recovered by Owner","Closed"],"Awaiting Customer Response":["Under Investigation","Evidence Collected","Closed"],"Recovery Successful":["Closed"],"Recovered by Police":["Closed"],"Recovered by Owner":["Closed"],"Closed":["Under Investigation","Accepted"],"Rejected":["Pending Review","Accepted"]};
async function api(url,options={}){const r=await fetch(url,{credentials:'include',headers:{'Content-Type':'application/json',...(options.headers||{})},...options});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||`Request failed (${r.status})`);return d}
function renderQueue(cases){if(!cases.length){$('queue').innerHTML='<div class="empty">No cases match these filters.</div>';return} $('queue').innerHTML=cases.map(c=>{const opts=(transitions[c.status]||[]).map(x=>`<option>${esc(x)}</option>`).join('');return `<article class="case"><div class="case-head"><div><div class="case-id">${esc(c.case_id)}</div><div class="meta"><span class="pill">${esc(c.status)}</span><span class="pill ${esc(c.priority||'normal')}" >${esc(c.priority||'normal')}</span><span class="pill ${esc(c.sla_state)}">SLA: ${esc(c.sla_state)}</span></div></div><span class="meta">${esc(c.assigned_admin_id||'Unassigned')}</span></div><div class="case-actions">${opts?`<select data-case="${esc(c.case_id)}" class="next-status">${opts}</select><button class="btn primary change" data-case="${esc(c.case_id)}">Update</button>`:''}<a class="btn" href="/admin/dashboard.html">Open Dashboard</a></div></article>`}).join('');document.querySelectorAll('.change').forEach(b=>b.onclick=async()=>{const id=b.dataset.case;const sel=document.querySelector(`.next-status[data-case="${CSS.escape(id)}"]`);b.disabled=true;try{await api(`/api/operations/cases/${encodeURIComponent(id)}/lifecycle`,{method:'PATCH',body:JSON.stringify({status:sel.value})});await load()}catch(e){alert(e.message)}finally{b.disabled=false}})}
function renderWorkload(admins){$('workload').innerHTML=(admins||[]).map(a=>{const pct=Math.min((a.active||0)/10*100,100);return `<div class="admin-row"><strong>${esc(a.full_name||a.username||a.email)}</strong><div class="meta"><span>${esc(a.role)}</span><span>${a.active||0} active</span><span>${a.overdue||0} overdue</span><span>${a.urgent||0} urgent</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>`}).join('')||'<div class="empty">No workload data.</div>'}
async function load(){ $('status').textContent='Refreshing live operations…';try{const q=new URLSearchParams({status:$('statusFilter').value,priority:$('priorityFilter').value,assignee:$('assigneeFilter').value});const [queue,work]=await Promise.all([api('/api/operations/queue?'+q),api('/api/operations/workload')]);renderQueue(queue.cases||[]);renderWorkload(work.admins||[]);$('status').textContent='Live data loaded · '+new Date().toLocaleTimeString()}catch(e){$('status').textContent=e.message;$('queue').innerHTML='<div class="empty">Operations data could not be loaded.</div>'}}
$('refresh').onclick=load;['statusFilter','priorityFilter','assigneeFilter'].forEach(id=>$(id).onchange=load);load();setInterval(load,60000);
</script></body></html>
