/* Desktop: keep the chat list/navigation on the left and show an open chat on the right.
   These rules are deliberately desktop-only so the phone layout stays unchanged. */
@media (min-width: 900px) {
  :root { --manlung-sidebar-width: 380px; }
  body { overflow: hidden; }
  #app {
    width: 100%;
    max-width: none;
    height: 100dvh;
    margin: 0;
    display: grid;
    grid-template-columns: var(--manlung-sidebar-width) minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto;
  }
  #hd { grid-column: 1; grid-row: 1; min-width: 0; }
  #mn { grid-column: 1; grid-row: 2; min-width: 0; min-height: 0; }
  #nv { grid-column: 1; grid-row: 3; min-width: 0; }
  #chat {
    position: absolute;
    inset: 0 0 0 var(--manlung-sidebar-width);
    min-width: 0;
    width: auto;
    height: auto;
    z-index: 5;
    border-left: 1px solid var(--bd);
  }
  #app:not(:has(#chat))::after {
    content: "Select a chat to start messaging";
    grid-column: 2;
    grid-row: 1 / 4;
    display: grid;
    place-items: center;
    padding: 32px;
    color: var(--mu);
    background: var(--bg);
    border-left: 1px solid var(--bd);
    text-align: center;
    font-size: 16px;
  }
}

 const old=document.querySelector('#ml-peer-call');if(old)old.remove();
 const el=document.createElement('div');el.id='ml-peer-call';el.className='ov';el.style.zIndex='100';
 el.innerHTML='<div style="text-align:center;padding:10px 0 16px">'+callAvatar(name,avatar)+'<div style="font-size:12px;letter-spacing:1.8px;text-transform:uppercase;color:#9fe8c8;margin-bottom:8px">'+(incoming?'Incoming call':(mode==='video'?'Video call':'Voice call'))+'</div><h2 id="ml-peer-name" style="margin:0 0 8px;font-size:27px;letter-spacing:-.5px">'+esc(name)+'</h2><div id="ml-peer-state">'+(incoming?'Incoming '+(mode==='video'?'video':'voice')+' call':'Calling '+esc(name)+'…')+'</div></div><div style="width:100%;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin:4px 0"><video id="ml-peer-remote" autoplay playsinline style="width:100%;max-height:42vh;object-fit:cover;background:#111;border-radius:18px;display:none"></video><audio id="ml-peer-audio" autoplay playsinline style="display:none"></audio><video id="ml-peer-local" autoplay playsinline muted style="width:34%;max-height:18vh;object-fit:cover;background:#222;border:2px solid #ffffff50;border-radius:14px;display:none"></video></div><div class="ctl ml-call-actions" style="display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap">'+(incoming?'<button id="ml-peer-answer" class="btn" title="Answer" aria-label="Answer" style="border-radius:50%;width:58px;height:58px;font-size:22px;background:#16a34a">'+callIcon(CALL_ICONS.accept,'Accept call')+'</button><button id="ml-peer-reject" class="end" title="Decline" aria-label="Decline" style="border-radius:50%;width:58px;height:58px;font-size:22px">'+callIcon(CALL_ICONS.end,'Decline call')+'</button>':'')+'<button id="ml-peer-mute" class="btn ghost" title="Mute microphone" aria-label="Mute microphone" style="border-radius:50%;width:54px;height:54px">'+callIcon(CALL_ICONS.mic,'Microphone on')+'</button>'+(mode==='video'?'<button id="ml-peer-camera" class="btn ghost" title="Turn camera off" aria-label="Turn camera off" style="border-radius:50%;width:54px;height:54px">'+callIcon(CALL_ICONS.camera,'Camera')+'</button>':'')+'<button id="ml-peer-end" class="end" title="End call" aria-label="End call" style="border-radius:50%;width:58px;height:58px;font-size:22px">'+callIcon(CALL_ICONS.end,'End call')+'</button></div>';
 $('#app').append(el);el.querySelector('#ml-peer-end').onclick=()=>endCall(true);
 const mute=el.querySelector('#ml-peer-mute');mute.onclick=()=>{const tracks=rtc.stream&&rtc.stream.getAudioTracks();if(tracks&&tracks.length){tracks.forEach(t=>t.enabled=!t.enabled);mute.innerHTML=callIcon(tracks[0].enabled?CALL_ICONS.mic:CALL_ICONS.mute,tracks[0].enabled?'Microphone on':'Microphone muted');mute.title=tracks[0].enabled?'Mute microphone':'Unmute microphone';mute.setAttribute('aria-label',mute.title)}};
 // Audio-only dialogs intentionally omit the camera button, so bind only when present.
 const camera=el.querySelector('#ml-peer-camera');
 if(camera){camera.onclick=()=>{const tracks=rtc.stream&&rtc.stream.getVideoTracks();if(tracks&&tracks.length){tracks.forEach(t=>t.enabled=!t.enabled);camera.innerHTML=callIcon(CALL_ICONS.camera,tracks[0].enabled?'Camera on':'Camera off');camera.title=tracks[0].enabled?'Turn camera off':'Turn camera on';camera.setAttribute('aria-label',camera.title)}};}
 if(incoming){el.querySelector('#ml-peer-answer').onclick=acceptIncoming;el.querySelector('#ml-peer-reject').onclick=()=>endCall(true,'reject')}
 return el
}
async function setup(mode){
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('Calls require HTTPS and microphone permission.');
 let config={iceServers:[{urls:'stun:stun.l.google.com:19302'}]};
 try{const res=await fetch('/api/calls/ice-servers',{credentials:'same-origin',cache:'no-store'});if(res.ok){const ice=await res.json();if(ice.success&&Array.isArray(ice.iceServers)&&ice.iceServers.length)config={iceServers:ice.iceServers}}}catch(_){}
 rtc.pc=new RTCPeerConnection(config);
 rtc.pc.onicecandidate=e=>{if(e.candidate)signal('ice',e.candidate.toJSON()).catch(note)};
 rtc.pc.ontrack=e=>{const stream=e.streams&&e.streams[0];if(!stream)return;const v=document.querySelector('#ml-peer-remote'),a=document.querySelector('#ml-peer-audio');if(stream.getVideoTracks().length&&v){v.srcObject=stream;v.style.display='block';v.play().catch(()=>{})}if(a){a.srcObject=stream;a.play().catch(()=>state('Tap the call screen to enable audio'))}};
 rtc.pc.onconnectionstatechange=()=>{if(!rtc.pc)return;const s=rtc.pc.connectionState;if(s==='connected'){rtc.connected=true;clearTimeout(rtc.timeout);state('Connected')}else if(s==='connecting')state('Connecting media…');else if(s==='disconnected')state('Connection interrupted — trying to recover…');else if(s==='failed'){state('Connection failed. Check your network or TURN relay.');endCall(true)}};
 try{rtc.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:mode==='video'?{facingMode:'user'}:false})}
 catch(e){if(mode==='video'){try{rtc.stream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});rtc.mode='audio';state('Camera unavailable; continuing with voice call')}catch(_){throw e}}else throw e}
 rtc.stream.getTracks().forEach(t=>rtc.pc.addTrack(t,rtc.stream));
 const local=document.querySelector('#ml-peer-local');if(local&&rtc.stream.getVideoTracks().length){local.srcObject=rtc.stream;local.style.display='block';local.play().catch(()=>{})}
 rtc.timeout=setTimeout(()=>{if(!rtc.closed&&!rtc.connected){state('No connection yet. Check microphone permission and network/TURN settings.');endCall(true)}},35000)
}
async function poll(){
 if(!rtc.callId||rtc.closed||rtc.polling)return;rtc.polling=true;
 try{
  const d=await rq('/peer-calls/'+encodeURIComponent(rtc.callId)+'/signals?after='+rtc.last);
  for(const s of d.signals||[]){
   rtc.last=Math.max(rtc.last,Number(s.id)||0);
   if(!rtc.pc)continue;
   if(s.signal_type==='offer'&&rtc.incoming){
    await rtc.pc.setRemoteDescription(s.payload);
    for(const c of rtc.iceQueue.splice(0)){try{await rtc.pc.addIceCandidate(c)}catch(_){}}
    const ans=await rtc.pc.createAnswer();await rtc.pc.setLocalDescription(ans);await signal('answer',rtc.pc.localDescription.toJSON());rtc.incoming=false;state('Calling…')
   }else if(s.signal_type==='answer'&&!rtc.incoming&&rtc.pc.signalingState==='have-local-offer'){
    await rtc.pc.setRemoteDescription(s.payload);for(const c of rtc.iceQueue.splice(0)){try{await rtc.pc.addIceCandidate(c)}catch(_){}}
   }else if(s.signal_type==='ice'&&s.payload){
    if(!rtc.pc.remoteDescription)rtc.iceQueue.push(s.payload);else try{await rtc.pc.addIceCandidate(s.payload)}catch(_){}
   }else if(s.signal_type==='reject'||s.signal_type==='hangup'){
    state(s.signal_type==='reject'?'Call declined':'Call ended');setTimeout(()=>endCall(false),500);return
   }
  }
  if(d.call&&['ended','rejected','missed'].includes(d.call.status)){state(d.call.status==='missed'?'Missed call':'Call ended');setTimeout(()=>endCall(false),500)}
 }catch(e){if(e.status===404||e.status===409){state(e.message);setTimeout(()=>endCall(false),500)}}
 finally{rtc.polling=false}
}
function beginPoll(){clearInterval(rtc.poll);rtc.poll=setInterval(poll,500);poll()}
async function startPeerCall(name,video){
 if(rtc.callId)return toast('Finish your current call first.');
 const m=(window.__mlMembers||[]).find(x=>(x.name||x.username)===name||x.username===name);
 if(!m)return toast('Choose a registered member from Community.');
 
 requestCallNotifications();rtc.closed=false;rtc.ending=false;rtc.connected=false;rtc.last=0;rtc.incoming=false;rtc.iceQueue=[];rtc.mode=video?'video':'audio';rtc.startedAt=Date.now();rtc.peerName=name;rtc.direction='outgoing';lastCallState='';vibrate([180,80,180]);
 try{const d=await rq('/peer-calls',{method:'POST',body:JSON.stringify({memberId:m.id,call_mode:rtc.mode})});rtc.callId=d.call.id;callUI(name,rtc.mode,false,m.avatar||m.avatar_url||null);startRingtone();await setup(rtc.mode);const offer=await rtc.pc.createOffer();await rtc.pc.setLocalDescription(offer);await signal('offer',rtc.pc.localDescription.toJSON());state('Ringing…');beginPoll()}
 catch(e){note(e);await endCall(!!rtc.callId,'hangup')}
}
async function acceptIncoming(){
 stopRingtone();if(!rtc.callId||rtc.ending)return;
 try{rtc.closed=false;rtc.ending=false;await signal('accept');await setup(rtc.mode);rtc.incoming=true;state('Connecting…');beginPoll()}
 catch(e){note(e);await endCall(true,'reject')}
}
async function endCall(notify,kind){
 if(rtc.ending)return;rtc.ending=true;const id=rtc.callId;
 if(notify&&id&&(!rtc.closed||kind==='reject')){try{await signal(kind||'hangup')}catch(_){}}
 rtc.closed=true;stopRingtone();if(id&&rtc.startedAt)saveCallLog(kind==='reject'?'missed':(rtc.connected?'ended':'cancelled'));clearInterval(rtc.poll);rtc.poll=null;clearTimeout(rtc.timeout);rtc.timeout=null;
 if(rtc.pc){rtc.pc.ontrack=null;rtc.pc.onicecandidate=null;try{rtc.pc.close()}catch(_){}}
 if(rtc.stream)rtc.stream.getTracks().forEach(t=>t.stop());
 rtc.pc=null;rtc.stream=null;rtc.callId=null;rtc.incoming=false;rtc.connected=false;rtc.iceQueue=[];rtc.polling=false;
 const el=document.querySelector('#ml-peer-call');if(el)el.remove();rtc.ending=false
}
window.call=function(name,video){startPeerCall(name,!!video)};
async function incomingCheck(){
 if(!window.__mlMe||rtc.callId||document.querySelector('#ml-peer-call'))return;
 try{const d=await rq('/peer-calls/incoming');const c=(d.calls||[]).find(x=>!rtc.seen.has(x.id));if(!c)return;rtc.seen.add(c.id);rtc.callId=c.id;rtc.closed=true;rtc.last=0;rtc.mode=c.call_mode;rtc.incoming=true;rtc.startedAt=Date.now();rtc.peerName=c.caller&&c.caller.name||'Manlung member';rtc.direction='incoming';lastCallState='';vibrate([300,120,300,120,500]);callUI(c.caller&&c.caller.name||'Manlung member',rtc.mode,true,c.caller&&c.caller.avatar||null);notifyCall('Incoming '+(rtc.mode==='video'?'video':'voice')+' call',rtc.peerName+' is calling you. Open Manlung Community to answer.','ml-incoming-'+c.id);startRingtone()}
 catch(e){if(e.status===401)state('Sign in again to receive calls')}
}
rtc.incomingTimer=setInterval(()=>{if(window.__mlMe)incomingCheck()},2500);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&activeCallNotification){try{activeCallNotification.close()}catch(_){}activeCallNotification=null}if(document.hidden&&rtc.callId)notifyCall('Manlung call',rtc.peerName+' · Call continues in background','ml-call-'+rtc.callId)});
})();
</script>
