<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="/js/theme.js"></script>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <meta
    name="theme-color"
    content="#0a1a3a"
  >

  <title>
    Reset Admin Password · Manlung Recovery
  </title>

  <link
    rel="stylesheet"
    href="/css/style.css"
  >

  <link
    rel="icon"
    type="image/svg+xml"
    href="/favicon.svg"
  >
  <link rel="stylesheet" href="/css/theme.css">
  


<style id="manlung-footer-ultimate-contrast">
/* FINAL OVERRIDE — MANLUNG RECOVERY FOOTER */
html body footer.manlung-footer {
  background:#000000 !important;
  color:#ffffff !important;
  opacity:1 !important;
}

html body footer.manlung-footer,
html body footer.manlung-footer *,
html body footer.manlung-footer p,
html body footer.manlung-footer span,
html body footer.manlung-footer strong,
html body footer.manlung-footer h2,
html body footer.manlung-footer h3,
html body footer.manlung-footer h4,
html body footer.manlung-footer a,
html body footer.manlung-footer i,
html body footer.manlung-footer svg,
html body footer.manlung-footer svg *,
html body footer.manlung-footer div,
html body footer.manlung-footer section,
html body footer.manlung-footer nav {
  color:#ffffff !important;
  -webkit-text-fill-color:#ffffff !important;
}

html body footer.manlung-footer a,
html body footer.manlung-footer a:visited,
html body footer.manlung-footer a:hover,
html body footer.manlung-footer a:active {
  color:#ffffff !important;
  -webkit-text-fill-color:#ffffff !important;
  background:transparent !important;
  border-color:transparent !important;
  box-shadow:none !important;
  text-decoration:none;
}

html body footer.manlung-footer .manlung-footer-brand-subtitle,
html body footer.manlung-footer .manlung-footer-description,
html body footer.manlung-footer .manlung-footer-trust p,
html body footer.manlung-footer .manlung-footer-social-label,
html body footer.manlung-footer .manlung-footer-bottom,
html body footer.manlung-footer .manlung-footer-bottom span {
  color:#ffffff !important;
  -webkit-text-fill-color:#ffffff !important;
}

html body footer.manlung-footer .manlung-footer-social a,
html body footer.manlung-footer .manlung-footer-social a *,
html body footer.manlung-footer .manlung-footer-social i,
html body footer.manlung-footer .manlung-footer-social svg,
html body footer.manlung-footer .manlung-footer-social svg * {
  color:#ffffff !important;
  fill:#ffffff !important;
  stroke:#ffffff !important;
  -webkit-text-fill-color:#ffffff !important;
  background:transparent !important;
  border:0 !important;
  box-shadow:none !important;
}

html body footer.manlung-footer .manlung-footer-divider {
  background:#333333 !important;
}
</style>

</head>

<body>

<main class="container">
  <section
    class="card"
    style="max-width:520px;margin:4rem auto;"
  >

    <div class="card-title">
      Reset Admin Password
    </div>

    <p
      style="
        color:var(--text-muted);
        font-size:.85rem;
        line-height:1.5;
      "
    >
      Choose a new password for your
      Manlung Recovery Admin account.
    </p>

    <form id="adminResetForm">

      <div class="form-group">
        <label for="newPassword">
          New Password
        </label>

        <input
          id="newPassword"
          type="password"
          minlength="8"
          required
          autocomplete="new-password"
        >
      </div>

      <div class="form-group">
        <label for="confirmPassword">
          Confirm New Password
        </label>

        <input
          id="confirmPassword"
          type="password"
          minlength="8"
          required
          autocomplete="new-password"
        >
      </div>

      <button
        class="btn btn-primary"
        type="submit"
      >
        Update Password
      </button>

      <p
        id="resetStatus"
        style="
          margin-top:.7rem;
          font-size:.8rem;
        "
      ></p>

    </form>

  </section>
</main>

<script>
const params =
  new URLSearchParams(
    window.location.search
  );

const token =
  params.get('token');

const form =
  document.getElementById(
    'adminResetForm'
  );

const status =
  document.getElementById(
    'resetStatus'
  );

form.addEventListener(
  'submit',
  async function(event){

    event.preventDefault();

    const password =
      document.getElementById(
        'newPassword'
      ).value;

    const confirm =
      document.getElementById(
        'confirmPassword'
      ).value;

    if(!token){
      status.textContent =
        'This reset link is missing its token.';
      return;
    }

    if(password !== confirm){
      status.textContent =
        'The passwords do not match.';
      return;
    }

    status.textContent =
      'Updating password…';

    try{

      const res =
        await fetch(
          '/api/auth/admin/reset-password',
          {
            method:'POST',
            headers:{
              'Content-Type':
                'application/json'
            },
            body:
              JSON.stringify({
                token,
                password
              })
          }
        );

      const data =
        await res.json().catch(
          () => ({})
        );

      if(!res.ok || !data.success){
        throw new Error(
          data.error ||
          'Could not reset password.'
        );
      }

      status.textContent =
        data.message ||
        'Password updated successfully.';

      setTimeout(
        () => {
          window.location.href =
            '/admin/login.html';
        },
        1200
      );

    }catch(error){

      status.textContent =
        error.message ||
        'Could not reset password.';

    }

  }
);
</script>

<script src="/js/pwa.js" defer></script>


</body>
</html>
