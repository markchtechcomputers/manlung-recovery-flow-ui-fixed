<body>
    <header class="site-header">
        <div class="container">
            <div class="brand">
                <h1><i class="fas fa-folder-open"></i> Case Details</h1>
                <span id="caseIdHeading">Loading…</span>
            </div>
            <div class="header-actions">
                <a href="/client/dashboard.html" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Dashboard</a>
                <a href="/" class="btn btn-outline"><i class="fas fa-home"></i> Home</a>
            </div>
        </div>
    </header>

    <div class="container">
        <div id="content"></div>
    </div>

    <footer class="manlung-footer">
<div class="manlung-footer-inner">
<div class="manlung-footer-brand">
<h2>Cyber Recovery &amp; Digital Investigation Portal</h2>
<p>Secure support, recovery guidance, digital awareness and responsible assistance.</p>
</div>
<nav class="manlung-footer-links" aria-label="Footer navigation">

</nav>
<div class="manlung-footer-bottom">&copy; 2026 <strong>Manlung Recovery</strong>. All rights reserved.</div>
</div>

    <script>
        function getStatusClass(status) {
            const map = {
                'Pending Review': 'status-pending',
                'Accepted': 'status-progress',
                'Under Investigation': 'status-progress',
                'Awaiting Customer Response': 'status-progress',
                'Evidence Collected': 'status-progress',
                'Recovery Successful': 'status-completed',
                'Recovered by Police': 'status-completed',
                'Recovered by Owner': 'status-completed',
                'Closed': 'status-closed',
                'Rejected': 'status-rejected',
            };
            return map[status] || 'status-pending';
        }

        async function loadCase() {
            const params = new URLSearchParams(window.location.search);
            const caseId = params.get('case');
            const content = document.getElementById('content');
            const token = localStorage.getItem('clientToken');
            if (!token) { window.location.href = '/login.html'; return; }

            if (!caseId) {
                content.innerHTML = '<div class="card"><p class="error-text">No case ID provided.</p></div>';
                return;
            }

            document.getElementById('caseIdHeading').textContent = caseId;

            try {
                const res = await fetch(`/api/cases/track/${encodeURIComponent(caseId)}`, { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();

                if (!data.success) {
                    content.innerHTML = `<div class="card"><p class="error-text">${data.error || 'Case not found'}</p></div>`;
                    return;
                }

                const c = data.case;
                const filesHtml = (c.files && c.files.length)
                    ? c.files.map(f => `
                        <div class="file-item">
                            <a href="${f.url}" target="_blank" rel="noopener"><i class="fas fa-file"></i> ${f.originalName || f.filename}</a>
                            <span class="status">${f.uploadedBy || ''}</span>
                        </div>`).join('')
                    : '<p style="color:var(--text-muted); font-size:0.9rem;">No files attached yet.</p>';

                content.innerHTML = `
                    <div class="card">
                        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem; margin-bottom:1rem;">
                            <strong style="font-size:1.3rem;">${c.caseId}</strong>
                            <span class="status-badge ${getStatusClass(c.status)}">${c.status}</span>
                        </div>
                        <p style="color:var(--text-muted); margin-bottom:1rem;">${c.caseType || ''}</p>
                        <div><strong>Investigator:</strong> ${c.investigator || 'Not assigned'}</div>
                        <div><strong>Last Updated:</strong> ${c.lastUpdated || 'N/A'}</div>
                        ${c.recoveryLoc ? `<div><strong>Recovery Location:</strong> ${c.recoveryLoc}</div>` : ''}
                        ${c.publicNotes ? `<div style="margin-top:.8rem;padding:.8rem;border-radius:10px;background:var(--info-bg);"><strong>Admin feedback:</strong><div style="margin-top:.35rem;white-space:pre-wrap;">${c.publicNotes}</div></div>` : ''}
                    </div>

                    <div class="card">
                        <div class="card-title"><i class="fas fa-timeline"></i> Timeline</div>
                        <div style="white-space:pre-line;">${c.timeline || 'Request Submitted ✅'}</div>
                    </div>


                    <div class="card manlung-message-card" id="caseMessagesCard">
                        <div class="card-title"><i class="fas fa-comments"></i> Case Messages</div>
                        <div id="caseMessagesList" class="manlung-message-list">
                            <div class="manlung-message-empty">Loading messages…</div>
                        </div>
                        <div class="manlung-message-compose">
                            <textarea id="caseMessageInput" maxlength="5000" placeholder="Write a message to your case team…"></textarea>
                            <button type="button" class="btn btn-primary" onclick="sendClientCaseMessage()">
                                <i class="fas fa-paper-plane"></i> Send
                            </button>
                        </div>
                        <div id="caseMessageStatus" style="margin-top:.4rem;color:var(--text-muted);font-size:.72rem;"></div>
                    </div>

                    <div class="card">
                        <div class="card-title"><i class="fas fa-paperclip"></i> Files</div>
                        <div class="file-list">${filesHtml}</div>
                    </div>
                `;
                await loadClientCaseMessages(caseId);
            } catch (err) {
                console.error(err);
                content.innerHTML = '<div class="card"><p class="error-text">Error loading case.</p></div>';
            }
        }

        loadCase();
    </script>

<script id="manlung-timeline-script">
(function(){
  function token(){
    return localStorage.getItem('clientToken') || '';
  }

  function headers(){
    const t = token();
    return t
      ? { 'Authorization': `Bearer ${t}`, 'Content-Type': 'application/json' }
      : { 'Content-Type': 'application/json' };
  }

  function escapeHtml(value){
    return String(value ?? '')
      .replaceAll('&','&amp;')
      .replaceAll('<','&lt;')
      .replaceAll('>','&gt;')
      .replaceAll('"','&quot;')
      .replaceAll("'","&#039;");
  }

  function dateText(value){
    try{
      return value ? new Date(value).toLocaleString() : '';
    }catch(_){
      return value || '';
    }
  }

  async function loadManlungTimeline(){
    const list = document.getElementById('manlungTimelineList');
    if(!list) return;

    const params = new URLSearchParams(window.location.search);
    const caseId =
      params.get('case') ||
      params.get('caseId');

    if(!caseId){
      list.innerHTML =
        '<div class="manlung-empty">No case was selected.</div>';
      return;
    }

    try{
      const res = await fetch(
        `/api/notifications/case/${encodeURIComponent(caseId)}/timeline`,
        {
          headers: headers(),
          cache:'no-store'
        }
      );

      const data = await res.json().catch(()=>({}));

      if(res.status === 401){
        if(typeof logout === 'function') logout();
        return;
      }

      if(!res.ok || !data.success){
        throw new Error(
          data.error || 'Could not load the case timeline.'
        );
      }

      const timeline =
        Array.isArray(data.timeline)
          ? data.timeline
          : [];

      if(!timeline.length){
        list.innerHTML =
          '<div class="manlung-empty">No timeline events yet.</div>';
        return;
      }

      list.innerHTML = timeline.map(event => `
        <article class="manlung-timeline-item">
          <h4>${escapeHtml(event.event_type || 'Case update')}</h4>
          <p>${escapeHtml(event.description || '')}</p>
          <small>${escapeHtml(dateText(event.created_at))}</small>
        </article>
      `).join('');
    }catch(error){
      console.error('Case timeline load error:', error);
      list.innerHTML =
        '<div class="manlung-empty">The case timeline could not be loaded.</div>';
    }
  }

  document.addEventListener('DOMContentLoaded', loadManlungTimeline);
})();
</script>


<script id="manlung-client-messages">
let currentCaseIdForMessages = null;

function escapeClientMessageHtml(value) {
    return String(value ?? '')
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'",'&#039;');
}

function clientMessageDate(value) {
    try {
        return value ? new Date(value).toLocaleString() : '';
    } catch (_) {
        return value || '';
    }
}

async function loadClientCaseMessages(caseId) {
    currentCaseIdForMessages = caseId;
    const list = document.getElementById('caseMessagesList');
    const token = localStorage.getItem('clientToken');

    if (!list || !token) return;

    try {
        const res = await fetch(
            `/api/messages/case/${encodeURIComponent(caseId)}`,
            {
                headers: {
                    'Authorization': `Bearer ${token}`
                },
                cache: 'no-store'
            }
        );

        const data = await res.json().catch(() => ({}));

        if (res.status === 401) {
            window.location.href = '/login.html';
            return;
        }

        if (!res.ok || !data.success) {
            throw new Error(data.error || 'Could not load messages.');
        }

        const user = JSON.parse(
            localStorage.getItem('clientUser') || '{}'
        );

        const messages =
            Array.isArray(data.messages)
                ? data.messages
                : [];

        if (!messages.length) {
            list.innerHTML =
                '<div class="manlung-message-empty">No messages yet. Send a message to your case team.</div>';
            return;
        }

        list.innerHTML = messages.map((m) => {
            const mine =
                String(m.sender_user_id) === String(user.id);

            return `
                <article class="manlung-message ${mine ? 'mine' : ''}">
                    <div class="manlung-message-meta">
                        <span>${mine ? 'You' : 'Case team'}</span>
                        <span>${escapeClientMessageHtml(clientMessageDate(m.created_at))}</span>
                    </div>
                    <div class="manlung-message-text">
                        ${escapeClientMessageHtml(m.message)}
                    </div>
                </article>
            `;
        }).join('');

        list.scrollTop = list.scrollHeight;
    } catch (error) {
        console.error('Client messages load error:', error);
        list.innerHTML =
            `<div class="manlung-message-empty">${escapeClientMessageHtml(error.message)}</div>`;
    }
}

async function sendClientCaseMessage() {
    const input = document.getElementById('caseMessageInput');
    const status = document.getElementById('caseMessageStatus');
    const token = localStorage.getItem('clientToken');

    if (!input || !currentCaseIdForMessages || !token) return;

    const message = input.value.trim();

    if (!message) {
        status.textContent = 'Write a message first.';
        return;
    }

    status.textContent = 'Sending…';

    try {
        const res = await fetch(
            `/api/messages/case/${encodeURIComponent(currentCaseIdForMessages)}`,
            {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ message })
            }
        );

        const data = await res.json().catch(() => ({}));

        if (!res.ok || !data.success) {
            throw new Error(data.error || 'Could not send message.');
        }

        input.value = '';
        status.textContent = 'Message sent.';
        await loadClientCaseMessages(currentCaseIdForMessages);
    } catch (error) {
        console.error('Client message send error:', error);
        status.textContent =
            error.message || 'Could not send message.';
    }
}
</script>
