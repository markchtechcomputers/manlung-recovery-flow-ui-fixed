<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Details · Manlung Tech City</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style id="manlung-footer-style">
.manlung-footer{margin-top:2.5rem;padding:1.6rem 1rem .8rem;background:#06101d;border-top:1px solid rgba(255,255,255,.08);color:#dbeafe}
.manlung-footer-inner{max-width:1000px;margin:auto}
.manlung-footer-brand{text-align:center;margin-bottom:1rem}
.manlung-footer-brand h2{margin:0 0 .3rem;font-size:clamp(1rem,1.7vw,1.25rem);color:#fff}
.manlung-footer-brand p{margin:0;color:#94a3b8;font-size:.8rem}
.manlung-footer-links{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.5rem;margin:1rem 0}
.manlung-footer-link{display:flex;align-items:center;justify-content:center;min-height:42px;padding:.45rem .35rem;border:1px solid rgba(255,255,255,.08);border-radius:8px;background:rgba(255,255,255,.025);color:#dbeafe;text-decoration:none;font-weight:600;font-size:.76rem;text-align:center;transition:background .18s ease,border-color .18s ease,color .18s ease}
.manlung-footer-link:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.16);color:#fff}
.manlung-footer-link:focus-visible{outline:2px solid #94a3b8;outline-offset:2px}
.manlung-footer-link:active{background:rgba(255,255,255,.1)}
.manlung-footer-bottom{padding-top:.7rem;border-top:1px solid rgba(255,255,255,.07);text-align:center;color:#64748b;font-size:.7rem}
.manlung-footer-bottom strong{color:#94a3b8}
@media(max-width:900px){.manlung-footer-links{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:600px){.manlung-footer{margin-top:2rem;padding:1.3rem .65rem .7rem}.manlung-footer-links{grid-template-columns:repeat(2,minmax(0,1fr));gap:.45rem;margin:.8rem 0}.manlung-footer-link{min-height:40px;font-size:.72rem}}
@media(max-width:380px){.manlung-footer-links{grid-template-columns:1fr}}
</style>
<style id="manlung-header-style">
.site-header{
  position:sticky;
  top:0;
  z-index:1000;
  background:#f1f3f5;
  border-bottom:1px solid #d6d9dd;
  box-shadow:0 1px 7px rgba(15,23,42,.06);
}
.site-header .container{
  max-width:1180px;
  margin:0 auto;
  min-height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:.8rem;
  padding:.45rem .8rem;
}
.site-header .brand{
  display:flex;
  align-items:center;
  gap:.65rem;
  min-width:0;
}
.site-header .brand h1{
  margin:0;
  color:#1f2937;
  font-size:1.05rem;
  line-height:1.1;
  font-weight:800;
  letter-spacing:-.02em;
}
.site-header .brand h1 i{
  color:#475569;
  margin-right:.3rem;
}
.site-header .brand span{
  display:block;
  margin-top:.15rem;
  color:#6b7280;
  font-size:.72rem;
  white-space:nowrap;
}
.site-header .header-actions{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:.4rem;
}
.site-header .header-actions a,
.site-header .header-actions button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:.35rem;
  min-height:38px;
  padding:.45rem .65rem;
  border:1px solid #d1d5db;
  border-radius:8px;
  background:#fff;
  color:#374151;
  text-decoration:none;
  font-size:.78rem;
  font-weight:700;
  transition:background .18s ease,border-color .18s ease,color .18s ease;
}
.site-header .header-actions a:hover,
.site-header .header-actions button:hover{
  background:#f8fafc;
  border-color:#b8bec6;
  color:#111827;
}
.site-header .header-actions .btn-primary{
  background:#374151;
  border-color:#374151;
  color:#fff;
}
.site-header .header-actions .btn-primary:hover{
  background:#1f2937;
  border-color:#1f2937;
  color:#fff;
}
.site-header .theme-toggle{
  width:38px;
  min-width:38px;
  padding:0;
}
@media(max-width:900px){
  .site-header .container{
    min-height:56px;
    padding:.4rem .7rem;
  }
  .site-header .brand h1{
    font-size:.95rem;
  }
  .site-header .brand span{
    font-size:.65rem;
  }
  .site-header .header-actions a,
  .site-header .header-actions button{
    min-height:36px;
    padding:.42rem .55rem;
    font-size:.72rem;
  }
}
@media(max-width:700px){
  .site-header .container{
    flex-wrap:wrap;
    gap:.45rem;
  }
  .site-header .brand{
    width:100%;
    justify-content:center;
    text-align:center;
  }
  .site-header .brand span{
    white-space:normal;
  }
  .site-header .header-actions{
    width:100%;
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:.4rem;
  }
  .site-header .header-actions a,
  .site-header .header-actions button{
    width:100%;
    min-height:38px;
    padding:.4rem .25rem;
    font-size:.69rem;
  }
  .site-header .header-actions a i,
  .site-header .header-actions button i{
    font-size:.9rem;
  }
}
@media(max-width:480px){
  .site-header .header-actions{
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:.3rem;
  }
  .site-header .header-actions a,
  .site-header .header-actions button{
    min-height:36px;
    font-size:0;
  }
  .site-header .header-actions a i,
  .site-header .header-actions button i{
    font-size:1rem;
    margin:0;
  }
}
@media(max-width:360px){
  .site-header .brand h1{
    font-size:.88rem;
  }
  .site-header .brand span{
    font-size:.6rem;
  }
}
</style>
</head>
<body>
    <header class="site-header">
        <div class="container">
            <div class="brand">
                <h1><i class="fas fa-folder-open"></i> Case Details</h1>
                <span id="caseIdHeading">Loading…</span>
            </div>
            <div class="header-actions">
                <a href="/client/dashboard.html" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Dashboard</a>
                <a href="/" class="btn btn-outline"><i class="fas fa-home"></i> Home</a>
            </div>
        </div>
    </header>

    <div class="container">
        <div id="content"></div>
    </div>

    <footer class="manlung-footer">
<div class="manlung-footer-inner">
<div class="manlung-footer-brand">
<h2>Cyber Recovery &amp; Digital Investigation Portal</h2>
<p>Secure support, recovery guidance, digital awareness and responsible assistance.</p>
</div>
<nav class="manlung-footer-links" aria-label="Footer navigation">
<a class="manlung-footer-link" href="/about.html">About</a>
<a class="manlung-footer-link" href="/blog.html">Blog</a>
<a class="manlung-footer-link" href="/careers.html">Careers</a>
<a class="manlung-footer-link" href="/terms.html">Terms</a>
<a class="manlung-footer-link" href="/login.html">Client Portal</a>
<a class="manlung-footer-link" href="/client/request.html">New Recovery Request</a>
</nav>
<div class="manlung-footer-bottom">&copy; 2026 <strong>Manlung Tech City</strong>. All rights reserved.</div>
</div>
</footer>

    <script>
        function getStatusClass(status) {
            const map = {
                'Pending Review': 'status-pending',
                'Accepted': 'status-progress',
                'Under Investigation': 'status-progress',
                'Awaiting Customer Response': 'status-progress',
                'Evidence Collected': 'status-progress',
                'Recovery Successful': 'status-completed',
                'Recovered by Police': 'status-completed',
                'Recovered by Owner': 'status-completed',
                'Closed': 'status-closed',
                'Rejected': 'status-rejected',
            };
            return map[status] || 'status-pending';
        }

        async function loadCase() {
            const params = new URLSearchParams(window.location.search);
            const caseId = params.get('case');
            const content = document.getElementById('content');
            const token = localStorage.getItem('clientToken');
            if (!token) { window.location.href = '/login.html'; return; }

            if (!caseId) {
                content.innerHTML = '<div class="card"><p class="error-text">No case ID provided.</p></div>';
                return;
            }

            document.getElementById('caseIdHeading').textContent = caseId;

            try {
                const res = await fetch(`/api/cases/track/${encodeURIComponent(caseId)}`, { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();

                if (!data.success) {
                    content.innerHTML = `<div class="card"><p class="error-text">${data.error || 'Case not found'}</p></div>`;
                    return;
                }

                const c = data.case;
                const filesHtml = (c.files && c.files.length)
                    ? c.files.map(f => `
                        <div class="file-item">
                            <a href="${f.url}" target="_blank" rel="noopener"><i class="fas fa-file"></i> ${f.originalName || f.filename}</a>
                            <span class="status">${f.uploadedBy || ''}</span>
                        </div>`).join('')
                    : '<p style="color:var(--text-muted); font-size:0.9rem;">No files attached yet.</p>';

                content.innerHTML = `
                    <div class="card">
                        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem; margin-bottom:1rem;">
                            <strong style="font-size:1.3rem;">${c.caseId}</strong>
                            <span class="status-badge ${getStatusClass(c.status)}">${c.status}</span>
                        </div>
                        <p style="color:var(--text-muted); margin-bottom:1rem;">${c.caseType || ''}</p>
                        <div><strong>Investigator:</strong> ${c.investigator || 'Not assigned'}</div>
                        <div><strong>Last Updated:</strong> ${c.lastUpdated || 'N/A'}</div>
                        ${c.recoveryLoc ? `<div><strong>Recovery Location:</strong> ${c.recoveryLoc}</div>` : ''}
                        ${c.publicNotes ? `<div style="margin-top:.8rem;padding:.8rem;border-radius:10px;background:var(--info-bg);"><strong>Admin feedback:</strong><div style="margin-top:.35rem;white-space:pre-wrap;">${c.publicNotes}</div></div>` : ''}
                    </div>

                    <div class="card">
                        <div class="card-title"><i class="fas fa-timeline"></i> Timeline</div>
                        <div style="white-space:pre-line;">${c.timeline || 'Request Submitted ✅'}</div>
                    </div>

                    <div class="card">
                        <div class="card-title"><i class="fas fa-paperclip"></i> Files</div>
                        <div class="file-list">${filesHtml}</div>
                    </div>
                `;
            } catch (err) {
                console.error(err);
                content.innerHTML = '<div class="card"><p class="error-text">Error loading case.</p></div>';
            }
        }

        loadCase();
    </script>
</body>
</html>
