function lockApp(){if(!S.pin)return;const d=document.createElement('div');d.className='zm';d.dataset.lock=1;d.style.background='var(--bg)';d.style.zIndex=99;d.innerHTML='<div style="text-align:center;padding:24px;width:100%"><div class="logo" style="margin:0 auto 12px;width:60px;height:60px;font-size:30px">M</div><h2>Manlung is locked</h2><input class="search" type="password" inputmode="numeric" maxlength="4" placeholder="Enter PIN" aria-label="PIN" style="max-width:220px;text-align:center"><div id="le" class="sub" style="color:var(--rd);min-height:20px"></div></div>';const i=d.querySelector('input');i.oninput=()=>{if(i.value===S.pin)d.remove();else if(i.value.length>=S.pin.length){$('#le').textContent='Wrong PIN';i.value=''}};$('#app').append(d);i.focus()}
const MEM=()=>Array.isArray(ML.members)?ML.members.filter(m=>m&&m.id).map(m=>nm(m)):[];
const flowRow=()=>{const registered=MEM(),sug=registered.filter(n=>!S.friends.includes(n)&&!S.inc.includes(n)),items=S.inc.map(n=>[n,'Request',1]).concat(sug.map(n=>[n,S.req.includes(n)?'Pending':'Add',0]));if(!items.length||showAr)return'';return `<div class="flow" role="list" aria-label="Friend requests and people">${items.map(([n,l,h])=>`<button class="fl" role="listitem" onclick="person('${esc(n)}')">${av(n,h?'ring':'')}<span class="fn">${esc(n.split(' ')[0])}</span><span class="fs ${h?'hot':''}">${l}</span></button>`).join('')}</div>`};
function person(n){const inc=S.inc.includes(n),pen=S.req.includes(n),d=modal(`<div class="big" style="display:flex;justify-content:center;margin:6px 0">${av(n)}</div><b style="display:block;text-align:center">${esc(n)}</b><div class="sub" style="text-align:center;margin:4px 0 12px">Manlung Recovery member</div>${inc?'<div style="display:flex;gap:8px"><button class="btn grow" data-k="a">Accept</button><button class="btn ghost grow" data-k="d">Decline</button></div>':pen?'<button class="btn ghost" style="width:100%" disabled>Request pending</button>':'<button class="btn" style="width:100%" data-k="s">Send friend request</button>'}`);
 d.querySelectorAll('[data-k]').forEach(b=>b.onclick=async()=>{const k=b.dataset.k;if(k==='a'||k==='d'){b.disabled=true;try{await window.respondToCommunityRequest(n,k==='a'?'accept':'decline');d.remove()}catch(e){b.disabled=false;toast(e.message||'Could not update friend request')}}else{d.remove();window.reqFriend(n)}})}
function pickMember(){const d=modal('<b>New chat</b><div class="sub" style="margin:2px 0 8px">Only registered Manlung Recovery members</div>'+MEM().map(n=>`<button class="row" data-n="${esc(n)}">${av(n)}<div class="grow"><div class="nm">${esc(n)}</div><div class="sub">${S.friends.includes(n)?'Friend':S.req.includes(n)?'Request pending':S.inc.includes(n)?'Sent you a request':'Not friends yet'}</div></div></button>`).join(''));d.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{d.remove();chatWith(b.dataset.n)})}
function img(f,max,cb){if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=im.width*k;cv.height=im.height*k;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);cb(cv.toDataURL('image/jpeg',.8))};im.onerror=()=>toast('Could not read that image');im.src=r.result};r.readAsDataURL(f)}
function pickStatus(cb){const d=modal('<b>New status</b><div style="display:flex;gap:8px;margin-top:10px"><button class="btn grow" data-k="t">Text</button><button class="btn grow" data-k="p">Photo</button></div>');
 d.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{d.remove();if(b.dataset.k==='t')return ask('New status','What is on your mind?',t=>cb({t}));const f=$('#pi');f.value='';f.removeAttribute('capture');f.onchange=()=>img(f.files[0],720,s=>cb({t:'',src:s}));f.click()})}
// calls
function call(n,v){if(S.blocked.includes(n))return toast('Unblock to call');let sec=0,ring=1,mu=0,cam=v;const o=document.createElement('div');o.className='ov';o.setAttribute('role','dialog');
 const draw=()=>{o.innerHTML=`<div style="text-align:center">${av(n)}<h2 style="margin:16px 0 4px">${esc(n)}</h2><div>${ring?(v?'Video calling…':'Calling…'):String(sec/60|0).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}</div></div><div>${v?(cam?'Camera preview (demo)':'Camera off'):''}</div><div class="ctl"><button class="${mu?'on':''}" onclick="this.getRootNode()" id="m" aria-label="Mute">${ic(mu?I.micoff:I.mic,24)}</button>${v?`<button id="cm" class="${cam?'':'on'}" aria-label="Camera">${ic(cam?I.video:I.videooff,24)}</button>`:''}<button class="end" id="e" aria-label="End call">${ic(I.end,24)}</button></div>`;
  o.querySelector('#m').onclick=()=>{mu=!mu;draw()};const cm=o.querySelector('#cm');if(cm)cm.onclick=()=>{cam=!cam;draw()};o.querySelector('#e').onclick=end};
 const rt=setInterval(()=>play(S.ring),1600);play(S.ring);let tm;const to=setTimeout(()=>{ring=0;clearInterval(rt);tm=setInterval(()=>{sec++;draw()},1000);draw()},3500);
 function end(){clearInterval(rt);clearInterval(tm);clearTimeout(to);o.remove();S.calls.unshift({n,t:'out',v,w:'Today, '+now()});save();if(tab==='calls')render()}
 draw();$('#app').append(o)}

function addStatus(){const mine=S.myStat.filter(s=>s.d===day()),freeLeft=lim()-mine.length;
 if(freeLeft<=0){toast('Daily limit reached. Upgrade your plan');return plans()}

function viewS(i){const s=S.stat[i];s.s=1;save();const v=document.createElement('div');v.className='sv';v.style.background=cols[s.n.length%cols.length];v.setAttribute('role','dialog');v.innerHTML=`<div style="position:absolute;top:20px;left:20px;font-size:14px">${esc(s.n)}</div>${esc(s.t)}`;
 v.onclick=()=>{v.remove();render()};$('#app').append(v);setTimeout(()=>{v.isConnected&&v.click()},4000)}

addEventListener('popstate',()=>{if(back()){try{history.pushState({m:2},'')}catch(e){}}});
addEventListener('keydown',e=>{if(e.key==='Escape')back()});
lockApp();if('serviceWorker'in navigator){navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.unregister()))).catch(()=>{});if('caches'in window)caches.keys().then(keys=>Promise.all(keys.filter(k=>k.startsWith('manlung-community')).map(k=>caches.delete(k)))).catch(()=>{});}if(S.notif&&'Notification'in window&&Notification.permission==='default'){/* Permission is requested only after a user enables notifications in Settings. */}document.addEventListener('visibilitychange',()=>{if(!document.hidden)liveSync();if(document.hidden&&S.pin&&!document.querySelector('[data-lock]'))lockApp()});{let x0=0,y0=0;addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});addEventListener('touchend',e=>{const t=e.changedTouches[0];if(x0<40&&t.clientX-x0>90&&Math.abs(t.clientY-y0)<60)back()},{passive:true})}

<script>
(function(){
const api='/api/community';
const ML={me:null,members:[],requests:[],plans:{status:'free',chatPass:false,call:false},statuses:[],poll:null,busy:false};
async function apiReq(path,opts={}){const res=await fetch(api+path,{credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/json'},...opts});let d={};try{d=await res.json()}catch(e){}if(!res.ok||d.success===false){const x=new Error(d.error||'Request failed ('+res.status+')');x.status=res.status;throw x}return d}
window.apiReq=apiReq;
const nm=m=>m&&(m.name||m.username)||'Member', member=id=>ML.members.find(m=>m.id===id);
function err(e){toast(e&&e.status===401?'Please sign in to use the Manlung community.':(e.message||'Community service unavailable.'))}
function chat(m){let c=S.chats.find(x=>x.memberId===m.id);if(!c){c={id:m.id,memberId:m.id,n:nm(m),avatar:m.avatar||m.avatar_url||null,m:[],un:0,pin:0,ar:0,mu:0,remote:true};S.chats.push(c)}c.n=nm(m);c.avatar=m.avatar||m.avatar_url||c.avatar||null;return c}
window.communityAvatar=function(c){const url=c&&(c.avatar||c.member&&c.member.avatar);return url?'<span class="av" style="background:url(\''+esc(url)+'\') center/cover no-repeat" aria-label="'+esc(c.n||'Member')+'"></span>':sav(c.n||'Member')}
function time(t){try{return new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}catch(e){return ''}}
async function loadMsgs(id,quiet){try{const d=await apiReq('/messages/'+encodeURIComponent(id));const c=chat(member(id)||{id:id,name:'Member'});c.m=(d.messages||[]).map(x=>[x.sender_user_id===ML.me?'me':'th',x.message,time(x.created_at),0,null,x.sender_user_id===ML.me?'You':nm(member(x.sender_user_id)||{name:c.n}),null,null,0,new Date(x.created_at).getTime(),0,0,x.id]);if(open===id)paint(c);else if(!quiet)render()}catch(e){if(!quiet)err(e)}}
// Keep chat previews, unread counts, and community statuses current without a manual refresh.
let __mlPollBusy=false;async function liveSync(){if(__mlPollBusy||document.hidden||!ML.me)return;__mlPollBusy=true;try{const ids=S.chats.filter(c=>c.remote&&c.memberId).map(c=>c.memberId);await Promise.all(ids.map(async id=>{const c=S.chats.find(x=>x.memberId===id);if(!c)return;const oldLast=c.m.length?c.m[c.m.length-1][12]:null;const d=await apiReq('/messages/'+encodeURIComponent(id));const next=(d.messages||[]).map(x=>[x.sender_user_id===ML.me?'me':'th',x.message,time(x.created_at),0,null,x.sender_user_id===ML.me?'You':nm(member(x.sender_user_id)||{name:c.n}),null,null,0,new Date(x.created_at).getTime(),0,0,x.id]);const newest=next.length?next[next.length-1]:null;const changed=next.length!==c.m.length||(newest&&newest[12]!==oldLast);if(changed){const incoming=next.filter(x=>x[0]==='th'&&(!oldLast||x[12]!==oldLast));c.m=next;if(open===id){paint(c);if(incoming.length)ding()}else if(incoming.length){c.un=(c.un||0)+incoming.length;ding();if(S.notif&&'Notification'in window&&Notification.permission==='granted'&&incoming.length){const last=incoming[incoming.length-1];new Notification(c.n,{body:S.preview?(last[1]||'New message'):'New message',icon:'/client/favicon.svg'})}}}}));if(tab==='chats'&&!open)render();}catch(e){}finally{__mlPollBusy=false}}
setInterval(liveSync,4000);
let __mlProfileSyncBusy=false;async function syncCommunityProfiles(){if(__mlProfileSyncBusy||document.hidden||!ML.me)return;__mlProfileSyncBusy=true;try{const d=await apiReq('/members');const fresh=d.members||[];let changed=false;ML.members=fresh;window.__mlMembers=fresh;for(const m of fresh){const x=S.chats.find(c=>c.memberId===m.id);if(x){const url=m.avatar||m.avatar_url||null;if((x.avatar||null)!==(url||null)||x.n!==nm(m)){x.avatar=url;x.n=nm(m);changed=true}}}if(changed){save();render()}}catch(e){}finally{__mlProfileSyncBusy=false}}
setInterval(syncCommunityProfiles,5000);
async function refresh(quiet){if(ML.busy)return;ML.busy=true;try{const z=await Promise.allSettled([apiReq('/profile'),apiReq('/members'),apiReq('/friend-requests'),apiReq('/plans/status'),apiReq('/status'),apiReq('/groups')]);const val=i=>z[i].status==='fulfilled'?z[i].value:{};const me=val(0),mem=val(1),fr=val(2),pl=val(3),st=val(4),gr=val(5);if(!me.profile)throw (z[0].reason||new Error('Please sign in to use the Manlung community.'));ML.me=me.profile.id;ML.members=mem.members||[];window.__mlMembers=ML.members;window.__mlMe=ML.me;ML.requests=fr.requests||[];const acceptedMemberIds=new Set(ML.requests.filter(x=>x.status==='accepted'&&x.member&&x.member.id).map(x=>x.member.id));ML.requests=ML.requests.filter(x=>x.status!=='pending'||!x.member||!acceptedMemberIds.has(x.member.id));ML.plans=pl.plans||ML.plans;window.__mlCallPlans=ML.plans;ML.groups=gr.groups||[];ML.statuses=st.statuses||[];S.name=me.profile.name||'Member';S.about=me.profile.bio||'';S.pic=me.profile.avatar||'';const rel=ML.requests.filter(x=>x.status==='accepted');S.friends=['Saved messages'].concat(rel.map(x=>nm(x.member))).filter(n=>!['Peter Add','Faith Add','Daniel Add','Grace Add'].includes(n));S.req=ML.requests.filter(x=>x.status==='pending'&&x.direction==='sent').map(x=>nm(x.member));S.inc=ML.requests.filter(x=>x.status==='pending'&&x.direction==='received').map(x=>nm(x.member));S.chats=[];rel.filter(x=>x.member&&!['Peter Add','Faith Add','Daniel Add','Grace Add'].includes(nm(x.member))).forEach(x=>chat(x.member));S.plan=ML.plans.status||'free';S.planEnd=0;S.passEnd=ML.plans.chatPass?Date.now()+86400000:0;S.stat=ML.statuses.map(x=>({id:x.id,userId:x.user_id,n:x.owner&&x.owner.name||'Member',t:x.text_content||x.caption||'',s:false,own:x.user_id===ML.me,createdAt:x.created_at}));S.myStat=S.stat.filter(x=>x.own).map(x=>({id:x.id,d:new Date(x.createdAt).toISOString().slice(0,10),t:x.t}));if(typeof open==='string')await loadMsgs(open,true);if(!quiet)render();for(const x of rel){if(x.member&&x.member.id){const ch=chat(x.member);if(!ch._previewLoaded){ch._previewLoaded=true;loadMsgs(x.member.id,true).catch(()=>{})}}}}catch(e){if(!ML.me){S.chats=[];S.stat=[];S.myStat=[];S.calls=[];S.comm=[];S.friends=[];S.req=[];S.inc=[];if(!quiet){render();err(e)}}else if(!quiet)err(e)}finally{ML.busy=false}}
window.refreshCommunity=refresh;
window.reqFriend=async function(n){const m=ML.members.find(x=>nm(x)===n||x.username===n);if(!m)return toast('Select a registered member first.');try{const result=await apiReq('/friend-requests/'+m.id,{method:'POST',body:'{}'});await window.refreshCommunity(false);if(result.alreadyFriends||result.acceptedReciprocalRequest||result.request&&result.request.status==='accepted'){window.chatWith(nm(member(m.id)||m));toast('You are already friends — opening chat')}else toast('Friend request sent')}catch(e){err(e)}};
window.respondToCommunityRequest=async function(name,action){const request=ML.requests.find(x=>x.status==='pending'&&x.direction==='received'&&x.member&&nm(x.member)===name);if(!request||!request.id)throw new Error('No pending request found for '+name+'. Refresh the page and try again.');const result=await apiReq('/friend-requests/'+request.id,{method:'PATCH',body:JSON.stringify({action})});if(!result.request||result.request.status!==(action==='accept'?'accepted':'declined'))throw new Error('The server did not confirm that the request was '+(action==='accept'?'accepted':'declined')+'.');await refresh(true);if(action==='accept'){const friend=member(request.member.id)||request.member;const c=chat(friend);tab='chats';open=c.id;c.un=0;render();await loadMsgs(friend.id,true);render();toast('You are now friends — chat is open.')}else{render();toast('Friend request declined.')}};
window.reqs=function(){const rows=ML.requests.filter(x=>x.status==='pending'&&x.direction==='received');const d=modal('<b>Friend requests</b>'+rows.map(x=>'<div class="row"><div class="grow"><div class="nm">'+esc(nm(x.member))+'</div></div><button class="btn" data-a="'+x.id+'">Accept</button><button class="btn ghost" data-d="'+x.id+'">Decline</button></div>').join('')||'<div class="empty">No pending requests</div>');d.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{const request=ML.requests.find(x=>x.id===b.dataset.a);const friend=request&&request.member;if(!friend||!friend.id)return toast('Could not identify this member. Please refresh and try again.');b.disabled=true;try{const acceptedResult=await apiReq('/friend-requests/'+b.dataset.a,{method:'PATCH',body:JSON.stringify({action:'accept'})});if(!acceptedResult.request||acceptedResult.request.status!=='accepted')throw new Error('The friend request was not saved as accepted. Please try again.');d.remove();request.status='accepted';await refresh(true);const fresh=member(friend.id)||friend;const c=chat(fresh);tab='chats';open=c.id;c.un=0;render();await loadMsgs(friend.id,true);try{const existing=await apiReq('/messages/'+friend.id);if(!(existing.messages||[]).length){await apiReq('/messages/'+friend.id,{method:'POST',body:JSON.stringify({message:'Hi 👋 Glad we’re connected! How are you?'})});await loadMsgs(friend.id,true)}}catch(e){console.warn('Optional welcome message failed:',e.message)}render();toast('You are now friends — chat is open.')}catch(e){console.error('Friend request acceptance failed:',e);b.disabled=false;let note=d.querySelector('[data-accept-error]');if(!note){note=document.createElement('div');note.setAttribute('data-accept-error','');note.style.cssText='margin:12px;padding:12px;border:1px solid #e5484d;border-radius:10px;color:#e5484d;font-size:14px;white-space:normal';d.appendChild(note)}note.textContent='Accept failed: '+(e&&e.message||'Unknown error')+'. Please keep this message for support.';err(e)}});d.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{try{await apiReq('/friend-requests/'+b.dataset.d,{method:'PATCH',body:JSON.stringify({action:'decline'})});d.remove();await refresh(false)}catch(e){err(e)}})};
window.pickMember=function(){const d=modal('<b>Registered members</b>'+ML.members.map(m=>'<button class="row" data-id="'+m.id+'"><div class="grow"><div class="nm">'+esc(nm(m))+'</div><div class="sub">'+esc(m.bio||m.username||'Member')+'</div></div><span class="meta">'+(m.online?'Online':'Member')+'</span></button>').join('')||'<div class="empty">No discoverable members.</div>');d.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{const m=member(b.dataset.id),r=ML.requests.find(x=>x.member&&x.member.id===m.id&&['accepted','pending'].includes(x.status));d.remove();if(r&&r.status==='accepted')window.chatWith(nm(m));else window.reqFriend(nm(m))})};
window.chatWith=function(n){const listed=ML.members.find(x=>nm(x)===n||x.username===n);const rel=ML.requests.find(x=>x.status==='accepted'&&x.member&&(nm(x.member)===n||x.member.username===n));const m=listed||(rel&&rel.member);if(!m)return toast('Member not found. Refresh the page and try again.');if(!ML.requests.some(x=>x.status==='accepted'&&x.member&&x.member.id===m.id)&&!ML.plans.chatPass)return toast('Accept the friend request first, or buy a Chat pass.');const c=chat(m);open=c.id;c.un=0;render();loadMsgs(c.id,false)};
window.openChat=function(id){const c=S.chats.find(x=>x.id===id);if(!c)return; if(c.memberId&&!ML.requests.some(x=>x.status==='accepted'&&x.member&&x.member.id===id)&&!ML.plans.chatPass)return toast('Friend acceptance or a Chat pass is required.');open=id;c.un=0;render();if(c.memberId)loadMsgs(id,false)};
window.send=async function(a){const c=S.chats.find(x=>x.id===open),i=$('#in');if(!c||!i)return;if(a)return toast('Attachments are not enabled for server chat yet.');const message=i.value.trim();if(!message)return;if(!c.memberId)return toast('Choose a registered member to start a conversation.');try{await apiReq('/messages/'+c.memberId,{method:'POST',body:JSON.stringify({message})});i.value='';typ();await loadMsgs(c.memberId,true)}catch(e){err(e)}};
window.pay=async function(code){if(code==='call')return toast('Call payments are disabled while testing.');const plan=code==='pass'?'chat_pass':code;try{const d=await apiReq('/plans/initialize',{method:'POST',body:JSON.stringify({plan_code:plan})});location.assign(d.authorizationUrl)}catch(e){err(e)}};

 const old=document.querySelector('#ml-peer-call');if(old)old.remove();
 const el=document.createElement('div');el.id='ml-peer-call';el.className='ov';el.style.zIndex='100';
 el.innerHTML='<div style="text-align:center;padding:10px 0 16px"><div class="ml-call-avatar">'+(mode==='video'?'▣':'☎')+'</div><div style="font-size:12px;letter-spacing:1.8px;text-transform:uppercase;color:#9fe8c8;margin-bottom:8px">'+(incoming?'Incoming call':(mode==='video'?'Video call':'Voice call'))+'</div><h2 id="ml-peer-name" style="margin:0 0 8px;font-size:27px;letter-spacing:-.5px">'+esc(name)+'</h2><div id="ml-peer-state">'+(incoming?'Incoming '+(mode==='video'?'video':'voice')+' call':'Calling '+esc(name)+'…')+'</div></div><div style="width:100%;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin:4px 0"><video id="ml-peer-remote" autoplay playsinline style="width:100%;max-height:42vh;object-fit:cover;background:#111;border-radius:18px;display:none"></video><audio id="ml-peer-audio" autoplay playsinline style="display:none"></audio><video id="ml-peer-local" autoplay playsinline muted style="width:34%;max-height:18vh;object-fit:cover;background:#222;border:2px solid #ffffff50;border-radius:14px;display:none"></video></div><div class="ctl ml-call-actions" style="display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap">'+(incoming?'<button id="ml-peer-answer" class="btn" title="Answer" aria-label="Answer" style="border-radius:50%;width:58px;height:58px;font-size:22px;background:#16a34a">'+callIcon(CALL_ICONS.accept,'Accept call')+'</button><button id="ml-peer-reject" class="end" title="Decline" aria-label="Decline" style="border-radius:50%;width:58px;height:58px;font-size:22px">'+callIcon(CALL_ICONS.end,'Decline call')+'</button>':'')+'<button id="ml-peer-mute" class="btn ghost" title="Mute microphone" aria-label="Mute microphone" style="border-radius:50%;width:54px;height:54px">'+callIcon(CALL_ICONS.mic,'Microphone on')+'</button>'+(mode==='video'?'<button id="ml-peer-camera" class="btn ghost" title="Turn camera off" aria-label="Turn camera off" style="border-radius:50%;width:54px;height:54px">'+callIcon(CALL_ICONS.camera,'Camera')+'</button>':'')+'<button id="ml-peer-end" class="end" title="End call" aria-label="End call" style="border-radius:50%;width:58px;height:58px;font-size:22px">'+callIcon(CALL_ICONS.end,'End call')+'</button></div>';
 $('#app').append(el);el.querySelector('#ml-peer-end').onclick=()=>endCall(true);
 const mute=el.querySelector('#ml-peer-mute');mute.onclick=()=>{const tracks=rtc.stream&&rtc.stream.getAudioTracks();if(tracks&&tracks.length){tracks.forEach(t=>t.enabled=!t.enabled);mute.innerHTML=callIcon(tracks[0].enabled?CALL_ICONS.mic:CALL_ICONS.mute,tracks[0].enabled?'Microphone on':'Microphone muted');mute.title=tracks[0].enabled?'Mute microphone':'Unmute microphone';mute.setAttribute('aria-label',mute.title)}};
 const camera=el.querySelector('#ml-peer-camera');camera.disabled=mode!=='video';camera.onclick=()=>{const tracks=rtc.stream&&rtc.stream.getVideoTracks();if(tracks&&tracks.length){tracks.forEach(t=>t.enabled=!t.enabled);camera.innerHTML=callIcon(CALL_ICONS.camera,tracks[0].enabled?'Camera on':'Camera off');camera.title=tracks[0].enabled?'Turn camera off':'Turn camera on';camera.setAttribute('aria-label',camera.title)}};
 if(incoming){el.querySelector('#ml-peer-answer').onclick=acceptIncoming;el.querySelector('#ml-peer-reject').onclick=()=>endCall(true,'reject')}
 return el
}
async function setup(mode){
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('Calls require HTTPS and microphone permission.');
 let config={iceServers:[{urls:'stun:stun.l.google.com:19302'}]};
 try{const res=await fetch('/api/calls/ice-servers',{credentials:'same-origin',cache:'no-store'});if(res.ok){const ice=await res.json();if(ice.success&&Array.isArray(ice.iceServers)&&ice.iceServers.length)config={iceServers:ice.iceServers}}}catch(_){}
 rtc.pc=new RTCPeerConnection(config);
 rtc.pc.onicecandidate=e=>{if(e.candidate)signal('ice',e.candidate.toJSON()).catch(note)};
 rtc.pc.ontrack=e=>{const stream=e.streams&&e.streams[0];if(!stream)return;const v=document.querySelector('#ml-peer-remote'),a=document.querySelector('#ml-peer-audio');if(stream.getVideoTracks().length&&v){v.srcObject=stream;v.style.display='block';v.play().catch(()=>{})}if(a){a.srcObject=stream;a.play().catch(()=>state('Tap the call screen to enable audio'))}};
 rtc.pc.onconnectionstatechange=()=>{if(!rtc.pc)return;const s=rtc.pc.connectionState;if(s==='connected'){rtc.connected=true;clearTimeout(rtc.timeout);state('Connected')}else if(s==='connecting')state('Connecting media…');else if(s==='disconnected')state('Connection interrupted — trying to recover…');else if(s==='failed'){state('Connection failed. Check your network or TURN relay.');endCall(true)}};
 try{rtc.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:mode==='video'?{facingMode:'user'}:false})}
 catch(e){if(mode==='video'){try{rtc.stream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});rtc.mode='audio';state('Camera unavailable; continuing with voice call')}catch(_){throw e}}else throw e}
 rtc.stream.getTracks().forEach(t=>rtc.pc.addTrack(t,rtc.stream));
 const local=document.querySelector('#ml-peer-local');if(local&&rtc.stream.getVideoTracks().length){local.srcObject=rtc.stream;local.style.display='block';local.play().catch(()=>{})}
 rtc.timeout=setTimeout(()=>{if(!rtc.closed&&!rtc.connected){state('No connection yet. Check microphone permission and network/TURN settings.');endCall(true)}},35000)
}
async function poll(){
 if(!rtc.callId||rtc.closed||rtc.polling)return;rtc.polling=true;
 try{
  const d=await rq('/peer-calls/'+encodeURIComponent(rtc.callId)+'/signals?after='+rtc.last);
  for(const s of d.signals||[]){
   rtc.last=Math.max(rtc.last,Number(s.id)||0);
   if(!rtc.pc)continue;
   if(s.signal_type==='offer'&&rtc.incoming){
    await rtc.pc.setRemoteDescription(s.payload);
    for(const c of rtc.iceQueue.splice(0)){try{await rtc.pc.addIceCandidate(c)}catch(_){}}
    const ans=await rtc.pc.createAnswer();await rtc.pc.setLocalDescription(ans);await signal('answer',rtc.pc.localDescription.toJSON());rtc.incoming=false;state('Calling…')
   }else if(s.signal_type==='answer'&&!rtc.incoming&&rtc.pc.signalingState==='have-local-offer'){
    await rtc.pc.setRemoteDescription(s.payload);for(const c of rtc.iceQueue.splice(0)){try{await rtc.pc.addIceCandidate(c)}catch(_){}}
   }else if(s.signal_type==='ice'&&s.payload){
    if(!rtc.pc.remoteDescription)rtc.iceQueue.push(s.payload);else try{await rtc.pc.addIceCandidate(s.payload)}catch(_){}
   }else if(s.signal_type==='reject'||s.signal_type==='hangup'){
    state(s.signal_type==='reject'?'Call declined':'Call ended');setTimeout(()=>endCall(false),500);return
   }
  }
  if(d.call&&['ended','rejected','missed'].includes(d.call.status)){state(d.call.status==='missed'?'Missed call':'Call ended');setTimeout(()=>endCall(false),500)}
 }catch(e){if(e.status===404||e.status===409){state(e.message);setTimeout(()=>endCall(false),500)}}
 finally{rtc.polling=false}
}
function beginPoll(){clearInterval(rtc.poll);rtc.poll=setInterval(poll,500);poll()}
async function startPeerCall(name,video){
 if(rtc.callId)return toast('Finish your current call first.');
 const m=(window.__mlMembers||[]).find(x=>(x.name||x.username)===name||x.username===name);
 if(!m)return toast('Choose a registered member from Community.');
 
 requestCallNotifications();rtc.closed=false;rtc.ending=false;rtc.connected=false;rtc.last=0;rtc.incoming=false;rtc.iceQueue=[];rtc.mode=video?'video':'audio';rtc.startedAt=Date.now();rtc.peerName=name;rtc.direction='outgoing';lastCallState='';vibrate([180,80,180]);
 try{const d=await rq('/peer-calls',{method:'POST',body:JSON.stringify({memberId:m.id,call_mode:rtc.mode})});rtc.callId=d.call.id;callUI(name,rtc.mode,false);startRingtone();await setup(rtc.mode);const offer=await rtc.pc.createOffer();await rtc.pc.setLocalDescription(offer);await signal('offer',rtc.pc.localDescription.toJSON());state('Ringing…');beginPoll()}
 catch(e){note(e);await endCall(!!rtc.callId,'hangup')}
}
async function acceptIncoming(){
 stopRingtone();if(!rtc.callId||rtc.ending)return;
 try{rtc.closed=false;rtc.ending=false;await signal('accept');await setup(rtc.mode);rtc.incoming=true;state('Connecting…');beginPoll()}
 catch(e){note(e);await endCall(true,'reject')}
}
async function endCall(notify,kind){
 if(rtc.ending)return;rtc.ending=true;const id=rtc.callId;
 if(notify&&id&&(!rtc.closed||kind==='reject')){try{await signal(kind||'hangup')}catch(_){}}
 rtc.closed=true;stopRingtone();if(id&&rtc.startedAt)saveCallLog(kind==='reject'?'missed':(rtc.connected?'ended':'cancelled'));clearInterval(rtc.poll);rtc.poll=null;clearTimeout(rtc.timeout);rtc.timeout=null;
 if(rtc.pc){rtc.pc.ontrack=null;rtc.pc.onicecandidate=null;try{rtc.pc.close()}catch(_){}}
 if(rtc.stream)rtc.stream.getTracks().forEach(t=>t.stop());
 rtc.pc=null;rtc.stream=null;rtc.callId=null;rtc.incoming=false;rtc.connected=false;rtc.iceQueue=[];rtc.polling=false;
 const el=document.querySelector('#ml-peer-call');if(el)el.remove();rtc.ending=false
}
window.call=function(name,video){startPeerCall(name,!!video)};
async function incomingCheck(){
 if(!window.__mlMe||rtc.callId||document.querySelector('#ml-peer-call'))return;
 try{const d=await rq('/peer-calls/incoming');const c=(d.calls||[]).find(x=>!rtc.seen.has(x.id));if(!c)return;rtc.seen.add(c.id);rtc.callId=c.id;rtc.closed=true;rtc.last=0;rtc.mode=c.call_mode;rtc.incoming=true;rtc.startedAt=Date.now();rtc.peerName=c.caller&&c.caller.name||'Manlung member';rtc.direction='incoming';lastCallState='';vibrate([300,120,300,120,500]);callUI(c.caller&&c.caller.name||'Manlung member',rtc.mode,true);notifyCall('Incoming '+(rtc.mode==='video'?'video':'voice')+' call',rtc.peerName+' is calling you. Open Manlung Community to answer.','ml-incoming-'+c.id);startRingtone()}
 catch(e){if(e.status===401)state('Sign in again to receive calls')}
}
rtc.incomingTimer=setInterval(()=>{if(window.__mlMe)incomingCheck()},2500);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&activeCallNotification){try{activeCallNotification.close()}catch(_){}activeCallNotification=null}if(document.hidden&&rtc.callId)notifyCall('Manlung call',rtc.peerName+' · Call continues in background','ml-call-'+rtc.callId)});
})();
</script>
