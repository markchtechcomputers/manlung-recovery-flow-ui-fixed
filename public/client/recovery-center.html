<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recovery Center · Manlung Recovery</title><meta name="description" content="Private Manlung Recovery client case, message and notification center"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/theme.css"><style>
body{background:#f5f8fc;color:#102033}.rc{max-width:1100px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.head h1{margin:0;font-size:1.45rem}.head p{margin:4px 0;color:#66788c;font-size:.8rem}.nav{display:flex;gap:7px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;padding:9px 12px;border-radius:9px;border:1px solid #d7e0ea;background:#fff;color:#17304b;text-decoration:none;font-weight:700;cursor:pointer}.btn.primary{background:#173e73;color:#fff;border-color:#173e73}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#fff;border:1px solid #dce5ee;border-radius:14px;padding:15px;box-shadow:0 5px 20px rgba(16,32,51,.05)}.wide{grid-column:span 2}.full{grid-column:1/-1}.label{font-size:.72rem;color:#6c7e91}.num{font-size:1.55rem;font-weight:800;margin-top:4px}.case{border:1px solid #dfe7ef;border-radius:12px;padding:13px;margin-bottom:9px;background:#fbfdff}.case h3{margin:0 0 5px;font-size:.95rem}.meta{display:flex;gap:7px;flex-wrap:wrap;color:#66788c;font-size:.73rem}.pill{padding:4px 8px;border-radius:999px;background:#eaf2fb;font-weight:700;color:#24527f}.timeline{border-left:2px solid #dbe6f0;padding-left:12px}.event{position:relative;padding:5px 0 10px;font-size:.78rem}.event:before{content:'';position:absolute;left:-19px;top:6px;width:7px;height:7px;border-radius:50%;background:#4385c5}.event small{display:block;color:#7b8da0;margin-top:3px}.msg{padding:10px;border-radius:11px;margin:6px 0;max-width:85%;background:#f0f4f8;font-size:.78rem}.msg.mine{margin-left:auto;background:#173e73;color:#fff}.notice{padding:10px;border:1px solid #dfe7ef;border-radius:10px;margin:6px 0;background:#fff;font-size:.77rem}.notice.unread{border-left:4px solid #4385c5;background:#f5faff}.compose{display:flex;gap:8px;margin-top:10px}.compose input{flex:1;padding:10px;border:1px solid #d5e0ea;border-radius:9px}.state{color:#687b8f;font-size:.78rem;margin-bottom:10px}.error{color:#b4233c}.empty{text-align:center;padding:20px;color:#718397;font-size:.8rem}@media(max-width:760px){.grid{grid-template-columns:1fr}.wide,.full{grid-column:auto}.compose{flex-direction:column}.msg{max-width:94%}}
</style></head><body><main class="rc"><header class="head"><div><h1>Recovery Center</h1><p>Your private cases, messages, progress and notifications</p></div><nav class="nav"><a class="btn" href="/client/dashboard.html">Dashboard</a><a class="btn" href="/client/request.html">New Request</a><a class="btn" href="/client/settings.html">Settings</a><button class="btn primary" id="refresh">Refresh</button></nav></header><div id="state" class="state">Loading…</div>
<section class="grid"><div class="card"><div class="label">My cases</div><div class="num" id="caseCount">—</div></div><div class="card"><div class="label">Unread notifications</div><div class="num" id="noticeCount">—</div></div><div class="card"><div class="label">Unread messages</div><div class="num" id="messageCount">—</div></div>
<div class="card wide"><h2>My cases</h2><div id="cases"></div></div><div class="card"><h2>Notifications</h2><div id="notifications"></div></div><div class="card full"><h2>Case conversation</h2><select id="caseSelect" style="width:100%;padding:10px;border:1px solid #d5e0ea;border-radius:9px"></select><div id="conversation" style="margin-top:10px"></div><div class="compose"><input id="message" maxlength="5000" placeholder="Write a message to your investigator…"><button class="btn primary" id="send">Send</button></div></div></section></main>
<script>
const token=localStorage.getItem('clientToken');if(!token)location.href='/login.html';const $=id=>document.getElementById(id);let cases=[];
function headers(){return {Authorization:'Bearer '+token,'Content-Type':'application/json'}} async function get(url){const r=await fetch(url,{headers:headers(),cache:'no-store'});const j=await r.json().catch(()=>({}));if(r.status===401){localStorage.removeItem('clientToken');location.href='/login.html';throw Error('Session expired')}if(!r.ok)throw Error(j.error||'Request failed');return j}
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const idOf=c=>c.case_id||c.caseId;
async function load(){ $('state').textContent='Refreshing…';try{const [c,n,m]=await Promise.all([get('/api/cases/client/me'),get('/api/notifications'),get('/api/messages/unread-count')]);cases=c.cases||[];$('caseCount').textContent=cases.length;$('noticeCount').textContent=(n.notifications||[]).filter(x=>!x.read_at).length;$('messageCount').textContent=m.count||0;renderCases();renderNotices(n.notifications||[]);fillSelect();if(cases.length)await loadConversation(idOf(cases[0]));$('state').textContent='Updated '+new Date().toLocaleTimeString()}catch(e){$('state').innerHTML='<span class="error">'+esc(e.message)+'</span>'}}
function renderCases(){$('cases').innerHTML=cases.map(c=>`<article class="case"><h3>${esc(idOf(c))}</h3><div class="meta"><span class="pill">${esc(c.status||'Pending')}</span><span>${esc(c.case_type||c.caseType||'Recovery case')}</span><span>${esc(c.priority||'Normal')}</span></div><p style="font-size:.78rem">${esc(c.public_notes||'No client-facing update yet.')}</p></article>`).join('')||'<div class="empty">No recovery cases yet.</div>'}
function renderNotices(items){$('notifications').innerHTML=items.slice(0,12).map(n=>`<div class="notice ${n.read_at?'':'unread'}"><strong>${esc(n.title||'Notification')}</strong><div>${esc(n.message||'')}</div><small>${esc(n.created_at||'')}</small>${n.read_at?'':' <button class="btn" style="margin-top:5px;padding:4px 7px;font-size:.65rem" onclick="readNotice('${esc(n.id)}')">Mark read</button>'}</div>`).join('')||'<div class="empty">No notifications.</div>'}
async function readNotice(id){try{await fetch('/api/notifications/'+encodeURIComponent(id)+'/read',{method:'POST',headers:headers()});load()}catch(e){}}
function fillSelect(){const s=$('caseSelect');s.innerHTML=cases.map(c=>`<option value="${esc(idOf(c))}">${esc(idOf(c))} · ${esc(c.status||'')}</option>`).join('');s.onchange=()=>loadConversation(s.value)}
async function loadConversation(id){if(!id){$('conversation').innerHTML='<div class="empty">Select a case.</div>';return}try{const j=await get('/api/messages/case/'+encodeURIComponent(id));$('conversation').innerHTML=(j.messages||[]).map(m=>`<div class="msg ${m.sender_user_id===decodeJwtSub()?'mine':''}">${esc(m.message)}<small style="opacity:.65;display:block;margin-top:4px">${esc(m.created_at||'')}</small></div>`).join('')||'<div class="empty">No messages yet.</div>'}catch(e){$('conversation').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
function decodeJwtSub(){try{return JSON.parse(atob(token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).sub||''}catch{return ''}}
$('send').onclick=async()=>{const id=$('caseSelect').value,msg=$('message').value.trim();if(!id||!msg)return;const b=$('send');b.disabled=true;try{await fetch('/api/messages/case/'+encodeURIComponent(id),{method:'POST',headers:headers(),body:JSON.stringify({message:msg})});$('message').value='';await loadConversation(id)}catch(e){alert(e.message)}finally{b.disabled=false}};$('refresh').onclick=load;load();setInterval(load,60000);
</script></body></html>
