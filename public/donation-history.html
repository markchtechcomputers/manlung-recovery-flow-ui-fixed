<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Donation History · Manlung Recovery</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/theme.css"><style>
body{background:#f4f7fb;color:#14263c}.wrap{max-width:900px;margin:auto;padding:22px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.card{background:#fff;border:1px solid #dce5ef;border-radius:16px;padding:18px;margin-top:16px;box-shadow:0 8px 28px #16345a0c}.btn{display:inline-flex;padding:9px 13px;border-radius:9px;border:1px solid #d5e0eb;background:#fff;color:#173858;text-decoration:none;font-weight:750;cursor:pointer}.primary{background:#17467a;color:#fff;border-color:#17467a}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid #edf1f6}.row:last-child{border:0}.muted{color:#6b7d91;font-size:.82rem}.amount{font-weight:850;font-size:1.05rem}.pill{display:inline-block;padding:4px 9px;border-radius:99px;font-size:.72rem;font-weight:800;text-transform:capitalize}.confirmed{background:#dcfce7;color:#166534}.pending{background:#fef3c7;color:#92400e}.failed{background:#fee2e2;color:#991b1b}.state{color:#64748b;font-size:.85rem}.empty{padding:25px;text-align:center;color:#73849a}
</style><script src="/js/client-session-guard.js"></script><script src="/js/native-app-chrome.js"></script><link rel="stylesheet" href="/css/client-portal-mobile.css?v=20261106c"></head>
<body class="client-donation-history"><main class="wrap"><header class="head"><div><h1>My donations</h1><p class="muted">Private payment history and confirmed receipts</p></div><nav><a class="btn" href="/donate.html">Donate</a> <a class="btn" href="/client/dashboard">Dashboard</a> <button class="btn primary" id="refresh">Refresh</button></nav></header><section class="card"><div id="state" class="state">Loading your donations…</div><div id="items"></div></section></main>
<script>
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function load(){ $('state').textContent='Loading…';try{const r=await fetch('/api/donations/history',{credentials:'include',cache:'no-store'});const d=await r.json().catch(()=>({}));if(r.status===401){location.href='/login?next='+encodeURIComponent('/donation-history.html');return}if(!r.ok)throw Error(d.error||'Could not load donation history');const rows=d.donations||[];$('state').textContent=rows.length?'Showing '+rows.length+' recent donations':'Your donation history is empty.';$('items').innerHTML=rows.map(x=>'<article class="row"><div><div class="amount">KES '+Number(x.amount_kes||0).toLocaleString('en-KE')+'</div><div class="muted">'+esc(x.reference)+' · '+esc(x.paid_at||x.created_at||'')+'</div></div><div><span class="pill '+esc(x.status||'pending')+'">'+esc(x.status||'pending')+'</span> '+(x.status==='confirmed'?'<a class="btn primary" href="/donation-receipt.html?reference='+encodeURIComponent(x.reference)+'">View receipt</a>':'<span class="muted">'+(x.status==='failed'?'Payment failed':'Awaiting payment confirmation')+'</span>')+'</div></article>').join('')||'<div class="empty">No donations have been recorded for this account yet.</div>'}catch(e){$('state').textContent=e.message;$('state').style.color='#b4233c'}}
$('refresh').addEventListener('click',load);load();
</script><script src="/js/client-portal-chrome.js?v=20261106c" defer></script></body></html>
