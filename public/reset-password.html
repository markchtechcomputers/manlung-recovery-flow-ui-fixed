<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password · Manlung Tech City</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style id="manlung-header-style">
.site-header{
  position:sticky;
  top:0;
  z-index:1000;
  background:
    linear-gradient(135deg,rgba(15,23,42,.98),rgba(17,35,56,.98)),
    repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 1px,transparent 1px 64px);
  border-bottom:1px solid rgba(96,165,250,.18);
  box-shadow:0 4px 18px rgba(2,6,23,.22);
}
.site-header .container{
  max-width:1180px;
  margin:0 auto;
  min-height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:1rem;
  padding:.55rem .8rem;
}
.site-header .brand{
  display:flex;
  align-items:center;
  gap:.75rem;
  min-width:0;
}
.site-header .brand h1{
  margin:0;
  color:#f8fafc;
  font-size:1.05rem;
  line-height:1.1;
  font-weight:800;
  letter-spacing:-.02em;
}
.site-header .brand h1 i{
  color:#60a5fa;
  margin-right:.3rem;
}
.site-header .brand span{
  display:block;
  margin-top:.16rem;
  color:#94a3b8;
  font-size:.72rem;
  white-space:nowrap;
}
.site-header .header-actions{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:.4rem;
}
.site-header .header-actions a,
.site-header .header-actions button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:.35rem;
  min-height:38px;
  padding:.45rem .68rem;
  border:1px solid rgba(148,163,184,.2);
  border-radius:9px;
  background:rgba(255,255,255,.04);
  color:#e2e8f0;
  text-decoration:none;
  font-size:.78rem;
  font-weight:700;
  transition:background .18s ease,border-color .18s ease,color .18s ease;
}
.site-header .header-actions a:hover,
.site-header .header-actions button:hover{
  background:rgba(255,255,255,.09);
  border-color:rgba(148,163,184,.35);
  color:#fff;
}
.site-header .header-actions .btn-primary{
  background:#2563eb;
  border-color:#2563eb;
  color:#fff;
}
.site-header .header-actions .btn-primary:hover{
  background:#1d4ed8;
  border-color:#1d4ed8;
}
@media(max-width:900px){
  .site-header .container{
    min-height:58px;
    padding:.45rem .7rem;
  }
  .site-header .brand h1{
    font-size:.95rem;
  }
  .site-header .brand span{
    font-size:.64rem;
  }
  .site-header .header-actions a,
  .site-header .header-actions button{
    min-height:36px;
    padding:.4rem .55rem;
    font-size:.7rem;
  }
}
@media(max-width:700px){
  .site-header .container{
    flex-wrap:wrap;
    gap:.45rem;
  }
  .site-header .brand{
    width:100%;
    justify-content:center;
    text-align:center;
  }
  .site-header .brand span{
    white-space:normal;
  }
  .site-header .header-actions{
    width:100%;
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:.35rem;
  }
  .site-header .header-actions a,
  .site-header .header-actions button{
    width:100%;
    min-height:38px;
    padding:.35rem .2rem;
    font-size:.68rem;
  }
}
@media(max-width:480px){
  .site-header .header-actions{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }
  .site-header .header-actions a,
  .site-header .header-actions button{
    font-size:0;
  }
  .site-header .header-actions a i,
  .site-header .header-actions button i{
    font-size:.95rem;
    margin:0;
  }
}
@media(max-width:360px){
  .site-header .brand h1{
    font-size:.86rem;
  }
  .site-header .brand span{
    font-size:.58rem;
  }
}
</style>
</head>
<body>
    <header class="site-header">
        <div class="container">
            <div class="brand"><h1><i class="fas fa-shield-halved"></i> Manlung Tech City</h1><span>Reset Password</span></div>
            <div class="header-actions"><a href="/" class="btn btn-outline"><i class="fas fa-home"></i> Home</a></div>
        </div>
    </header>

    <div style="min-height:60vh; display:flex; align-items:center; justify-content:center; padding:3rem 1rem;">
        <div class="card" style="max-width:420px; width:100%;">
            <div class="card-title"><i class="fas fa-key"></i> Choose a new password</div>
            <form id="resetForm" onsubmit="handleReset(event)">
                <div class="form-group"><label>New Password</label><input type="password" id="newPassword" minlength="6" required></div>
                <div class="form-group"><label>Confirm Password</label><input type="password" id="confirmPassword" minlength="6" required></div>
                <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">
                    <i class="fas fa-check"></i> Update Password
                </button>
                <div id="resetError" class="error-text"></div>
                <div id="resetSuccess" style="display:none; color:var(--success); text-align:center; margin-top:0.8rem; font-size:0.9rem;"></div>
            </form>
        </div>
    </div>

    <footer class="site-footer">
        <p>&copy; 2026 Manlung Tech City. All rights reserved.</p>
        <p><i class="fas fa-lock"></i> 256-bit Encrypted & Secure</p>
    </footer>

    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        if (!token) {
            document.getElementById('resetForm').innerHTML = '<p class="error-text">This reset link is missing its token. Please request a new one from the login page.</p>';
        }

        async function handleReset(event) {
            event.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorEl = document.getElementById('resetError');
            errorEl.textContent = '';

            if (newPassword !== confirmPassword) {
                errorEl.textContent = 'Passwords do not match.';
                return;
            }

            try {
                const res = await fetch('/api/auth/client/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password: newPassword }),
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('resetForm').style.display = 'none';
                    const successEl = document.getElementById('resetSuccess');
                    successEl.style.display = 'block';
                    successEl.innerHTML = '<i class="fas fa-circle-check"></i> Password updated. <a href="/login.html">Sign in now</a>.';
                } else {
                    errorEl.textContent = data.error || 'Could not reset password';
                }
            } catch (err) {
                errorEl.textContent = 'Could not reach the server (' + err.message + ').';
            }
        }
    </script>
</body>
</html>
