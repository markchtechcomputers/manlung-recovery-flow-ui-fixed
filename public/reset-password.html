<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password · Manlung Tech City</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style id="manlung-header-style">
.site-header{
  position:sticky;
  top:0;
  z-index:1000;
  background:#ffffff;
  border-bottom:1px solid #e5e7eb;
  box-shadow:0 1px 8px rgba(15,23,42,.05)}
.site-header .container{max-width:1180px;margin:0 auto;min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding:.45rem .8rem}
.site-header .brand{
  display:flex;
  align-items:center;
  gap:.8rem;
  min-width:0;
}
.site-header .brand h1{
  margin:0;
  color:#0f172a;
  font-size:1.15rem;
  line-height:1.1;
  font-weight:800;
  letter-spacing:-.02em;
}
.site-header .brand h1 i{
  color:#2563eb;
  margin-right:.35rem;
}
.site-header .brand span{
  display:block;
  margin-top:.18rem;
  color:#64748b;
  font-size:.78rem;
  white-space:nowrap;
}
.site-header .header-actions{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:.45rem;
  flex-wrap:wrap;
}
.site-header .header-actions a,
.site-header .header-actions button{
  text-decoration:none;
  white-space:nowrap;
  border-radius:9px;
  padding:.52rem .72rem;
  font-size:.82rem;
  font-weight:700;
  border:1px solid #e2e8f0;
  background:#fff;
  color:#334155;
  transition:background .18s ease,border-color .18s ease,color .18s ease,transform .18s ease;
}
.site-header .header-actions a:hover,
.site-header .header-actions button:hover{
  background:#f8fafc;
  border-color:#cbd5e1;
  color:#0f172a;
}
.site-header .header-actions a:active,
.site-header .header-actions button:active{
  transform:scale(.98);
}
.site-header .header-actions .btn-primary{
  background:#2563eb;
  border-color:#2563eb;
  color:#fff;
}
.site-header .header-actions .btn-primary:hover{
  background:#1d4ed8;
  border-color:#1d4ed8;
  color:#fff;
}
.site-header .header-actions .btn-outline{
  background:#fff;
  color:#334155;
}
.site-header .theme-toggle{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:42px;
  padding:.52rem .65rem;
}
@media(max-width:900px){
  .site-header .container{
    min-height:64px;
    padding:.65rem .8rem;
  }
  .site-header .brand{
    gap:.55rem;
  }
  .site-header .brand h1{
    font-size:1rem;
  }
  .site-header .brand span{
    font-size:.68rem;
  }
  .site-header .header-actions{
    gap:.35rem;
  }
  .site-header .header-actions a,
  .site-header .header-actions button{
    padding:.48rem .6rem;
    font-size:.76rem;
  }
}
@media(max-width:700px){
  .site-header .container{
    flex-wrap:wrap;
  }
  .site-header .brand{
    width:100%;
    justify-content:center;
    text-align:center;
  }
  .site-header .brand span{
    white-space:normal;
  }
  .site-header .header-actions{
    width:100%;
    justify-content:center;
  }
}
@media(max-width:430px){
  .site-header .header-actions{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    width:100%;
  }
  .site-header .header-actions a,
  .site-header .header-actions button{
    width:100%;
    text-align:center;
  }
}
</style>
</head>
<body>
    <header class="site-header">
        <div class="container">
            <div class="brand"><h1><i class="fas fa-shield-halved"></i> Manlung Tech City</h1><span>Reset Password</span></div>
            <div class="header-actions"><a href="/" class="btn btn-outline"><i class="fas fa-home"></i> Home</a></div>
        </div>
    </header>

    <div style="min-height:60vh; display:flex; align-items:center; justify-content:center; padding:3rem 1rem;">
        <div class="card" style="max-width:420px; width:100%;">
            <div class="card-title"><i class="fas fa-key"></i> Choose a new password</div>
            <form id="resetForm" onsubmit="handleReset(event)">
                <div class="form-group"><label>New Password</label><input type="password" id="newPassword" minlength="6" required></div>
                <div class="form-group"><label>Confirm Password</label><input type="password" id="confirmPassword" minlength="6" required></div>
                <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">
                    <i class="fas fa-check"></i> Update Password
                </button>
                <div id="resetError" class="error-text"></div>
                <div id="resetSuccess" style="display:none; color:var(--success); text-align:center; margin-top:0.8rem; font-size:0.9rem;"></div>
            </form>
        </div>
    </div>

    <footer class="site-footer">
        <p>&copy; 2026 Manlung Tech City. All rights reserved.</p>
        <p><i class="fas fa-lock"></i> 256-bit Encrypted & Secure</p>
    </footer>

    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        if (!token) {
            document.getElementById('resetForm').innerHTML = '<p class="error-text">This reset link is missing its token. Please request a new one from the login page.</p>';
        }

        async function handleReset(event) {
            event.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorEl = document.getElementById('resetError');
            errorEl.textContent = '';

            if (newPassword !== confirmPassword) {
                errorEl.textContent = 'Passwords do not match.';
                return;
            }

            try {
                const res = await fetch('/api/auth/client/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password: newPassword }),
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('resetForm').style.display = 'none';
                    const successEl = document.getElementById('resetSuccess');
                    successEl.style.display = 'block';
                    successEl.innerHTML = '<i class="fas fa-circle-check"></i> Password updated. <a href="/login.html">Sign in now</a>.';
                } else {
                    errorEl.textContent = data.error || 'Could not reset password';
                }
            } catch (err) {
                errorEl.textContent = 'Could not reach the server (' + err.message + ').';
            }
        }
    </script>
</body>
</html>
