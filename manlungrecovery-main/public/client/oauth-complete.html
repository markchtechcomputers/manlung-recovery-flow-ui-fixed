<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signing you in…</title></head><body><main style="font-family:system-ui;text-align:center;padding:20vh 1rem"><h2 id="t">Signing you in securely…</h2><p id="s">Completing GitHub sign-in.</p></main><script>(function(){try{const p=new URLSearchParams(location.hash.slice(1));const token=p.get('token');const user=p.get('user');if(!token||!user)throw new Error('GitHub sign-in session is missing.');localStorage.setItem('clientToken',token);localStorage.setItem('clientUser',decodeURIComponent(user));history.replaceState({},document.title,location.pathname);location.replace('/client/dashboard.html')}catch(e){document.getElementById('t').textContent='GitHub sign-in failed';document.getElementById('s').textContent=e.message+' Please return to sign in.';}})();</script></body></html>
