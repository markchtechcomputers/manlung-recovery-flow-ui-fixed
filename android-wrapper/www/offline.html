<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1626">
<title>Manlung Recovery — Offline</title>
<style>
:root{color-scheme:dark;--bg:#0b1626;--panel:#142943;--text:#f1f5f9;--muted:#a8bad0;--accent:#f2b84b;--green:#39d49a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{min-height:100%;display:grid;place-items:center;padding:24px;padding-top:calc(24px + env(safe-area-inset-top));padding-bottom:calc(24px + env(safe-area-inset-bottom));overflow:hidden;background:radial-gradient(ellipse at 50% 10%,#1b3b5d 0,#10243b 42%,var(--bg) 100%);color:var(--text);font-family:Arial,Helvetica,sans-serif;text-align:center}
main{position:relative;z-index:1;width:min(100%,420px);display:flex;flex-direction:column;align-items:center}
.brand{font-size:13px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#b8cce2;margin-bottom:22px}
.dish{width:min(62vw,230px);height:auto;margin-bottom:18px}
.line{fill:none;stroke:#91a9c2;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.bowl{fill:#eaf0f7}.shade{fill:#91a9c2;opacity:.45}.signal{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.2}50%{opacity:1}}
h1{font-size:clamp(25px,7vw,32px);line-height:1.15;margin:0 0 12px}
p{max-width:32ch;margin:0;color:var(--muted);font-size:16px;line-height:1.55}
.status{display:inline-flex;align-items:center;gap:10px;margin-top:24px;padding:10px 16px;border-radius:999px;background:#f2b84b1c;color:#f6d28a;font-size:14px;font-weight:700}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);animation:pulse 1.3s infinite}
.status.ok{background:#39d49a1c;color:#7ce6bb}.status.ok .dot{background:var(--green);animation:none}
button{width:min(100%,260px);margin-top:18px;padding:15px 24px;border:0;border-radius:14px;background:var(--accent);color:#1a1405;font-size:16px;font-weight:800;cursor:pointer}
button:disabled{opacity:.65}button:focus-visible{outline:3px solid white;outline-offset:3px}
small{margin-top:18px;color:#8298b2;font-size:12px}
@media(prefers-reduced-motion:reduce){.signal,.dot{animation:none}}
</style>
</head>
<body>
<main>
<div class="brand">MANLUNG RECOVERY</div>
<svg class="dish" viewBox="0 0 200 180" role="img" aria-label="Satellite dish searching for a signal">
<path class="line" d="M100 108v48m0-24-18 24m18-24 18 24M70 160h60"/>
<g transform="rotate(34 100 100)">
<path class="line" d="M100 108V57"/>
<path class="bowl" d="M44 100q56 54 112 0-56 18-112 0z"/>
<path class="shade" d="M56 101q44 31 88 0-44 13-88 0z"/>
<circle cx="100" cy="56" r="5" fill="#f2b84b"/>
<path class="signal" d="M90 44a14 14 0 0 1 20 0M82 35a26 26 0 0 1 36 0M74 26a38 38 0 0 1 52 0"/>
</g></svg>
<h1>No internet connection</h1>
<p>Check your Wi-Fi or mobile data. Manlung Recovery will reconnect automatically when the service is available.</p>
<div class="status" id="status" role="status" aria-live="polite"><span class="dot"></span><span id="statusText">Searching for connection…</span></div>
<button id="retry" type="button">Try Again</button>
<small>Your account and saved information are not affected.</small>
</main>
<script>
(function(){
  var siteUrl="https://manlungrecovery.manlungshop.co.ke/";
  var statusBox=document.getElementById("status");
  var statusText=document.getElementById("statusText");
  var button=document.getElementById("retry");
  var checking=false,reloading=false;
  function setStatus(message,ok){
    statusText.textContent=message;
    statusBox.classList.toggle("ok",!!ok);
  }
  async function checkConnection(){
    if(checking||reloading)return;
    checking=true;
    try{
      var controller=new AbortController();
      var timeout=setTimeout(function(){controller.abort();},7000);
      await fetch(siteUrl,{method:"GET",mode:"no-cors",cache:"no-store",signal:controller.signal});
      clearTimeout(timeout);
      reloading=true;
      setStatus("Connection restored. Reopening Manlung Recovery…",true);
      button.disabled=true;
      setTimeout(function(){window.location.replace(siteUrl);},450);
    }catch(error){
      setStatus(navigator.onLine?"Internet is not reaching Manlung Recovery yet. Retrying…":"Still offline. Waiting for your connection…",false);
    }finally{
      checking=false;
    }
  }
  button.addEventListener("click",function(){
    button.disabled=true;
    setStatus("Checking your connection…",false);
    checkConnection().finally(function(){if(!reloading)button.disabled=false;});
  });
  window.addEventListener("online",checkConnection);
  checkConnection();
  setInterval(checkConnection,8000);
})();
</script>
</body>
</html>
