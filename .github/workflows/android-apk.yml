name: Build Manlung Recovery Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix-current-deployment-20261022
      - fix-auth-and-admin-ui-20261030

permissions:
  contents: write
  actions: write

concurrency:
  group: manlung-android-apk
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build and publish installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Accept Android SDK licenses and install build packages
        shell: bash
        run: |
          set -eo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Generate Android wrapper and version the package
        id: apk
        env:
          APP_BUILD_NUMBER: ${{ github.run_number }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-wrapper/www
          cd android-wrapper
          npm init -y
          npm install @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7 @capacitor/app@^7 @capacitor/browser@^7 @capacitor/status-bar@^7 @capacitor/splash-screen@^7 @capacitor/keyboard@^7 @capacitor/assets@^3 sharp
          cat > www/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>Manlung Recovery</title>
            </head>
            <body><p>Opening Manlung Recovery…</p></body>
          </html>
          HTML
          # Use the exact same offline page in the browser PWA and the native Capacitor APK.
          cp ../public/offline.html www/offline.html
          test -s www/offline.html
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "co.manlungrecovery.app",
            "appName": "Manlung Recovery",
            "webDir": "www",
            "server": {
              "url": "https://manlungrecovery.manlungshop.co.ke/",
              "errorPath": "offline.html",
              "cleartext": false,
              "allowNavigation": [
                "manlungrecovery.manlungshop.co.ke",
                "accounts.google.com",
                "*.supabase.co",
                "github.com",
                "discord.com",
                "discordapp.com"
              ]
            },
            "android": {
              "allowMixedContent": false,
              "backgroundColor": "#071629"
            },
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 350,
                "launchAutoHide": true,
                "backgroundColor": "#071629",
                "showSpinner": false,
                "spinnerColor": "#38bdf8",
                "androidScaleType": "CENTER_CROP"
              },
              "StatusBar": {
                "style": "LIGHT",
                "backgroundColor": "#071629",
                "overlaysWebView": false
              },
              "Keyboard": {
                "resize": "native",
                "style": "DARK"
              }
            }
          }
          JSON
          mkdir -p assets
          curl --fail --silent --show-error --location \
            "https://manlungrecovery.manlungshop.co.ke/icons/icon-512.png" \
            --output /tmp/manlung-icon.png
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          await sharp('/tmp/manlung-icon.png')
            .resize(1024, 1024, { fit: 'contain', background: '#ffffff' })
            .png()
            .toFile('assets/icon.png');
          NODE
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android
          # Register the custom OAuth callback URI so external Google/GitHub login can reopen the APK.
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text()
          manifest_tag = re.search(r'<manifest\b[^>]*>', source)
          if not manifest_tag:
              raise SystemExit("Could not locate Android manifest root")
          permissions = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE"
          ]
          for permission in permissions:
              if f'android:name="{permission}"' not in source:
                  source = source[:manifest_tag.end()] + f'\n    <uses-permission android:name="{permission}" />' + source[manifest_tag.end():]
                  manifest_tag = re.search(r'<manifest\b[^>]*>', source)
          activity = re.search(r'(<activity\b[^>]*android:name="[^"]*MainActivity"[^>]*>)([\s\S]*?)(</activity>)', source)
          if not activity:
              raise SystemExit("Could not locate the Capacitor MainActivity in AndroidManifest.xml")
          if "co.manlungrecovery.app" not in activity.group(2):
              intent_filter = '''
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="co.manlungrecovery.app" android:host="auth" android:path="/callback" />
                  </intent-filter>
              '''
              replacement = activity.group(1) + activity.group(2) + intent_filter + activity.group(3)
              source = source[:activity.start()] + replacement + source[activity.end():]
              manifest.write_text(source)
          print("Registered co.manlungrecovery.app://auth/callback for OAuth return")
          PY
          # Add WebView settings and a native connectivity monitor to Capacitor's BridgeActivity.
          python3 - <<'PY'
          from pathlib import Path
          candidates = list(Path("android/app/src/main/java").rglob("MainActivity.java"))
          if len(candidates) != 1:
              raise SystemExit(f"Expected exactly one MainActivity.java, found {len(candidates)}")
          activity = candidates[0]
          source = activity.read_text()
          nl = chr(10)
          class_start = source.find("public class MainActivity extends BridgeActivity")
          brace = source.find("{", class_start) if class_start >= 0 else -1
          if brace < 0:
              raise SystemExit("Could not locate generated Capacitor MainActivity class")
          if "setMediaPlaybackRequiresUserGesture(false)" not in source:
              settings = nl.join([
                  "        getBridge().getWebView().getSettings().setMediaPlaybackRequiresUserGesture(false);",
                  '        getBridge().getWebView().getSettings().setUserAgentString("ManlungRecoveryAndroid " + getBridge().getWebView().getSettings().getUserAgentString());',
                  "        if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.TIRAMISU) {",
                  "            getBridge().getWebView().getSettings().setAlgorithmicDarkeningAllowed(false);",
                  "        } else if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.Q) {",
                  "            getBridge().getWebView().getSettings().setForceDark(android.webkit.WebSettings.FORCE_DARK_OFF);",
                  "        }"
              ])
              marker = "super.onCreate(savedInstanceState);"
              if marker in source:
                  source = source.replace(marker, marker + nl + settings, 1)
              else:
                  method = nl.join([
                      "    @Override",
                      "    public void onCreate(android.os.Bundle savedInstanceState) {",
                      "        super.onCreate(savedInstanceState);",
                      settings,
                      "    }"
                  ])
                  source = source[:brace + 1] + nl + method + nl + source[brace + 1:]
          if "manlungNetworkCallback" not in source:
              members = nl.join([
                  "    private android.net.ConnectivityManager manlungConnectivityManager;",
                  "    private android.net.ConnectivityManager.NetworkCallback manlungNetworkCallback;",
                  "    private boolean manlungOfflinePageShowing = false;",
                  "",
                  "    private boolean manlungHasValidatedNetwork() {",
                  "        if (manlungConnectivityManager == null) return false;",
                  "        android.net.Network active = manlungConnectivityManager.getActiveNetwork();",
                  "        android.net.NetworkCapabilities caps = manlungConnectivityManager.getNetworkCapabilities(active);",
                  "        return caps != null && caps.hasCapability(android.net.NetworkCapabilities.NET_CAPABILITY_INTERNET)",
                  "            && caps.hasCapability(android.net.NetworkCapabilities.NET_CAPABILITY_VALIDATED);",
                  "    }",
                  "",
                  "    private void manlungShowOfflinePage() {",
                  "        if (manlungOfflinePageShowing) return;",
                  "        manlungOfflinePageShowing = true;",
                  "        runOnUiThread(() -> {",
                  "            if (getBridge() != null && getBridge().getWebView() != null)",
                  '                getBridge().getWebView().loadUrl("file:///android_asset/public/offline.html");',
                  "        });",
                  "    }",
                  "",
                  "    private void manlungReloadLiveSite() {",
                  "        if (!manlungOfflinePageShowing) return;",
                  "        manlungOfflinePageShowing = false;",
                  "        runOnUiThread(() -> {",
                  "            if (getBridge() != null && getBridge().getWebView() != null)",
                  '                getBridge().getWebView().loadUrl("https://manlungrecovery.manlungshop.co.ke/");',
                  "        });",
                  "    }",
                  "",
                  "    @Override",
                  "    public void onStart() {",
                  "        super.onStart();",
                  "        manlungConnectivityManager = (android.net.ConnectivityManager) getSystemService(android.content.Context.CONNECTIVITY_SERVICE);",
                  "        manlungNetworkCallback = new android.net.ConnectivityManager.NetworkCallback() {",
                  "            @Override public void onAvailable(android.net.Network network) {",
                  "                new android.os.Handler(android.os.Looper.getMainLooper()).postDelayed(() -> {",
                  "                    if (manlungHasValidatedNetwork()) manlungReloadLiveSite();",
                  "                }, 500);",
                  "            }",
                  "            @Override public void onCapabilitiesChanged(android.net.Network network, android.net.NetworkCapabilities caps) {",
                  "                if (caps.hasCapability(android.net.NetworkCapabilities.NET_CAPABILITY_INTERNET)",
                  "                    && caps.hasCapability(android.net.NetworkCapabilities.NET_CAPABILITY_VALIDATED))",
                  "                    manlungReloadLiveSite();",
                  "                else manlungShowOfflinePage();",
                  "            }",
                  "            @Override public void onLost(android.net.Network network) {",
                  "                new android.os.Handler(android.os.Looper.getMainLooper()).postDelayed(() -> {",
                  "                    if (!manlungHasValidatedNetwork()) manlungShowOfflinePage();",
                  "                }, 350);",
                  "            }",
                  "        };",
                  "        try {",
                  "            if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.N)",
                  "                manlungConnectivityManager.registerDefaultNetworkCallback(manlungNetworkCallback);",
                  "            else",
                  "                manlungConnectivityManager.registerNetworkCallback(new android.net.NetworkRequest.Builder().addCapability(android.net.NetworkCapabilities.NET_CAPABILITY_INTERNET).build(), manlungNetworkCallback);",
                  "        } catch (Exception error) { android.util.Log.w(\"ManlungRecovery\", \"Network monitor registration failed\", error); }",
                  "        if (!manlungHasValidatedNetwork()) manlungShowOfflinePage();",
                  "    }",
                  "",
                  "    @Override",
                  "    public void onStop() {",
                  "        if (manlungConnectivityManager != null && manlungNetworkCallback != null) {",
                  "            try { manlungConnectivityManager.unregisterNetworkCallback(manlungNetworkCallback); }",
                  "            catch (Exception ignored) {}",
                  "            manlungNetworkCallback = null;",
                  "        }",
                  "        super.onStop();",
                  "    }"
              ])
              last_brace = source.rfind("}")
              source = source[:last_brace] + members + nl + source[last_brace:]
          activity.write_text(source)
          print(f"Configured WebView connectivity fallback in {activity}")
          PY
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          build = int(os.environ["APP_BUILD_NUMBER"])
          gradle = Path("android/app/build.gradle")
          source = gradle.read_text()
          source, code_count = re.subn(r"(?m)^(\s*)versionCode\s+\d+", lambda m: m.group(1) + "versionCode " + str(build), source, count=1)
          source, name_count = re.subn(r"(?m)^(\s*)versionName\s+[\"'][^\"']+[\"']", lambda m: m.group(1) + 'versionName "1.0.' + str(build) + '"', source, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit("Could not safely set Android versionCode/versionName in generated Gradle file")
          gradle.write_text(source)
          PY
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] && [ -n "${ANDROID_KEY_ALIAS:-}" ] && [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            python3 - <<'PY'
          from pathlib import Path
          gradle = Path("android/app/build.gradle")
          source = gradle.read_text()
          marker = "    buildTypes {"
          if marker not in source:
              raise SystemExit("Could not locate Android buildTypes block")
          signing = '''    signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }

          '''
          source = source.replace(marker, signing + marker, 1)
          marker = "        release {"
          start = source.index("    buildTypes {")
          pos = source.find(marker, start)
          if pos < 0:
              raise SystemExit("Could not locate release build type")
          source = source[:pos] + source[pos:].replace(marker, marker + "\n            signingConfig signingConfigs.release", 1)
          gradle.write_text(source)
          PY
            (cd android && ./gradlew --no-daemon assembleRelease)
            cp android/app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/ManlungRecovery.apk"
            echo "signed_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Stable APK signing secrets are missing. This run will create a test APK artifact only and will NOT replace the published Android APK."
            (cd android && ./gradlew --no-daemon assembleDebug)
            cp android/app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/ManlungRecovery.apk"
            echo "signed_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify APK package before publishing
        shell: bash
        run: |
          set -euo pipefail
          test -s ManlungRecovery.apk
          APK_SIZE="$(stat -c '%s' ManlungRecovery.apk)"
          if [ "$APK_SIZE" -lt 1000000 ]; then
            echo "::error::Built APK is unexpectedly small ($APK_SIZE bytes); refusing to publish."
            exit 1
          fi
          echo "APK file exists and is $APK_SIZE bytes."
          echo "SHA-256: $(sha256sum ManlungRecovery.apk | cut -d ' ' -f 1)"

      - name: Publish latest stable-signed APK
        if: steps.apk.outputs.signed_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APP_BUILD_NUMBER: ${{ github.run_number }}
          APP_VERSION_NAME: 1.0.${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          OLD_NOTES=""
          if gh release view android-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            OLD_NOTES="$(gh release view android-latest --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          fi
          MIGRATION_REQUIRED=false
          if ! grep -qi '^Signing-Key: stable$' <<< "$OLD_NOTES"; then
            MIGRATION_REQUIRED=true
          fi
          APK_SHA256="$(sha256sum ManlungRecovery.apk | cut -d ' ' -f 1)"
          NOTES="Latest stable-signed Android package for Manlung Recovery.
          Version-Name: $APP_VERSION_NAME
          Version-Code: $APP_BUILD_NUMBER
          Signing-Key: stable
          Signing-Migration: $MIGRATION_REQUIRED
          APK-SHA256: $APK_SHA256
          Built from commit: $GITHUB_SHA

          Website features are delivered live while online. Native Android package updates are published here; Android always requires user approval. The first stable-signed release may require uninstalling an older APK that was signed with a different temporary key. This direct-download APK is not distributed through Google Play."
          if gh release view android-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload android-latest ManlungRecovery.apk --clobber --repo "$GITHUB_REPOSITORY"
            # Remove obsolete APK assets but preserve the canonical download.
            while IFS= read -r asset; do
              [ -z "$asset" ] && continue
              [ "$asset" = "ManlungRecovery.apk" ] && continue
              gh release delete-asset android-latest "$asset" --yes --repo "$GITHUB_REPOSITORY"
            done < <(gh release view android-latest --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name | select(test("\\.apk$"; "i"))')
            gh release edit android-latest --title "Manlung Recovery Android APK" --notes "$NOTES" --repo "$GITHUB_REPOSITORY"
          else
            gh release create android-latest ManlungRecovery.apk --title "Manlung Recovery Android APK" --notes "$NOTES" --repo "$GITHUB_REPOSITORY"
          fi

          # Guard against the exact broken-download scenario: a green build without the expected release asset.
          gh release view android-latest --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq 'ManlungRecovery.apk' || {
            echo "::error::Release android-latest exists but ManlungRecovery.apk is missing. The download URL would return 404."
            exit 1
          }
          echo "Verified published APK asset: https://github.com/$GITHUB_REPOSITORY/releases/download/android-latest/ManlungRecovery.apk"

      - name: Upload test APK when stable signing is not configured
        if: steps.apk.outputs.signed_release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ManlungRecovery-test-apk-${{ github.run_number }}
          path: ManlungRecovery.apk
          retention-days: 3

      - name: Record APK signing requirement
        if: steps.apk.outputs.signed_release != 'true'
        shell: bash
        run: |
          {
            echo "### Android APK release not published"
            echo ""
            echo "The package was built for validation only; the public release was not changed because permanent signing is not configured."
            echo "If the download link returns HTTP 404, the release asset is absent. Do not publish a fresh debug-key APK over the stable link."
            echo "Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD in repository Actions secrets, then rerun this workflow."
            echo "See `APK_UPDATE_SETUP.md` for the permanent signing setup."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clear older Android APK build artifacts
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_APK_ARTIFACT: ManlungRecovery-test-apk-${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          while read -r artifact_id artifact_name; do
            [ -z "$artifact_id" ] && continue
            [ "$artifact_name" = "$CURRENT_APK_ARTIFACT" ] && continue
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
            echo "Deleted obsolete APK build artifact: $artifact_name"
          done < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.name | startswith("ManlungRecovery-test-apk-")) | "\(.id) \(.name)"'
          )
