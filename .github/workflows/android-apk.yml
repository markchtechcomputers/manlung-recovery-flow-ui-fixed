name: Build Manlung Recovery Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: manlung-android-apk
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build and publish installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Accept Android SDK licenses and install build packages
        shell: bash
        run: |
          set -eo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Generate Android wrapper with the official Manlung icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-wrapper/www
          cd android-wrapper
          npm init -y
          npm install @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7 @capacitor/assets@^3 sharp
          cat > www/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>Manlung Recovery</title>
            </head>
            <body><p>Opening Manlung Recovery…</p></body>
          </html>
          HTML
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "co.manlungrecovery.app",
            "appName": "Manlung Recovery",
            "webDir": "www",
            "server": {
              "url": "https://manlungrecovery.manlungshop.co.ke/",
              "cleartext": false,
              "allowNavigation": [
                "manlungrecovery.manlungshop.co.ke",
                "accounts.google.com",
                "github.com"
              ]
            },
            "android": {
              "allowMixedContent": false
            }
          }
          JSON
          mkdir -p assets
          curl --fail --silent --show-error --location             "https://manlungrecovery.manlungshop.co.ke/icons/icon-512.png"             --output /tmp/manlung-icon.png
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          await sharp('/tmp/manlung-icon.png')
            .resize(1024, 1024, { fit: 'contain', background: '#ffffff' })
            .png()
            .toFile('assets/icon.png');
          NODE
          npx cap add android
          npx capacitor-assets generate --android
          cd android
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/ManlungRecovery.apk"

      - name: Publish latest APK download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view android-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload android-latest ManlungRecovery.apk --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit android-latest --title "Manlung Recovery Android APK" --notes "Latest installable Android package for Manlung Recovery. Automatically rebuilt from main-branch updates. Uses the official Manlung Recovery icon and opens the live website, so web content updates appear when the device is online. APK replacement is published here; Android may still require the user to approve installation. This direct-download APK is not Play Store verified." --repo "$GITHUB_REPOSITORY"
          else
            gh release create android-latest ManlungRecovery.apk --title "Manlung Recovery Android APK" --notes "Installable Android package for Manlung Recovery. Automatically rebuilt from main-branch updates. Uses the official Manlung Recovery icon and opens the live website, so web content updates appear when the device is online. APK replacement is published here; Android may still require the user to approve installation. This direct-download APK is not Play Store verified." --repo "$GITHUB_REPOSITORY"
          fi
