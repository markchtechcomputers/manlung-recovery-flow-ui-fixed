name: Apply mobile service modal scroll fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch homepage service modal
        shell: python
        run: |
          from pathlib import Path

          path = Path("public/index.html")
          text = path.read_text(encoding="utf-8")

          marker = "/* Manlung mobile service detail scroll fix */"
          if marker in text:
              print("Mobile service scroll fix already present.")
              raise SystemExit(0)

          css = '''
          <style id="manlung-mobile-service-scroll">
          /* Manlung mobile service detail scroll fix */
          @media (max-width: 650px) {
            #serviceModalOverlay {
              align-items: flex-start !important;
              justify-content: center !important;
              padding: 1rem .65rem !important;
              overflow-y: auto !important;
              -webkit-overflow-scrolling: touch !important;
            }

            #serviceModalOverlay > div {
              width: 100% !important;
              max-width: 640px !important;
              max-height: calc(100dvh - 2rem) !important;
              overflow: hidden !important;
              padding: 1rem !important;
              display: flex !important;
              flex-direction: column !important;
            }

            #serviceModalBody {
              min-height: 0 !important;
              max-height: calc(100dvh - 4rem) !important;
              overflow-y: auto !important;
              overflow-x: hidden !important;
              -webkit-overflow-scrolling: touch !important;
              overscroll-behavior: contain !important;
              padding-right: .35rem !important;
              scrollbar-width: auto !important;
              scrollbar-color: #64748b rgba(100,116,139,.15) !important;
            }

            #serviceModalBody::-webkit-scrollbar {
              width: 8px !important;
            }

            #serviceModalBody::-webkit-scrollbar-track {
              background: rgba(100,116,139,.15) !important;
              border-radius: 8px !important;
            }

            #serviceModalBody::-webkit-scrollbar-thumb {
              background: #64748b !important;
              border-radius: 8px !important;
              border: 1px solid rgba(255,255,255,.35) !important;
            }

            #serviceModalBody::-webkit-scrollbar-thumb:hover {
              background: #475569 !important;
            }
          }
          </style>
          '''

          if "</head>" not in text:
              raise SystemExit("Could not find </head> in public/index.html")

          text = text.replace("</head>", css + "\n</head>", 1)
          path.write_text(text, encoding="utf-8")
          print("Mobile service scroll CSS injected.")

      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git rm .github/workflows/fix-mobile-service-scroll.yml
          git commit -m "Fix mobile service detail scrolling"
          git push origin HEAD:main
