name: Apply Platform Completion Patch

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-platform-completion.js'
      - 'server.js'
      - 'routes/auth.js'
      - 'routes/platform.js'
      - 'db/migrations/015_platform_completion.sql'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/apply-platform-completion.js
      - name: Commit patched application files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js routes/auth.js routes/platform.js scripts/apply-platform-completion.js db/migrations/015_platform_completion.sql
          git diff --cached --quiet || git commit -m 'feat: wire durable session invalidation and platform health [skip ci]'
          git push
