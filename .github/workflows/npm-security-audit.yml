name: NPM Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Export resolved lockfile for one-time lockfile repair
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const encoded = fs.readFileSync('package-lock.json').toString('base64');
          for (let i = 0, part = 0; i < encoded.length; i += 3000, part++) {
            console.log('LOCKFILE_PART_' + String(part).padStart(3, '0') + ':' + encoded.slice(i, i + 3000));
          }
          NODE
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=high
