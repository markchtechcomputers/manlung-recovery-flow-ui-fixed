name: Enforce login lockout policy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  enforce-lockout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify per-account lockout implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          user = Path('models/User.js').read_text()
          server = Path('server.js').read_text()
          required_user = [
              'MAX_LOGIN_FAILURES = 3',
              'LOCKOUT_MINUTES = 30',
              'login_locked_until',
              'failed_login_attempts',
          ]
          for marker in required_user:
              if marker not in user:
                  raise SystemExit(f'Missing required lockout marker: {marker}')
          # A short IP limiter is allowed as defense-in-depth; the authoritative lockout remains per-account.
          if 'const loginLimiter = rateLimit' in server:
              print('Additional IP login limiter detected; per-account 30-minute lockout remains authoritative.')
          print('Per-account persistent 3-attempt / 30-minute lockout policy verified.')
          PY
