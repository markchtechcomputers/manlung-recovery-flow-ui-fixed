name: Test Manlung Recovery OAuth and Routes

on:
  push:
    branches: [main, owner-security-monitoring, hotfix/api-startup-diagnostic-20261103, fix/oauth-clean-routes-20261105]
  pull_request:
    branches: [main, owner-security-monitoring]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run regression and security tests
        run: npm test
      - name: Validate build
        run: npm run build
